const W = 360, BASE_H = 640;


function safeInsets(){
  const el = document.getElementById('sa');
  if (!el) return { t: 0, b: 0, l: 0, r: 0 };
  const c = getComputedStyle(el);
  const n = (v) => Math.max(0, Math.round(parseFloat(v) || 0));
  return { t: n(c.paddingTop), b: n(c.paddingBottom), l: n(c.paddingLeft), r: n(c.paddingRight) };
}
let H = BASE_H;
(function initH(){
  const ins = safeInsets();
  const vw = (window.innerWidth || 360) - ins.l - ins.r;
  const vh = (window.innerHeight || 640) - ins.t - ins.b;
  H = Math.round(Math.min(800, Math.max(620, W * vh / Math.max(1, vw))));
})();



const CH_W = 96, CH_H = 46, CH_GX = 10, CH_GY = 8;
const CH_X0 = (W - (CH_W*3 + CH_GX*2)) / 2;
const CH_BLOCK = CH_H * 2 + CH_GY;          
const CH_Y0 = H - CH_BLOCK - 26;

  hud:    { x:0,  y:0,   w:360, h:44  },

const cv = document.getElementById('c');

let ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  
  const ins = safeInsets();
  const aw = Math.max(1, vw - ins.l - ins.r), ah = Math.max(1, vh - ins.t - ins.b);
  scale = Math.min(aw / W, ah / H);
  const dw = W * scale, dh = H * scale;
  offX = ins.l + (aw - dw) / 2; offY = ins.t + (ah - dh) / 2;
  cv.style.width = vw + 'px';
  cv.style.height = vh + 'px';
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function toLocal(cx, cy){
  return { x: (cx - offX) / scale, y: (cy - offY) / scale };
}


let audio = null, muted = false;
function initAudio(){
  if (audio) return;
  try {
    
    if (navigator.audioSession) navigator.audioSession.type = 'ambient';
  } catch(e) {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    
    try {
      master = audio.createDynamicsCompressor();
      master.threshold.value = -14; master.knee.value = 18; master.ratio.value = 6;
      master.attack.value = 0.002; master.release.value = 0.12;
      master.connect(audio.destination);
    } catch(e) { master = null; }
    
    const b = audio.createBuffer(1, 1, 22050);
    const s = audio.createBufferSource();
    s.buffer = b; s.connect(audio.destination); s.start(0);
  } catch(e) { audio = null; }
}
let master = null;
function out(){ return master || audio.destination; }
function tone(freq, dur, type, vol, delay){
  if (!audio || muted) return;
  try {
    const t = audio.currentTime + (delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((vol == null ? CONFIG.VOL : vol), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out());
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e) {}
}

let noiseBuf = null;
function getNoise(){
  if (!audio) return null;
  if (!noiseBuf) {
    const n = Math.floor(audio.sampleRate * 1.0);
    noiseBuf = audio.createBuffer(1, n, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function noiseHit(dur, f0, f1, q, vol, type, delay){
  if (!audio || muted) return;
  try {
    const t = audio.currentTime + (delay || 0);
    const src = audio.createBufferSource();
    src.buffer = getNoise(); src.loop = true;
    const flt = audio.createBiquadFilter();
    flt.type = type || 'bandpass';
    flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(out());
    src.start(t); src.stop(t + dur + 0.02);
  } catch(e){}
}

function sweep(f0, f1, dur, type, vol, delay){
  if (!audio || muted) return;
  try {
    const t = audio.currentTime + (delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out());
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}


function sfxSlash(n, d0){
  d0 = d0 || 0;
  for (let i = 0; i < n; i++) {
    const d = d0 + i * 0.085, k = 1 + i * 0.12;              
    noiseHit(0.13, 9000 * k, 1800, 0.9, 0.17, 'bandpass', d);          
    noiseHit(0.035, 5200 * k, 5200 * k, 6, 0.13, 'bandpass', d + 0.035); 
    sweep(3100 * k, 2300 * k, 0.11, 'sine', 0.05, d + 0.03);            
  }
}
function sfxHit(){
  const n = S.slashN || 1;
  sfxSlash(n);
  const d = (n - 1) * 0.085 + 0.045;
  noiseHit(0.17, 2200, 160, 0.7, 0.20, 'bandpass', d);   
  sweep(170, 46, 0.22, 'sine', 0.30, d);                 
  if (n >= 3) sfxCritical(d + 0.02);
}

  sweep(95, 28, 0.55, 'sine', 0.36, d + 0.02);
}

const BGM = { on: false, next: 0, bar: 0, timer: null, gain: null, ctx: null };
const BGM_BPM = 76, BGM_BAR = 60 / BGM_BPM * 4;
const BGM_CHORDS = [[62, 65, 69], [58, 62, 65], [55, 58, 62], [57, 62, 64]];   
const BGM_MEL = [   
  [[0, 74], [3, 77], [6, 81], [10, 79], [13, 77]],
  [[0, 74], [4, 72], [8, 74], [11, 69], [14, 72]],
  [[0, 77], [3, 79], [6, 81], [10, 84], [13, 81]],
  [[0, 79], [4, 77], [8, 74], [12, 76], [14, 77]],
];
function mid2f(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function bgmNote(ac, dest, t, f, dur, type, vol, atk, rel, cutoff){
  const o = ac.createOscillator(), g = ac.createGain(), flt = ac.createBiquadFilter();
  o.type = type; o.frequency.value = f;
  flt.type = 'lowpass'; flt.frequency.value = cutoff || 1200; flt.Q.value = 0.7;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + atk);
  g.gain.setValueAtTime(vol, t + Math.max(atk, dur - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(flt); flt.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
}
function bgmBar(ac, dest, t, bar){
  const ch = BGM_CHORDS[bar % 4];
  
  bgmNote(ac, dest, t, mid2f(ch[0] - 24), BGM_BAR + 0.3, 'sine', 0.16, 0.6, 0.6, 400);
  bgmNote(ac, dest, t, mid2f(ch[0] - 12) * 1.003, BGM_BAR + 0.3, 'triangle', 0.05, 0.9, 0.8, 500);
  
  ch.forEach((m, i) => bgmNote(ac, dest, t + 0.05 * i, mid2f(m), BGM_BAR + 0.2, 'triangle', 0.045, 1.2, 1.0, 900));
  
  const mel = BGM_MEL[bar % BGM_MEL.length], e8 = BGM_BAR / 8;
  for (const [pos, m] of mel) {
    const tt = t + pos * e8 / 2;
    bgmNote(ac, dest, tt, mid2f(m), 0.9, 'sine', 0.06, 0.01, 0.7, 3000);
    bgmNote(ac, dest, tt, mid2f(m) * 2, 0.5, 'sine', 0.018, 0.01, 0.4, 5000);
  }
}
function bgmStart(){
  if (!audio || BGM.on) return;
  try {
    BGM.on = true; BGM.ctx = audio;
    BGM.gain = audio.createGain();
    BGM.gain.gain.setValueAtTime(0.0001, audio.currentTime);
    BGM.gain.gain.exponentialRampToValueAtTime(1, audio.currentTime + 1.6);
    BGM.gain.connect(out());
    BGM.next = audio.currentTime + 0.05; BGM.bar = 0;
    BGM.timer = setInterval(bgmTick, 250);
    bgmTick();
  } catch(e) { BGM.on = false; }
}
function bgmTick(){
  if (!BGM.on || !audio) return;
  try {
    while (BGM.next < audio.currentTime + 1.0) {

const CODE_VER = 4;

function b36(n){ return Math.max(0, Math.round(n || 0)).toString(36); }
function codeSum(body){
  let t = 0;
  for (let i = 0; i < body.length; i++) t = (t * 31 + body.charCodeAt(i)) % 1296;
  return b36(Math.floor(t / 36)) + b36(t % 36);
}
function makeCode(){
  const f = [CODE_VER, save.lv, save.totalOk, save.bestSet, save.played];
  
  let mask = 0, seen = 0, dr = 0;
  STAGES.forEach((st, i) => { if (save.cleared && save.cleared[st.id]) mask |= (1 << i); if (save.seen && save.seen[st.id]) seen |= (1 << i); });
  DRAGONS.forEach((d, g) => { if (save.dragons && save.dragons['d' + g]) dr |= (1 << g); });
  f.push(mask); f.push(dr); f.push(seen);
  
  let lvs = '', best = '';
  STAGES.forEach((st, i) => { const lv = (save.lvs && save.lvs[st.id]) || 0; if (lv > 0) lvs += b36(i) + b36(lv); });
  STAGES.forEach((st, i) => { const b = (save.best && save.best[st.id]) || 0; if (b > 0) best += b36(i) + b36(b); });
  
  let bxs = '';
  DRAGONS.forEach((d, g) => { const e = bossExp(g); if (e > 0) bxs += b36(g) + b36(e) + '.'; });
  const body = f.map(b36).join('-') + '-' + (lvs || '0') + '-' + (best || '0') + (bxs ? '-' + bxs : '');
  return (body + '-' + codeSum(body)).toUpperCase();
}

function applyCode(raw){
  const t = String(raw || '').trim().toLowerCase().replace(/\s/g, '');
  if (!t) return false;
  
  if (t.indexOf('-') < 0) return applyKidCode(t);
  const parts = t.split('-');
  if (parts.length < 6) return false;
  const sum = parts.pop();
  const body = parts.join('-');
  if (codeSum(body) !== sum) return false;
  const lvStr = (parts[8] && parts[8] !== '0') ? parts[8] : '';   
  const bestStr = (parts[9] && parts[9] !== '0') ? parts[9] : '';    
  const bxStr = parts[10] || '';                                     
  const f = parts.slice(0, 8).map(x => parseInt(x, 36));
  if (f.some(x => !isFinite(x) || x < 0)) return false;
  if (f[0] !== CODE_VER && f[0] !== 3 && f[0] !== 1) return false;
  if (parts.length > 11 || (f[0] === 1 && parts.length > 5)) return false;

  save.lv = Math.min(CONFIG.LEVELS.length - 1, f[1] || 0);
  save.totalOk = f[2] || 0;
  save.bestSet = Math.min(CONFIG.QUESTIONS_PER_SET, f[3] || 0);
  save.played = f[4] || 0;
  save.pieces = {}; save.dragons = {}; save.cleared = {}; save.seen = {}; save.lvs = {}; save.best = {}; save.bx = {};
  if (f[0] === CODE_VER || f[0] === 3) {
    const mask = f[5] || 0, dr = f[6] || 0, seen = f[7] || 0;
    const lvMap = {}, bestMap = {};
    for (let k = 0; k + 1 < lvStr.length; k += 2) lvMap[parseInt(lvStr[k], 36)] = parseInt(lvStr[k + 1], 36);
    for (let k = 0; k + 1 < bestStr.length; k += 2) bestMap[parseInt(bestStr[k], 36)] = parseInt(bestStr[k + 1], 36);
    STAGES.forEach((st, i) => {
      if (mask & (1 << i)) save.cleared[st.id] = true;
      if (seen & (1 << i)) save.seen[st.id] = true;
      const b = bestMap[i] || 0;
      if (isFinite(b) && b > 0) save.best[st.id] = Math.min(CONFIG.QUESTIONS_PER_SET, b);
      const lv = lvMap[i] || 0;
      if (isFinite(lv) && lv > 0) save.lvs[st.id] = Math.min(CONFIG.LEVELS.length - 1, lv);
    });
    DRAGONS.forEach((d, g) => { if (dr & (1 << g)) save.dragons['d' + g] = 1; });
    
    if (bxStr) bxStr.split('.').forEach(seg => {
      if (seg.length < 2) return;
      const g = parseInt(seg[0], 36), e = parseInt(seg.slice(1), 36);
      if (isFinite(g) && isFinite(e) && g >= 0 && g < DRAGONS.length && e > 0) save.bx['d' + g] = Math.min(99999, e);
    });
  }
  
  if (f[0] === 1 && save.lvs.shape == null) save.lvs.shape = save.lv;
  putSave();
  S.lv = save.lv;
  return true;
}

const KID_A = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function kidUnits(){ return STAGES.filter(st => st.unlocked); }   
function makeKidCode(){
  const bits = [];
  const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  const us = kidUnits();
  push(Math.min(29, us.length), 5);
  us.forEach(st => {
    const b = (save.best && save.best[st.id]) || 0;
    const c = (save.cleared && save.cleared[st.id]) ? 1 : 0;
    push(b >= CONFIG.QUESTIONS_PER_SET ? 2 : (c ? 1 : 0), 2);
  });
  DRAGONS.forEach((d, g) => push(Math.max(0, Math.min(7, bossLv(g) - 1)), 3));
  while (bits.length % 5) bits.push(0);
  let out = '', sum = 0;
  for (let i = 0; i < bits.length; i += 5) {
    let v = 0;
    for (let k = 0; k < 5; k++) v = (v << 1) | bits[i + k];
    out += KID_A[v]; sum += v;
  }
  return out + KID_A[sum % 32];
}
function applyKidCode(raw){
  const t = String(raw || '').toUpperCase().split('').filter(c => KID_A.indexOf(c) >= 0).join('');
  if (t.length < 4) return false;
  const body = t.slice(0, -1), chk = t.slice(-1);
  let sum = 0;
  for (const c of body) sum += KID_A.indexOf(c);
  if (KID_A[sum % 32] !== chk) return false;
  const bits = [];
  for (const c of body) { const v = KID_A.indexOf(c); for (let k = 4; k >= 0; k--) bits.push((v >> k) & 1); }
  let i = 0;
  const take = (n) => { let v = 0; for (let k = 0; k < n; k++) v = (v << 1) | (bits[i++] || 0); return v; };
  const n = take(5);
  if (n < 1 || n > 29) return false;
  if (bits.length < 5 + n * 2 + DRAGONS.length * 3) return false;
  const us = kidUnits();
  const st2 = [];
  for (let k = 0; k < n; k++) st2.push(take(2));
  const lvs = [];
  for (let g = 0; g < DRAGONS.length; g++) lvs.push(take(3));
  
  save.cleared = {}; save.best = {}; save.dragons = {}; save.lvs = {}; save.seen = {}; save.pieces = {}; save.bx = {};
  us.forEach((st, k) => {
    const v = st2[k];
    if (v == null || v === 0) return;
    save.cleared[st.id] = true;
    save.best[st.id] = (v >= 2) ? CONFIG.QUESTIONS_PER_SET : CONFIG.CLEAR_MIN_OK;
  });
  DRAGONS.forEach((d, g) => {
    if (clearedSlots(g).length >= groupSize(g)) save.dragons['d' + g] = 1;
    
    let e = 0;
    for (let k = 1; k <= lvs[g]; k++) e += expNeed(k);
    if (e > 0) save.bx['d' + g] = e;
  });
  save.lv = 0;
  putSave();
  S.lv = 0;
  return true;
}

function basisIso(az, el){
  const th = az * Math.PI / 180, ph = el * Math.PI / 180;
  return {
    ex: [ Math.cos(th),  Math.sin(ph) * Math.sin(th) ],
    ey: [ 0,            -Math.cos(ph) ],
    ez: [ -Math.sin(th), Math.sin(ph) * Math.cos(th) ],
  };
}
function basisOblique(d, ang){
  const a = ang * Math.PI / 180;
  return {
    ex: [ 1, 0 ],
    ey: [ 0, -1 ],
    ez: [ -d * Math.cos(a), d * Math.sin(a) ],
  };
}

function playBasis(){
  return CONFIG.VIEW === 'oblique'
    ? basisOblique(CONFIG.OBLIQUE.depth, CONFIG.OBLIQUE.ang)
    : basisIso(CONFIG.ISO.az, CONFIG.ISO.el);
}

function proj(B, x, y, z){
  return [ B.ex[0]*x + B.ey[0]*y + B.ez[0]*z,
           B.ex[1]*x + B.ey[1]*y + B.ez[1]*z ];
}


function shapeTotal(g){
  let t = 0;
  for (let i = 0; i < g.length; i++) for (let j = 0; j < g.length; j++) t += g[i][j];
  return t;
}
function shapeSig(g){ return g.map(r => r.join('')).join('|'); }


function cubeList(g, B){
  const n = g.length, out = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    for (let y = 0; y < g[i][j]; y++) out.push({ i, j, y });
  }
  const kx = B.ex[1], kz = B.ez[1];   
  out.sort((a, b) => {
    const da = (kx*a.i + kz*a.j) * 1000 + a.y;
    const db = (kx*b.i + kz*b.j) * 1000 + b.y;
    return da - db;
  });
  return out;
}


function cubeFaces(B, i, y, j, S, ox, oy){
  const P = (x, yy, z) => {
    const p = proj(B, x, yy, z);
    return [ p[0]*S + ox, p[1]*S + oy ];
  };
  return {
    top:   [ P(i,y+1,j), P(i+1,y+1,j), P(i+1,y+1,j+1), P(i,y+1,j+1) ],
    left:  [ P(i,y,j+1), P(i,y+1,j+1), P(i+1,y+1,j+1), P(i+1,y,j+1) ],
    right: [ P(i+1,y,j), P(i+1,y+1,j), P(i+1,y+1,j+1), P(i+1,y,j+1) ],
  };
}

function pointInPoly(px, py, poly){
  let inside = false;
  for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
    const xa = poly[a][0], ya = poly[a][1], xb = poly[b][0], yb = poly[b][1];
    if ((ya > py) !== (yb > py) && px < (xb - xa) * (py - ya) / (yb - ya) + xa) inside = !inside;
  }
  return inside;
}




const TOP_PROBE = (() => {
  const d = CONFIG.TOP_INSET;
  return [[0.5,0.5],[d,d],[1-d,d],[d,1-d],[1-d,1-d]];
})();
function allTopsVisible(g, B){
  const n = g.length, S = 40, ox = 0, oy = 0;
  const cubes = cubeList(g, B);
  const faces = cubes.map(c => cubeFaces(B, c.i, c.y, c.j, S, ox, oy));
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const h = g[i][j];
    if (h === 0) continue;
    let idx = -1;
    for (let k = 0; k < cubes.length; k++) {
      if (cubes[k].i === i && cubes[k].j === j && cubes[k].y === h - 1) { idx = k; break; }
    }
    if (idx < 0) return false;
    for (const pr of TOP_PROBE) {
      const p = proj(B, i + pr[0], h, j + pr[1]);
      const cx = p[0]*S + ox, cy = p[1]*S + oy;
      for (let k = idx + 1; k < cubes.length; k++) {
        const f = faces[k];
        if (pointInPoly(cx, cy, f.top) || pointInPoly(cx, cy, f.left) || pointInPoly(cx, cy, f.right)) return false;
      }
    }
  }
  return true;
}



const ADD_PROBE = (() => {
  const d = CONFIG.ADD_INSET, o = [];
  for (const uv of [[0.5,0.5],[d,d],[1-d,d],[d,1-d],[1-d,1-d]]) o.push(uv);
  return o;
})();
function noInvisibleAddition(g, B){
  const n = g.length, S = 40;
  const base = cubeList(g, B);
  const baseFaces = base.map(c => cubeFaces(B, c.i, c.y, c.j, S, 0, 0));
  const kx = B.ex[1], kz = B.ez[1];
  const key = (i, j, y) => (kx*i + kz*j) * 1000 + y;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const y = g[i][j];
    const k0 = key(i, j, y);
    
    let from = base.length;
    for (let k = 0; k < base.length; k++) {
      if (key(base[k].i, base[k].j, base[k].y) > k0) { from = k; break; }
    }
    let seen = false;
    outer:
    for (const w of ['top', 'left', 'right']) {
      for (const uv of ADD_PROBE) {
        let p;
        if (w === 'top')   p = proj(B, i + uv[0], y + 1,      j + uv[1]);
        if (w === 'left')  p = proj(B, i + uv[0], y + uv[1],  j + 1);
        if (w === 'right') p = proj(B, i + 1,     y + uv[1],  j + uv[0]);
        const px = p[0]*S, py = p[1]*S;
        let covered = false;
        for (let k = from; k < base.length; k++) {
          const f = baseFaces[k];
          if (pointInPoly(px, py, f.top) || pointInPoly(px, py, f.left) || pointInPoly(px, py, f.right)) { covered = true; break; }
        }
        if (!covered) { seen = true; break outer; }
      }
    }
    if (!seen) return false;
  }
  return true;
}

function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

function growCells(n, k, backSeed){
  const cells = [];
  const seen = new Set();
  
  
  const lim = backSeed ? Math.max(0, Math.ceil(n/2) - 1) : n - 1;
  let cur = [ randInt(0, lim), randInt(0, lim) ];
  cells.push(cur); seen.add(cur[0] + ',' + cur[1]);
  const frontier = [];
  const push = (i, j) => {
    if (i < 0 || j < 0 || i >= n || j >= n) return;
    if (seen.has(i + ',' + j)) return;
    frontier.push([i, j]);
  };
  push(cur[0]+1, cur[1]); push(cur[0]-1, cur[1]); push(cur[0], cur[1]+1); push(cur[0], cur[1]-1);
  while (cells.length < k && frontier.length) {
    const idx = Math.floor(Math.random() * frontier.length);
    const c = frontier.splice(idx, 1)[0];
    if (seen.has(c[0] + ',' + c[1])) continue;
    seen.add(c[0] + ',' + c[1]); cells.push(c);
    push(c[0]+1, c[1]); push(c[0]-1, c[1]); push(c[0], c[1]+1); push(c[0], c[1]-1);
  }
  return cells;
}

const recent = [];
function genShape(lv){
  const s = CONFIG.LEVELS[lv];
  const B = playBasis();
  for (let t = 0; t < CONFIG.GEN_TRIES; t++) {
    const n = s.n;
    const g = [];
    for (let i = 0; i < n; i++) { g.push([]); for (let j = 0; j < n; j++) g[i].push(0); }
    const k = randInt(s.cellMin, Math.min(s.cellMax, n*n));
    const cells = growCells(n, k, CONFIG.STRICT_READABLE);
    if (cells.length < s.cellMin) continue;
    
    
    const kx = B.ex[1], kz = B.ez[1];
    cells.sort((a, b) => (kx*a[0] + kz*a[1]) - (kx*b[0] + kz*b[1]));
    for (const c of cells) {
      const i = c[0], j = c[1];
      let bound = s.hMax;
      if (i > 0 && g[i-1][j] > 0) bound = Math.min(bound, g[i-1][j] + 1);
      if (j > 0 && g[i][j-1] > 0) bound = Math.min(bound, g[i][j-1] + 1);
      g[i][j] = randInt(1, Math.max(1, bound));
    }
    const tot = shapeTotal(g);
    if (tot < s.totMin || tot > s.totMax) continue;
    if (s.hMax >= 2) {                       
      let hasTall = false;
      for (const c of cells) if (g[c[0]][c[1]] >= 2) hasTall = true;
      if (!hasTall) continue;
    }
    const sig = shapeSig(g);
    if (recent.indexOf(sig) >= 0) continue;
    if (!allTopsVisible(g, B)) continue;
    if (CONFIG.STRICT_READABLE && !noInvisibleAddition(g, B)) continue;
    recent.push(sig);
    if (recent.length > CONFIG.RECENT_MEMORY) recent.shift();
    return g;
  }
  
  const n = s.n, g = [];
  for (let i = 0; i < n; i++) { g.push([]); for (let j = 0; j < n; j++) g[i].push(0); }
  for (let i = 0; i < n; i++) g[i][0] = Math.min(s.hMax, n - i);
  return g;
}


function fitFor(g, B, area){
  const n = g.length;
  let iMin = n, iMax = 0, jMin = n, jMax = 0, hMax = 1, any = false;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (g[i][j] > 0) {
      any = true;
      if (i < iMin) iMin = i; if (i+1 > iMax) iMax = i+1;
      if (j < jMin) jMin = j; if (j+1 > jMax) jMax = j+1;
      if (g[i][j] > hMax) hMax = g[i][j];
    }
  }
  if (!any) { iMin = 0; iMax = 1; jMin = 0; jMax = 1; }
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const x of [iMin, iMax]) for (const y of [0, hMax]) for (const z of [jMin, jMax]) {
    const p = proj(B, x, y, z);
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
  }
  const spanX = Math.max(maxX - minX, 0.001), spanY = Math.max(maxY - minY, 0.001);
  let S = Math.min(area.w * CONFIG.FIT_MARGIN / spanX, area.h * CONFIG.FIT_MARGIN / spanY);
  S = Math.min(S, area.maxPx || CONFIG.CUBE_MAX_PX);
  const ox = area.x + area.w/2 - (minX + maxX)/2 * S;
  const oy = area.y + area.h/2 - (minY + maxY)/2 * S;
  return { S, ox, oy };
}


function poly(pts, fill, stroke, lw){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || CONFIG.EDGE_W; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawShape(g, B, fit, opt){
  opt = opt || {};
  const hi = opt.hi;
  
  const pal = opt.pal || null;
  const dead = opt.dead || null;
  const cubes = cubeList(g, B);
  const flat = Math.abs(B.ey[1]) < 0.06;   
  for (const c of cubes) {
    if (dead && dead[c.i + ',' + c.y + ',' + c.j]) continue;
    const f = cubeFaces(B, c.i, c.y, c.j, fit.S, fit.ox, fit.oy);
    const lit = hi && hi.i === c.i && hi.j === c.j;
    if (pal) {
      if (!flat) { poly(f.left, pal.left, pal.edge); poly(f.right, pal.right, pal.edge); }
      poly(f.top, pal.top, pal.edge);
      continue;
    }
    if (!flat) {
      poly(f.left,  lit ? CONFIG.C_HI_L : CONFIG.C_LEFT,  CONFIG.C_EDGE);
      poly(f.right, lit ? CONFIG.C_HI_R : CONFIG.C_RIGHT, CONFIG.C_EDGE);
    }
    const isTop = (c.y === g[c.i][c.j] - 1);
    poly(f.top, lit ? (isTop ? CONFIG.C_HI_T : CONFIG.C_HI_L) : CONFIG.C_TOP, CONFIG.C_EDGE);
  }
  if (opt.marks) {
    for (const m of opt.marks) {
      const p = proj(B, m.i + 0.5, g[m.i][m.j], m.j + 0.5);
      const x = p[0]*fit.S + fit.ox, y = p[1]*fit.S + fit.oy;
      const r = Math.max(11, fit.S * 0.30) * (m.pop == null ? 1 : m.pop);
      if (r < 1) continue;
      ctx.save();
      ctx.globalAlpha = m.alpha == null ? 1 : m.alpha;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fillStyle = m.color || CONFIG.C_INK; ctx.fill();
      text(String(g[m.i][m.j]), x, y + 0.5, Math.round(r * 1.25), '#ffffff');
      ctx.restore();
    }
  }
}




const VIS_UV = [0.06, 0.28, 0.5, 0.72, 0.94];
function faceSamples(q){
  
  const out = [];
  for (const u of VIS_UV) for (const v of VIS_UV) {
    const x = (1-u)*(1-v)*q[0][0] + u*(1-v)*q[1][0] + u*v*q[2][0] + (1-u)*v*q[3][0];
    const y = (1-u)*(1-v)*q[0][1] + u*(1-v)*q[1][1] + u*v*q[2][1] + (1-u)*v*q[3][1];
    out.push([x, y]);
  }
  return out;
}
function visibleFlags(g, B){
  const S0 = 40;
  const cubes = cubeList(g, B);        
  const faces = cubes.map(c => cubeFaces(B, c.i, c.y, c.j, S0, 0, 0));
  const flags = new Array(cubes.length).fill(false);
  for (let k = 0; k < cubes.length; k++) {
    const f = faces[k];
    let seen = false;
    for (const key of ['top', 'left', 'right']) {
      for (const p of faceSamples(f[key])) {
        let covered = false;
        for (let m = k + 1; m < cubes.length && !covered; m++) {
          const o = faces[m];
          if (pointInPoly(p[0], p[1], o.top) || pointInPoly(p[0], p[1], o.left) || pointInPoly(p[0], p[1], o.right)) covered = true;
        }
        if (!covered) { seen = true; break; }
      }
      if (seen) break;
    }
    flags[k] = seen;
  }
  return { cubes, flags };
}


function visibleCubeCount(g, B){
  const { flags } = visibleFlags(g, B);
  let n = 0;
  for (const f of flags) if (f) n++;
  return n;
}


function visiblePerColumn(g, B){
  const { cubes, flags } = visibleFlags(g, B);
  const out = {};
  for (let k = 0; k < cubes.length; k++) {
    const key = cubes[k].i + ',' + cubes[k].j;
    out[key] = (out[key] || 0) + (flags[k] ? 1 : 0);
  }
  return out;
}


function columnCount(g){
  let n = 0;
  for (let i = 0; i < g.length; i++) for (let j = 0; j < g.length; j++) if (g[i][j] > 0) n++;
  return n;
}

  } else if (kind === 'cols') {

  } else {
    push(vis);

    push(answer - 1); push(answer + 1);

    push(answer - 3); push(answer + 3);
  }
  
  for (let d = 1; cand.length < CONFIG.CHOICES - 1 && d < 30; d++) { push(answer - d); push(answer + d); }

  const picked = cand.slice(0, CONFIG.CHOICES - 1);

const MAGIC_BASE = [[2,9,4],[7,5,3],[6,1,8]];

function magicSym(m, k, n){
  n = n || m.length;
  const idx = [...Array(n).keys()];
  
  let a = m.map(r => r.slice());
  if (k >= 4) a = idx.map(i => idx.map(j => m[j][i]));
  for (let t = 0; t < (k % 4); t++) a = idx.map(i => idx.map(j => a[n - 1 - j][i]));
  return a;
}
function magicLines(n){

  const idx = [...Array(n).keys()];
  const L = [];
  for (let r = 0; r < n; r++) L.push({ kind:'row', cells: idx.map(c => ({ r, c })) });
  for (let c = 0; c < n; c++) L.push({ kind:'col', cells: idx.map(r => ({ r, c })) });
  L.push({ kind:'diag', cells: idx.map(i => ({ r:i, c:i })) });
  L.push({ kind:'diag', cells: idx.map(i => ({ r:i, c:n-1-i })) });
  return L;
}

function magicFourGen(lv){

function magicGen(lv, kind){
  kind = kind || 'cell';

      hidden.push({ r: rs[randInt(0, 1)], c: cs[randInt(0, 1)] });

function magicChoices(g, answer, kind){
  const n = g.n || 3;
  const idx = [...Array(n).keys()];
  const out = [answer], push = v => { if (v > 0 && v < 400 && !out.includes(v) && out.length < CONFIG.CHOICES) out.push(v); };
  if (kind === 'sum') {
    push(g.sum - g.a); push(g.sum + g.a); push(g.sum - 1); push(g.sum + 1);
    push(g.sum - 3 * g.a); push(g.sum + 3 * g.a); push(g.sum - 2); push(g.sum + 2);
  } else {
    const { r, c } = g.ask, m = g.m;
    const rowKnown = idx.filter(cc => cc !== c && !magicHas(g.hidden, r, cc)).map(cc => m[r][cc]);
    const colKnown = idx.filter(rr => rr !== r && !magicHas(g.hidden, rr, c)).map(rr => m[rr][c]);
    
    for (const v of rowKnown) push(g.sum - v);
    for (const v of colKnown) push(g.sum - v);
    
    push(answer - g.a); push(answer + g.a); push(answer - 1); push(answer + 1);
    
    for (const v of rowKnown) push(v);
    push(answer + 2 * g.a); push(answer - 2 * g.a); push(answer + 2); push(answer - 2);
  }
  let k = 1;
  while (out.length < CONFIG.CHOICES) { push(answer + k); push(answer - k); k++; }
  
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = out[i]; out[i] = out[j]; out[j] = x; }
  return out;
}

function magicDrawGrid(area, g, opt){

  const ox = area.x + area.w/2 - n * cs / 2, oy = area.y + area.h/2 - n * cs / 2;

  }

  return { ox, oy, cs };

function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}


function numChoices(answer, wrongs, opt){
  opt = opt || {};
  const trapMax = (opt.traps != null) ? opt.traps : 1;
  const span = Math.max(3, Math.round(answer * 0.5) + 2);
  const near = (v) => Math.abs(v - answer) <= span;
  const out = [answer];
  const push = (v) => {
    if (v > 0 && v < 1000 && Number.isInteger(v) && !out.includes(v) && out.length < CONFIG.CHOICES) { out.push(v); return true; }
    return false;
  };
  const list = (wrongs || []).filter(v => v !== answer);
  list.filter(near).forEach(push);
  let traps = 0;
  for (const v of list) { if (near(v)) continue; if (traps >= trapMax) break; if (push(v)) traps++; }
  let k = 1;
  while (out.length < CONFIG.CHOICES && k < 60) { push(answer + k); push(answer - k); k++; }
  return shuffleArr(out);
}

function fieldGen(lv){
  const [lo, hi] = FIELD_LV[Math.min(lv, 4)];
  let c = [lo, lo, lo];
  for (let t = 0; t < 60; t++) {
    c = [randInt(lo, hi), randInt(lo, hi), randInt(lo, hi)];
    const d = Math.max(c[0], c[1], c[2]) - Math.min(c[0], c[1], c[2]);
    if (d >= 1 && d <= 6) break;
  }
  const mx = Math.max(c[0], c[1], c[2]), mn = Math.min(c[0], c[1], c[2]);
  const d = mx - mn;
  const bag = [];
  for (let k = 0; k < 3; k++) for (let i = 0; i < c[k]; i++) bag.push(k);
  const items = shuffleArr(bag);
  const cols = 6;
  
  const pts = items.map((k, i) => ({
    k, cx: i % cols, cy: Math.floor(i / cols),
    jx: Math.random() * 0.44 - 0.22, jy: Math.random() * 0.44 - 0.22,
  }));
  return { g: { c, pts, cols, rows: Math.ceil(items.length / cols), n: items.length, mx, mn },
    answer: d, kind: 'field',
    choices: numChoices(d, [mx, mn, d + 1, Math.max(1, d - 1), c[1], d + 2]) };
}
function fieldShape(k, x, y, s, fill, edge, lw){
  ctx.beginPath();
  if (k === 0) ctx.arc(x, y, s, 0, Math.PI * 2);
  else if (k === 1) { ctx.rect(x - s * 0.88, y - s * 0.88, s * 1.76, s * 1.76); }
  else { ctx.moveTo(x, y - s); ctx.lineTo(x + s, y + s * 0.8); ctx.lineTo(x - s, y + s * 0.8); ctx.closePath(); }
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = edge; ctx.lineWidth = lw; ctx.stroke();
}

const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
function weekName(i){ return WEEK[((i % 7) + 7) % 7] + 'よう日'; }

function weekGen(lv, kind){ return uPick('week', 5, () => weekGen1(lv, kind)); }
function weekGen1(lv, kind){
  
  
  const start = randInt(0, 6);
  const k = (kind === 'after' && lv >= 2) ? 'after' : 'date';
  
  const R = (k === 'after')
    ? [[8, 20], [8, 20], [8, 20], [8, 31], [15, 45]][Math.min(lv, 4)]
    : [[9, 14], [9, 21], [9, 28], [15, 30], [22, 30]][Math.min(lv, 4)];
  let day = randInt(R[0], R[1]);
  const diff = (k === 'after') ? day : day - 1;
  if (diff < 8) day += 8;                       
  if (k === 'date' && day > 30) day = 30;       
  const g = { start, day, k };
  const idx = (start + ((k === 'after') ? g.day : g.day - 1)) % 7;
  return { g, answer: weekName(idx), kind: k, choices: weekChoices(idx, start) };
}

function weekChoices(idx, start){
  const out = [weekName(idx), weekName(idx + 1), weekName(idx - 1)];
  if (start != null && out.indexOf(weekName(start)) < 0) out.push(weekName(start));
  const rest = shuffleArr([0, 1, 2, 3, 4, 5, 6].map(weekName).filter(w => out.indexOf(w) < 0));
  while (out.length < CONFIG.CHOICES) out.push(rest.pop());
  return shuffleArr(out);
}
function weekInfo(g){
  const diff = (g.k === 'after') ? g.day : g.day - 1;
  const q = Math.floor(diff / 7), r = diff % 7;
  return { diff, q, r, base: (g.k === 'after') ? q * 7 : q * 7 + 1, idx: (g.start + diff) % 7 };
}

function weekCellNum(g, r, c){ return r * 7 + c - g.start + (g.k === 'after' ? 0 : 1); }

function weekRows(g, expand){
  const info = weekInfo(g), first = (g.k === 'after') ? 0 : 1;
  const rowOf = (n) => Math.floor((n - first + g.start) / 7);
  const tRow = rowOf(info.diff + first), bRow = rowOf(info.base);
  if (!expand) return [0];
  const out = [];
  if (tRow <= 3) { for (let r = 0; r <= tRow; r++) out.push(r); return out; }
  out.push(0, 1);
  if (bRow > 2) out.push('gap');
  for (let r = Math.max(2, bRow); r <= tRow; r++) out.push(r);
  return out;
}
function weekCellLabel(g, n){
  if (g.k === 'after') return n === 0 ? 'きょう' : String(n);
  return String(n);
}
function weekDraw(area, opt){
  opt = opt || {};
  const g = opt.g || S.g;
  const info = weekInfo(g);
  const list = weekRows(g, !!opt.expand);
  const rows = list.length;
  const cs = Math.min((area.w - 16) / 7, (area.h - 124) / (rows + 0.5), 44);
  const head = opt.expand ? 0 : 20;              
  const blockH = 14 + head + cs * rows + 34 + 44;
  const top = area.y + Math.max(8, (area.h - blockH) / 2);
  const ox = W / 2 - cs * 3.5, oy = top + 16 + head;
  
  
  const target = info.diff + (g.k === 'after' ? 0 : 1);   
  const first0 = (g.k === 'after') ? 0 : 1;
  
  const showNum = (n, c) => {
    if (opt.nums === 'all') return true;
    if (opt.fill != null && n >= first0 && n <= opt.fill) return true;
    if (c === g.start) return opt.colMax != null && n <= opt.colMax;
    return !!opt.walk && n >= info.base && n <= target;
  };
  ctx.save();
  for (let c = 0; c < 7; c++) {
    const col = c === 0 ? '#cf5b4e' : (c === 6 ? '#4a7fbf' : CONFIG.C_INK_SOFT);
    text(WEEK[c], ox + c * cs + cs / 2, oy - 13, 12, col, 'center', '700');
  }
  for (let k = 0; k < rows; k++) {
   const r = list[k], y = oy + k * cs;
   if (r === 'gap') { text('…', W / 2, y + cs / 2, 20, CONFIG.C_INK_SOFT, 'center', '700'); continue; }
   for (let c = 0; c < 7; c++) {
    const x = ox + c * cs;
    const n = weekCellNum(g, r, c);
    const has = (g.k === 'after') ? (n >= 0) : (n >= 1);
    
    const isBase = (opt.base && n === info.base && has);
    const isFirst = (n === (g.k === 'after' ? 0 : 1) && has);   
    const isTarget = opt.target && n === target && has;
    const inCol = opt.col && c === g.start && has;
    const step = (opt.walk && has && n > info.base && n <= target) ? (n - info.base) : 0;
    rrect(x + 2, y + 2, cs - 4, cs - 4, 6);
    const markFirst = !showNum(n, c) && isFirst;
    ctx.fillStyle = (opt.land && isTarget) ? '#dff3e3'
      : (isTarget ? '#fff1bd' : ((isBase || markFirst) ? CONFIG.C_HI_T : (step ? 'rgba(122,196,146,0.28)' : (inCol ? 'rgba(255,214,120,0.40)' : '#ffffff'))));
    ctx.fill();
    ctx.strokeStyle = (isTarget || isBase || markFirst) ? CONFIG.C_GOLD : CONFIG.C_GRID;
    ctx.lineWidth = (isTarget || isBase || markFirst) ? 2.6 : 1.2;
    ctx.stroke();
    if (!has) continue;
    if (showNum(n, c)) {
      const lab = weekCellLabel(g, n);
      text(lab, x + cs / 2, y + cs / 2 + 1, Math.round(cs * (lab.length > 2 ? 0.27 : 0.38)), CONFIG.C_INK);
    } else if (isFirst) {
      text(g.k === 'after' ? 'きょう' : '1日', x + cs / 2, y + cs / 2 + 1, 11, CONFIG.C_INK, 'center', '700');
    } else {
      
    }
    if (step) text(String(step), x + cs / 2, y + cs - 4, 9, '#3f7a52', 'center', '700');
   }
  }
  
  if (opt.colMax != null) {
    const side = (g.start <= 5) ? 1 : -1;
    const cx = ox + g.start * cs + cs / 2;
    ctx.save();
    for (let k = 1; k < rows; k++) {
      const r0 = list[k - 1], r1 = list[k];
      if (r0 === 'gap' || r1 === 'gap' || r1 !== r0 + 1) continue;
      const n1 = weekCellNum(g, r1, g.start);
      if (!showNum(n1, g.start) || n1 <= first0) continue;
      const my = oy + k * cs;
      const lx = cx + side * (cs * 0.52 + 13);
      ctx.strokeStyle = CONFIG.C_GOLD; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx + side * cs * 0.34, my - 7); ctx.lineTo(cx + side * cs * 0.34, my + 7); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + side * cs * 0.34, my + 8);
      ctx.lineTo(cx + side * cs * 0.34 - 3, my + 3);
      ctx.lineTo(cx + side * cs * 0.34 + 3, my + 3);
      ctx.closePath(); ctx.fillStyle = CONFIG.C_GOLD; ctx.fill();
      
      rrect(lx - 13, my - 7, 26, 14, 7); ctx.fillStyle = CONFIG.C_BG; ctx.fill();
      text('＋7', lx, my + 1, 11, CONFIG.C_GOLD, 'center', '800');
    }
    ctx.restore();
  }

  let by = oy + cs * rows;
  
  if (opt.list) {
    const list = (g.k === 'after')
      ? '7日後・14日後・21日後 …'
      : '1日・8日・15日・22日 …';
    text(list, W / 2, by + 20, 13, CONFIG.C_GOLD, 'center', '700');
    by += 20;
  }
  
  
  const label = (g.k === 'after') ? (g.day + '日後 は ？') : (g.day + '日 は ？');
  
  if (!opt.expand && !opt.reveal) { ctx.restore(); return; }
  if (opt.reveal) {
    const sc = 0.6 + 0.4 * Math.min(1, Math.max(0, S.t) / 0.2);
    ctx.save(); ctx.translate(W / 2, by + 40); ctx.scale(sc, sc);
    text(opt.reveal, 0, 0, 24, CONFIG.C_OK);
    ctx.restore();
  } else {
    text(label, W / 2, by + 40, 22, CONFIG.C_INK, 'center', '700');
  }
  ctx.restore();
}
function weekTeachBegin(){
  
  const g = S.g, i = weekInfo(g);
  const startName = weekName(g.start);
  const after = (g.k === 'after');
  
  const d = (n) => after ? (n === 0 ? 'きょう' : (n + '日後')) : (n + '日');
  const first0 = after ? 0 : 1;
  const dayTxt = after ? (g.day + '日後') : (g.day + '日');
  const nth = (k) => first0 + 7 * k;
  const HOP_MAX = 3;
  const hops = Math.min(i.q, HOP_MAX);
  const folded = i.q > hops;                     
  
  const wshort = (k) => WEEK[((g.start + k) % 7 + 7) % 7];
  
  
  const walkTxt = ((i.r <= 4)
    ? Array.from({ length: i.r }, (_, k) => (k + 1) + '日すすむと' + wshort(k + 1)).join('、')
    : ('1日すすむと' + wshort(1) + '、…、' + i.r + '日すすむと' + wshort(i.r))) + 'です。';

  
  const msgs = [after
    ? ('きょうは' + startName + 'です。きょうは数えません。あしたが1日後です。\n1しゅうかんは、日・月・火・水・木・金・土の7日です。')
    : ('1日は' + startName + 'です。\n1しゅうかんは、日・月・火・水・木・金・土の7日です。'),
    'カレンダーでは、土のつぎの日を、下のだんの左はしに書きます。\nだから、' + d(first0 + 7) + 'は' + d(first0) + 'のすぐ下です。'];
  const labels = ['1しゅうかん', 'すぐ下'];                 
  const colMax = [first0, first0];               
  for (let k = 1; k <= hops; k++) {
    const head = (k === 1) ? ('7日たつと、また' + startName + 'になります。') : 'もう7日すすみます。';
    const lastHop = (k === hops) && !folded;
    if (!lastHop) {
      msgs.push(head + '\n' + d(nth(k - 1)) + 'から7日すすむと、' + d(nth(k)) + 'です。');
      labels.push('＋7');

function ordPerms(arr){
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  arr.forEach((v, i) => {
    const rest = arr.slice(0, i).concat(arr.slice(i + 1));
    for (const p of ordPerms(rest)) out.push([v].concat(p));
  });
  return out;
}
function ordMake(ids, n, sorted){
  const pool = shuffleArr(ids.slice()).slice(0, n);
  
  const fixed = (n === 4) ? pool[0] : null;
  const arr = (n === 4) ? pool.slice(1) : pool;
  const perms = ordPerms(arr);
  
  const missIdx = randInt(1, perms.length - 1);
  const full = (pm) => (fixed == null ? pm : [fixed].concat(pm));
  const left = perms.filter((_, i) => i !== missIdx).map(full);
  const shown = sorted ? left : shuffleArr(left);
  const miss = full(perms[missIdx]);
  return { fixed, arr, n, shown, miss, all: perms.map(full) };
}

function ordMakeCount(ids, mode){
  const n = (mode === 'fix3' || mode === 'free3') ? 3 : 4;
  const pool = shuffleArr(ids.slice()).slice(0, n);
  const firsts = (mode === 'fix3' || mode === 'fix4') ? [pool[0]]
    : (mode === 'two4' ? [pool[0], pool[1]] : null);
  return { count: true, mode, pool, firsts, n };
}
function ordCountAns(g){ return (g.firsts ? g.firsts.length : g.n) * ordFact(g.n - 1); }

function ordGen(lv, kind){
  const cfg = U06_LV[Math.min(lv, U06_LV.length - 1)];
  const ids = (Math.random() < cfg.mark) ? ORD_MARK : ORD_FRUIT;
  
  if (kind === 'count') {
    
    const modes = cfg.counts.filter(m => m !== ordGen.lastMode);
    const mode = modes[randInt(0, modes.length - 1)];
    ordGen.lastMode = mode;
    const g = ordMakeCount(ids, mode);
    const ans = ordCountAns(g), n = g.n;
    
    const noRule = g.firsts ? ordFact(n) : ordFact(n - 1);
    return { g, answer: ans, kind: 'count',
      
      choices: numChoices(ans, [noRule, n, ans + 2, Math.max(1, ans - 2), ans * 2, n + 1]) };
  }
  
  return uPick('u06miss', 3, () => {
    const n = cfg.ns[randInt(0, cfg.ns.length - 1)];
    const g = ordMake(ids, n, cfg.sorted);
    const choices = shuffleArr(g.all.map(o => ({ v: o.join(','), draw: (q, ink) => ordChoiceDraw(q, o) })));
    return { g, answer: g.miss.join(','), kind: 'miss', choices };
  });
}

function ordTree(ar, root, a, st, g){
  const L = a.length, perms = ordPerms(a), leaves = perms.length, grp = ordFact(L - 1);
  const rowH = Math.min(38, (ar.h - 50) / leaves);
  const top = ar.y + 30 + Math.min(24, Math.max(0, (ar.h - 50 - rowH * leaves) / 2));   
  const dx = Math.min(66, 250 / L), x0 = W / 2 - (L * dx) / 2 - 20;
  const s = Math.min(12, rowH * 0.34);
  const colX = (c) => x0 + c * dx;
  const yOf = (j, c) => { const m = ordFact(L - c); return top + (Math.floor(j / m) * m + m / 2) * rowH; };
  const full = (p) => (root == null ? p : [root].concat(p));
  const missKey = (st.miss && g) ? g.miss.join(',') : null;
  const shownKeys = (st.checks && g && g.shown) ? g.shown.map(o => o.join(',')) : [];
  
  const onMiss = (p, c) => !missKey
    || missKey.split(',').slice(0, (root == null ? 0 : 1) + c).join(',') === full(p.slice(0, c)).join(',');
  const heads = (root != null) ? ['1ばんめ', '2ばんめ', '3ばんめ', '4ばんめ'] : ['', '1ばんめ', '2ばんめ', '3ばんめ'];
  ctx.save();
  for (let c = (root != null ? 0 : 1); c <= L; c++) text(heads[c], colX(c), ar.y + 12, 10, CONFIG.C_INK_SOFT, 'center', '700');
  const ry = top + rowH * leaves / 2;
  if (root == null) { ctx.beginPath(); ctx.arc(colX(0), ry, s * 0.5, 0, Math.PI * 2); ctx.fillStyle = CONFIG.C_INK_SOFT; ctx.fill(); }
  else ordItem(root, colX(0), ry, s);
  perms.forEach((p, j) => {
    const b = Math.floor(j / grp);
    for (let c = 1; c <= L; c++) {
      if ((st.depth[b] || 0) < c) break;
      const m = ordFact(L - c);
      const y = yOf(j, c), py = (c === 1) ? ry : yOf(j, c - 1);
      const on = onMiss(p, c);
      ctx.save(); ctx.globalAlpha = on ? 1 : 0.2;
      ctx.strokeStyle = CONFIG.C_GOLD; ctx.lineWidth = (missKey && on) ? 2.4 : 1.5;
      ctx.beginPath(); ctx.moveTo(colX(c - 1) + s, py); ctx.lineTo(colX(c) - s, y); ctx.stroke();
      if (j % m === 0) ordItem(p[c - 1], colX(c), y, s);
      ctx.restore();
    }
    const yl = yOf(j, L), xr = colX(L) + s + 12;
    if ((st.depth[b] || 0) >= L && shownKeys.indexOf(full(p).join(',')) >= 0)
      text('✓', xr, yl, 15, CONFIG.C_OK, 'center', '800');
    if (st.seq && (st.depth[b] || 0) >= L) ordRow(full(p), xr + 44, yl, s * 0.62, null, 3.0);
  });
  if (st.sums && L === 3) for (let b = 0; b < 3; b++)
    text('2', colX(L) + s + 16, top + (b * 2 + 1) * rowH, 16, CONFIG.C_GOLD, 'center', '800');
  ctx.restore();
  return top + rowH * leaves;
}

function ordSum(ar, cands, n, sofar){

const CHOOSE_SET_F = [0, 1, 2, 3, 4, 5];      

const CHOOSE_SET_M = [10, 11, 16, 13, 14, 15]; 



const CHOOSE_LV = [
  { mark: 0.0, nk: [[3, 2], [4, 3], [4, 2], [5, 2]] },
  { mark: 0.0, nk: [[3, 2], [4, 2], [4, 3], [5, 4], [5, 2]] },
  { mark: 0.4, nk: [[4, 2], [4, 3], [5, 4], [5, 2], [3, 2]] },
  { mark: 0.5, nk: [[5, 2], [4, 2], [5, 4], [5, 3], [6, 5]] },
  { mark: 0.6, nk: [[5, 2], [5, 3], [6, 2], [4, 2], [6, 5]] },
];
function combos(n, k){
  const out = [];
  const rec = (start, cur) => {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let i = start; i < n; i++) { cur.push(i); rec(i + 1, cur); cur.pop(); }
  };
  rec(0, []);
  return out;
}
function choosePermCount(n, k){ let v = 1; for (let i = 0; i < k; i++) v *= (n - i); return v; }
function chooseGen(lv){
  const cfg = CHOOSE_LV[Math.min(lv, CHOOSE_LV.length - 1)];
  
  const hist = chooseGen.hist || (chooseGen.hist = []);
  const eqN = hist.filter(h => h.eq).length;
  let n, k;
  for (let t = 0; t < 40; t++) {
    [n, k] = cfg.nk[randInt(0, cfg.nk.length - 1)];
    const a = combos(n, k).length;
    if ((a === n && eqN >= 2) || hist.filter(h => h.a === a).length >= 2) continue;
    break;
  }
  const ids = shuffleArr(((Math.random() < cfg.mark) ? CHOOSE_SET_M : CHOOSE_SET_F).slice()).slice(0, n);
  const ans = combos(n, k).length;
  hist.push({ eq: ans === n, a: ans }); if (hist.length > 5) hist.shift();
  
  return { g: { ids, n, k }, answer: ans, kind: 'choose',
    choices: numChoices(ans, [n, k, choosePermCount(n, k), ans + 1, Math.max(1, ans - 1), n + k]) };
}

function chooseRow(ids, pick, cx, cy, s){
  const gap = s * 2.5, w = (ids.length - 1) * gap;
  ids.forEach((id, i) => {
    const x = cx - w / 2 + i * gap;
    const on = pick.indexOf(i) >= 0;
    ctx.save(); ctx.globalAlpha = on ? 1 : 0.2;
    ordItem(id, x, cy, s);
    ctx.restore();
    if (!on) {
      ctx.save(); ctx.strokeStyle = '#c15c4e'; ctx.lineWidth = Math.max(1.2, s * 0.2); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - s * 0.6, cy - s * 0.6); ctx.lineTo(x + s * 0.6, cy + s * 0.6);
      ctx.moveTo(x + s * 0.6, cy - s * 0.6); ctx.lineTo(x - s * 0.6, cy + s * 0.6); ctx.stroke();
      ctx.restore();
    }
  });
}

function chooseSame(ids, k, cy, es){

}

function chooseTeachBegin(){
  const g = S.g, n = g.n, k = g.k, k2 = n - k, ans = S.answer;
  const reframe = k > k2;
  const listK = reframe ? k2 : k;
  
  const msgs = ['この' + n + 'つから、' + k + 'こをえらびます。\n' + k + 'このくみは、何通りあるでしょう。'];
  const labels = [''];
  const steps = [{ rows: 0 }];
  if (reframe) {
    
    msgs.push(k + 'こをえらぶことは、' + k2 + 'こをえらばないことと同じです。'); labels.push('えらばない ' + k2 + 'こ'); steps.push({ one: true });
    msgs.push('✕がほかへうつると、えらぶ' + k + 'こもかわります。\nだから、えらばない' + k2 + 'こをきめれば、くみが1つきまります。'); labels.push('✕ が うごくと'); steps.push({ one: true, move: true });
  } else {
    msgs.push('じゅんばんがちがっても、同じくみです。\n同じくみは、2回数えません。'); labels.push('おなじ くみ'); steps.push({ same: true });
  }
  const head = reframe ? ('えらばない ' + k2 + 'こ') : ('えらぶ ' + k + 'こ');
  if (listK === 1) {
    msgs.push('えらばない1こは、' + n + 'つのどれかなので、**' + ans + '通り**です。'); labels.push(ans + '通り');
    steps.push({ rows: n, groups: 0 });
  } else {
    
    let done = 0;

    for (let a = 0; a < n - 1; a++) {
      const c = n - 1 - a;
      done += c; parts.push(c);
      msgs.push(a === 0
        ? (head + 'を、よこ1れつずつならべます。\nいちばん左のものとくむのは、右にある' + c + 'つなので、' + c + '通りです。')
        : ('左から' + (a + 1) + 'ばんめのものは、右にあるものとだけくみます。' + c + '通りです。\n左のものとのくみは、もう上にあるからです。'));
      labels.push(c + '通り'); steps.push({ rows: done, groups: a + 1 });
    }
    msgs.push(parts.join('＋') + '＝' + ans + 'なので、' + (reframe ? '**' + ans + '通り**です。' : '答えは **' + ans + '通り**です。')); labels.push(ans + '通り');
    steps.push({ rows: done, groups: n - 1, sum: true });
  }
  if (reframe) {
    msgs.push('よこ1れつが、1通りです。\nだから、' + k + 'このくみも、答えは **' + ans + '通り**です。'); labels.push(ans + '通り');
    const last = steps[steps.length - 1];
    steps.push(Object.assign({}, last, { box: true }));
  }
  return makeTeach(msgs.length - 1, msgs, labels, { g, listK, reframe, steps, mk: 'choose' });
}

const CODE_VALS = [16, 8, 4, 2, 1];
function codeBits(v, digits){
  const out = [];
  for (let i = CODE_VALS.length - digits; i < CODE_VALS.length; i++) out.push((v & CODE_VALS[i]) ? 1 : 0);
  return out;
}
const CODE_LV = [
  { digits: 4, add: 0.0, max: 15 },
  { digits: 4, add: 0.0, max: 15 },
  { digits: 4, add: 0.34, max: 15 },
  { digits: 5, add: 0.4, max: 24 },
  { digits: 5, add: 0.5, max: 31 },
];
function codeGen(lv, kind){
  const cfg = CODE_LV[Math.min(lv, CODE_LV.length - 1)];
  const digits = cfg.digits, top = Math.min(cfg.max, (1 << digits) - 1);
  if (kind === 'add' && cfg.add > 0) {
    
    let a = 2, b = 3;
    for (let t = 0; t < 40; t++) {
      const x = randInt(1, Math.floor(top / 2)), y = randInt(1, Math.floor(top / 2));
      if (x + y <= top) { a = x; b = y; break; }
    }
    const ans = a + b;
    return { g: { a, b, digits, add: true }, answer: ans, kind: 'add',
      choices: numChoices(ans, [a, b, ans + 1, Math.max(1, ans - 1), a * b, ans + 2]) };
  }
  
  const fullMask = (1 << digits) - 1;
  let v = randInt(1, top);
  if (v === fullMask) v = randInt(1, Math.max(1, top - 1));
  const bits = codeBits(v, digits);
  
  const rev = parseInt(bits.slice().reverse().join(''), 2) || v + 1;
  return { g: { v, digits, add: false }, answer: v, kind: 'read',
    choices: numChoices(v, [bits.reduce((a, b) => a + b, 0), rev, v + 1, Math.max(1, v - 1), v + 2]) };
}

function codeWrite(v, digits, cx, cy, s, opt){
  opt = opt || {};
  const bits = codeBits(v, digits);
  const gap = s * 1.9, w = (digits - 1) * gap;
  bits.forEach((b, i) => {
    const x = cx - w / 2 + i * gap;
    ctx.save();
    ctx.strokeStyle = (b === 1) ? CONFIG.C_GOLD : CONFIG.C_EDGE;
    ctx.lineWidth = (b === 1) ? s * 0.3 : s * 0.2; ctx.lineCap = 'round';
    if (b === 1) {
      ctx.beginPath(); ctx.moveTo(x, cy - s * 0.62); ctx.lineTo(x, cy + s * 0.62); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x, cy, s * 0.46, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    if (opt.vals) {
      text(String(CODE_VALS[CODE_VALS.length - digits + i]), x, cy - s * 1.36,
           Math.max(9, s * 0.62), (b === 1) ? CONFIG.C_GOLD : CONFIG.C_INK_SOFT, 'center', '800');
    }
  });
}
function codeDraw(area, opt){
  opt = opt || {};
  const g = opt.g || S.g;
  ctx.save();
  
  
  
  const boxW = area.w - 34, boxH = 62;
  const pitch = boxW / 2;
  const bs = Math.min(10, (pitch - 46) / (g.digits * 1.9));
  rrect(W / 2 - boxW / 2, area.y + 6, boxW, boxH, 9);
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
  ctx.strokeStyle = CONFIG.C_GRID; ctx.lineWidth = 1.3; ctx.stroke();
  for (let k = 1; k <= 4; k++) {
    const col = (k - 1) % 2, row = Math.floor((k - 1) / 2);
    const x = W / 2 - boxW / 2 + (col + 0.5) * pitch;
    const y = area.y + 22 + row * 28;
    const cw = (g.digits - 1) * bs * 1.9;
    text(String(k), x - cw / 2 - 14, y, 13, CONFIG.C_INK_SOFT, 'right', '800');
    codeWrite(k, g.digits, x + 6, y, bs);
  }
  
  
  const legendBottom = area.y + 6 + boxH + 12;
  
  const showVals = !!opt.vals;
  const topPad = showVals ? 1.5 : 0.7;                 
  
  const bottomUnits = (opt.reveal != null) ? 3.6 : 0.6;
  const totalUnits = topPad + bottomUnits;
  const availH = Math.max(40, (area.y + area.h) - legendBottom - 14);
  
  const PLUS_UNITS = 1.7;   
  const gapsNeeded = g.add ? ((g.digits - 1) * 2 + PLUS_UNITS) : (g.digits - 1);
  const wCap = Math.min(28, (area.w - 40) / Math.max(1, gapsNeeded) / 1.9);
  const s = Math.max(10, Math.min(wCap, availH / totalUnits));
  const cy = legendBottom + topPad * s;
  if (g.add) {
    
    const half = (g.digits - 1) * s * 1.9 / 2, plusGap = s * 1.9 * PLUS_UNITS;
    const xA = W / 2 - (half + plusGap / 2), xB = W / 2 + (half + plusGap / 2);
    codeWrite(g.a, g.digits, xA, cy, s, { vals: showVals });
    text('＋', W / 2, cy, 22, CONFIG.C_INK, 'center', '800');
    codeWrite(g.b, g.digits, xB, cy, s, { vals: showVals });
  } else {
    codeWrite(g.v, g.digits, W / 2, cy, s, { vals: showVals });
  }
  if (opt.reveal != null) text('＝ ' + opt.reveal, W / 2, cy + s * 3.0, 22, CONFIG.C_OK, 'center', '800');
  ctx.restore();
}

function u14Pile(area, total, groups){
  let cols = Math.min(6, Math.max(4, Math.ceil(total / 2)));
  if (cols === groups) cols = (cols >= 6) ? 5 : cols + 1;
  const rows = Math.ceil(total / cols);
  const s = Math.min(20, (area.w - 60) / cols / 1.9, (area.h - 24) / Math.max(1, rows) / 2.05);
  const gx = s * 1.9, gy = s * 2.05;
  const oy = area.y + (area.h - (rows - 1) * gy) / 2;
  ctx.save();
  for (let i = 0; i < total; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    const inRow = Math.min(cols, total - r * cols);   
    const x = W / 2 - (inRow - 1) * gx / 2 + c * gx, y = oy + r * gy;
    ctx.beginPath(); ctx.arc(x, y, s * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = '#8fb8e8'; ctx.fill();
    ctx.strokeStyle = CONFIG.C_EDGE; ctx.lineWidth = 1.4; ctx.stroke();

const U16_PAIRS = [[2, 5], [4, 25], [4, 5], [2, 15], [4, 15], [2, 25]];
const U16_CS = [
  [3, 7, 9, 11],
  [3, 7, 9, 11, 13],
  [3, 7, 9, 11, 13, 17],
  [7, 9, 11, 13, 17, 19],
  [7, 9, 11, 13, 17, 19, 21, 23],
];
const U16_LAST = [];
function u16Gen(lv){
  let p, q, c, key, arr, defs;
  for (let tries = 0; tries < 60; tries++){
    [p, q] = U16_PAIRS[randInt(0, Math.min(U16_PAIRS.length - 1, 1 + lv))];
    
    const cs = U16_CS[Math.min(lv, U16_CS.length - 1)];
    c = cs[randInt(0, cs.length - 1)];
    if (c === p || c === q) continue;             
    
    if ((c * p) % 10 === 0 || (c * q) % 10 === 0) continue;
    key = p + ':' + q + ':' + c;
    if (U16_LAST.includes(key)) continue;
    arr = [p, q, c];
    for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    const pairIdx = [[0, 1], [1, 2], [0, 2]];
    const niceVal = new Set([p, q]);
    defs = pairIdx.map(([i, j]) => ({ i, j, label: arr[i] + 'と' + arr[j],
      nice: niceVal.has(arr[i]) && niceVal.has(arr[j]) }));
    
    if (new Set(defs.map(d => d.label)).size === 3) break;
    defs = null;                                   
  }
  if (!defs) {                                      
    [p, q] = U16_PAIRS[0]; c = 3;
    arr = [p, q, c];
    const pairIdx = [[0, 1], [1, 2], [0, 2]];
    const niceVal = new Set([p, q]);
    defs = pairIdx.map(([i, j]) => ({ i, j, label: arr[i] + 'と' + arr[j],
      nice: niceVal.has(arr[i]) && niceVal.has(arr[j]) }));
    key = p + ':' + q + ':' + c;
  }
  U16_LAST.push(key); if (U16_LAST.length > 5) U16_LAST.shift();
  const correctDef = defs.find(d => d.nice) || defs[0];
  const total = p * q * c;
  const choices = shuffleArr(defs.map(d => ({ v: d.label, txt: d.label })));
  return { g: { arr, p, q, c, total, niceIdx: [correctDef.i, correctDef.j] },
    answer: correctDef.label, kind: 'u16', choices };
}

function digitChoices(d){

  for (const k of shuffleArr([1, 9, 2, 8, 5, 3, 7, 4, 6])) {

    const c = (d + k) % 10;
    if (!out.some(o => o.v === String(c))) out.push({ v: String(c), txt: String(c) });

  return shuffleArr(out);
}

const U22_DIG = [2, 2, 3, 3, 4];                  
function u22MushiGen(lv){
  const dg = U22_DIG[Math.min(lv, U22_DIG.length - 1)];
  const lo = Math.pow(10, dg - 1), hi = Math.pow(10, dg) - 1;
  for (let t = 0; t < 600; t++) {
    const sub = Math.random() < 0.5;
    let a, b, c;
    if (sub) { a = randInt(lo + 1, hi); b = randInt(lo, a - 1); c = a - b; }
    else { a = randInt(lo, hi - lo); b = randInt(lo, hi - a); c = a + b; }
    if (String(a).length !== dg || String(b).length !== dg || String(c).length !== dg) continue;
    const ri = randInt(0, 2), ci = randInt(0, dg - 1);
    const rows = [String(a), String(b), String(c)];
    const d = Number(rows[ri][ci]);
    
    if (ci === 0 && d === 0) continue;
    return { g: { a, b, c, sub, dg, ri, ci }, answer: String(d), kind: 'mushi', choices: digitChoices(d) };
  }
  return u22MushiGen(0);
}

const U22_PLACE = ['一', '十', '百', '千'];
function u22MushiPlan(g){
  const dg = g.dg;
  const rows = [String(g.a), String(g.b), String(g.c)];
  const pi = g.sub ? 1 : 0, qi = g.sub ? 2 : 1, ti = g.sub ? 0 : 2;   
  const P = rows[pi].split('').map(Number);
  const Q = rows[qi].split('').map(Number);
  const Tt = rows[ti].split('').map(Number);
  const which = (g.ri === pi) ? 'p' : (g.ri === qi) ? 'q' : 't';
  const steps = [];
  let carry = 0;
  for (let j = dg - 1; j >= 0; j--) {
    const place = U22_PLACE[dg - 1 - j] || '上';
    const hidden = (j === g.ci);
    if (hidden) {
      let eq, msg;
      if (which === 't') {
        const sm = P[j] + Q[j] + carry;
        eq = P[j] + '＋' + Q[j] + (carry ? '＋1' : '') + '＝' + sm;
        msg = place + 'のくらいを見ます。' + eq + 'なので、□は' + (sm % 10) + 'です。';
      } else {
        const known = (which === 'p') ? Q[j] : P[j];
        const need = Tt[j];
        const ans = ((need - known - carry) % 10 + 10) % 10;
        eq = '□＋' + known + (carry ? '＋1' : '') + ' の 答えの 一のくらいが ' + need;
        
        msg = place + 'のくらいを見ます。□＋' + known + (carry ? '＋1（くり上がり）' : '') + 'の答えの一のくらいが' + need + 'になる数をさがします。\n'
          + ans + '＋' + known + (carry ? '＋1' : '') + '＝' + (ans + known + carry) + 'なので、□は' + ans + 'です。';
      }
      steps.push({ j, place, eq, msg, hidden: true });
      break;
    }
    const sm = P[j] + Q[j] + carry;
    const eq = P[j] + '＋' + Q[j] + (carry ? '＋1' : '') + '＝' + sm;
    const msg = place + 'のくらいは' + eq + 'です。' +
      (sm >= 10 ? ('答えの' + place + 'のくらいは' + Tt[j] + 'で、1くり上がります。') : ('答えの' + Tt[j] + 'と合います。'));
    steps.push({ j, place, eq, msg, hidden: false });
    carry = (sm >= 10) ? 1 : 0;
  }
  return { steps, pi, qi, ti };
}

const U22_OPS = ['＋', '−', '×'];
function u22Eval(nums, ops){
  const terms = [nums[0]], signs = [1];
  for (let i = 0; i < ops.length; i++) {
    if (ops[i] === '×') terms[terms.length - 1] *= nums[i + 1];
    else { terms.push(nums[i + 1]); signs.push(ops[i] === '＋' ? 1 : -1); }
  }
  return terms.reduce((s, t, i) => s + signs[i] * t, 0);
}
function u22Perms(a){
  if (a.length <= 1) return [a];
  const out = [];
  a.forEach((v, i) => u22Perms(a.slice(0, i).concat(a.slice(i + 1))).forEach(p => out.push([v].concat(p))));
  return out;
}
function u22KomachiGen(lv){
  const hiN = [5, 6, 7, 8, 9][Math.min(lv, 4)];
  for (let t = 0; t < 200; t++) {
    const nums = [randInt(1, hiN), randInt(1, hiN), randInt(1, hiN), randInt(1, hiN)];
    const hit = [], near = [];
    const seen = {};
    u22Perms(nums).forEach(p => {
      for (const o1 of U22_OPS) for (const o2 of U22_OPS) for (const o3 of U22_OPS) {
        const ops = [o1, o2, o3];
        const v = u22Eval(p, ops);
        const str = p[0] + ops[0] + p[1] + ops[1] + p[2] + ops[2] + p[3];
        if (seen[str]) continue; seen[str] = 1;
        if (v === 10) hit.push(str);
        else if (v >= 6 && v <= 14) near.push(str);
      }
    });
    if (!hit.length || near.length < 2) continue;
    const good = hit[randInt(0, hit.length - 1)];
    const bad = shuffleArr(near.slice()).slice(0, 2);
    return { g: { nums }, answer: good, kind: 'komachi',
      choices: shuffleArr([{ v: good, txt: good }, { v: bad[0], txt: bad[0] }, { v: bad[1], txt: bad[1] }]) };
  }
  return u22KomachiGen(0);
}

function u22KomachiSteps(expr){
  const nums = expr.split(/[＋−×]/).map(Number);
  const ops = expr.replace(/[0-9]/g, '').split('');
  const out = [];
  
  let terms = [nums[0]], sg = [1], parts = [String(nums[0])];
  for (let i = 0; i < ops.length; i++) {
    if (ops[i] === '×') { terms[terms.length - 1] *= nums[i + 1]; parts[parts.length - 1] += '×' + nums[i + 1]; }
    else { terms.push(nums[i + 1]); sg.push(ops[i] === '＋' ? 1 : -1); parts.push(String(nums[i + 1])); }
  }
  const hasMul = parts.some(x => x.indexOf('×') >= 0);
  if (hasMul) {
    const shown = parts.map((x, i) => (sg[i] < 0 ? '−' : (i ? '＋' : '')) + x).join('');
    const done = terms.map((v, i) => (sg[i] < 0 ? '−' : (i ? '＋' : '')) + v).join('');
    out.push({ msg: '×は、＋や−より先に計算するきまりです。\n' + shown + 'は、' + done + 'になります。',
      lab: 'かける', line: done });
  }
  
  let pre = 0, neg = false;
  terms.forEach((v, i) => { pre += sg[i] * v; if (pre < 0) neg = true; });
  if (neg) {
    const idx = terms.map((_, i) => i);
    const order = idx.filter(i => sg[i] > 0).concat(idx.filter(i => sg[i] < 0));
    terms = order.map(i => terms[i]); sg = order.map(i => sg[i]);
    out.push({ msg: 'このままでは、左から計算すると ひけない所があります。\n先に、たし算をまとめてから ひきます。',
      lab: 'たし算を先に', line: terms.map((v, i) => (sg[i] < 0 ? '−' : (i ? '＋' : '')) + v).join('') });
  }
  
  let acc = terms[0] * sg[0], line = String(acc);
  for (let i = 1; i < terms.length; i++) {
    const before = acc;
    acc += sg[i] * terms[i];
    line = before + (sg[i] < 0 ? '−' : '＋') + terms[i] + '＝' + acc;
    out.push({ msg: '左から、じゅんに計算します。' + line + 'です。', lab: (sg[i] < 0 ? '−' : '＋') + terms[i], line });
  }
  out.push({ msg: 'ちょうど10になりました。だから、この式が答えです。', lab: '10', line: expr + '＝10', done: true });
  return out;
}

const U22_LET = ['A', 'B', 'C'];
function u22FukuGen(lv){
  const nLet = (lv >= 3) ? 2 : 1;
  for (let t = 0; t < 800; t++) {
    const a = randInt(11, 89), b = randInt(11, 89), c = a + b;
    const base = [String(a), String(b), String(c)];
    const vals = shuffleArr(Array.from(new Set(base.join('').split('').map(Number))));
    if (vals.length < nLet) continue;
    const pick = vals.slice(0, nLet);                 
    const map = {}; pick.forEach((v, i) => { map[v] = U22_LET[i]; });
    const rows = base.map(s => s.split('').map(ch => (map[Number(ch)] || ch)));
    
    let sols = [];
    const tryAll = (asg) => {
      if (asg.length === nLet) {
        const num = (r) => Number(r.map(ch => { const k = U22_LET.indexOf(ch); return k < 0 ? ch : asg[k]; }).join(''));
        const A = num(rows[0]), B = num(rows[1]), C = num(rows[2]);
        if (String(A)[0] === '0' || String(B)[0] === '0' || String(C)[0] === '0') return;
        if (A + B === C) sols.push(asg.slice());
        return;
      }
      for (let d = 0; d <= 9; d++) { asg.push(d); tryAll(asg); asg.pop(); }
    };
    tryAll([]);
    if (sols.length !== 1) continue;
    const qi = randInt(0, nLet - 1);
    const ans = sols[0][qi];
    return { g: { rows, nLet, qi, sol: sols[0], dg: 3 }, answer: String(ans), kind: 'fuku', choices: digitChoices(ans) };
  }
  return u22FukuGen(0);
}
function u22FukuDraw(area, opt){
  opt = opt || {};
  const g = opt.g || S.g;
  const cols = Math.max(...g.rows.map(r => r.length));
  
  const subst = (r) => r.map(ch => {
    const i = U22_LET.indexOf(ch);
    return (i >= 0 && opt.try && opt.try[i] != null) ? String(opt.try[i]) : ch;
  });
  const rows = (opt.try ? g.rows.map(r => subst(r)) : g.rows).map(r => padRow(r.join(''), cols));
  const L = U22_LET[g.qi];
  const hots = [];

  base.forEach((r, ri) => r.forEach((ch, ci) => { if (ch === L) hots.push({ ri, ci }); }));
  fudeDraw(area, rows, '＋', { hots });

    text(okk ? '✓ ぴったり 合う' : '✗ 合わない',
      W / 2, area.y + area.h - 16, 15, okk ? CONFIG.C_OK : CONFIG.C_NG, 'center', '800');
  }
  else if (opt.show) text(L + ' ＝ ' + opt.show, W / 2, area.y + area.h - 14, 18, CONFIG.C_OK, 'center', '800');
}

function u22FukuTrials(g){
  const sol = g.sol || [];
  const num = (r, asg) => Number(r.map(ch => {
    const i = U22_LET.indexOf(ch);
    return i < 0 ? ch : String(asg[i]);
  }).join(''));
  const mk = (v) => {
    const asg = sol.slice(); asg[g.qi] = v;
    const A = num(g.rows[0], asg), B = num(g.rows[1], asg), C = num(g.rows[2], asg);
    return { v, asg, line: A + '＋' + B + '＝' + (A + B), want: C, ok: (A + B === C) };
  };
  const ans = sol[g.qi];
  const bad = [];
  for (const d of shuffleArr([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
    if (bad.length >= 2) break;
    const v = (ans + d) % 10;
    if (v === ans) continue;
    const t = mk(v);
    if (t.ok) continue;                       
    if (String(num(g.rows[0], t.asg))[0] === '0') continue;
    bad.push(t);
  }
  return bad.concat([mk(ans)]);
}

  msgs.push('だから、□は' + S.answer + 'です。');
  labels.push(String(S.answer));
  return makeTeach(msgs.length - 1, msgs, labels, { g, kind: k, plan });

const U23_LV = [[5, 8, 4, 4], [5, 8, 4, 4], [5, 8, 4, 4], [5, 8, 4, 4], [5, 8, 4, 4]];


const U23_RULE = ['ちょうど「上がり」につくとゴールです。', '目があまったら、あまった分だけ「上がり」からもどります。'];   
function u23Label(i, n){ return (i === 0) ? 'ふりだし' : (i === n ? '上がり' : String(i)); }
function u23Move(p, d, n){
  const q = p + d;
  return (q > n) ? (n - (q - n)) : q;
}
function u23Gen(lv, kind){
  return uPick('u23' + kind, 3, () => u23Gen1(lv, kind));
}
function u23Gen1(lv, kind){
  const P = U23_LV[Math.min(lv, U23_LV.length - 1)];
  const D = randInt(P[2], P[3]);
  if (kind === 'pair') {
    const n = randInt(P[0], P[1]);
    let cnt = 0;
    for (let a = 1; a <= D; a++) for (let b = 1; b <= D; b++) {
      const p1 = u23Move(0, a, n);
      if (p1 === n) continue;                       
      if (u23Move(p1, b, n) === n) cnt++;
    }
    return { g: { n, D }, answer: cnt, kind: 'pair',
      choices: numChoices(cnt, [cnt + 1, cnt - 1, cnt + 2, D, D * D - cnt]) };
  }
  
  const n = randInt(P[0], Math.min(P[1], 7));
  
  const wantBack = Math.random() < 0.55;
  for (let t = 0; t < 300; t++) {
    const a = randInt(1, D), b = randInt(1, D);
    const p1 = u23Move(0, a, n);
    if (p1 === n) continue;                         
    const p2 = u23Move(p1, b, n);
    const back = (p1 + b > n);                      
    if (t < 200 && wantBack !== back) continue;
    
    const cand = [p1 + b, p1, a + b, n, p2 + 1, p2 - 1, p2 - 2, p1 + 1, n - 1, p2 + 2];
    const out = [{ v: p2, txt: u23Label(p2, n) }];
    shuffleArr(cand).forEach(v => {
      if (out.length >= Math.min(CONFIG.CHOICES, n)) return;
      if (v < 1 || v > n) return;
      if (out.some(o => o.v === v)) return;
      out.push({ v, txt: u23Label(v, n) });
    });
    
    for (let d = 1; out.length < Math.min(4, n) && d <= n; d++) [p2 - d, p2 + d].forEach(v => {
      if (out.length >= Math.min(4, n) || v < 1 || v > n || out.some(o => o.v === v)) return;
      out.push({ v, txt: u23Label(v, n) });
    });
    return { g: { n, D, a, b, p1, p2, back }, answer: p2, kind: 'land', choices: shuffleArr(out) };
  }
  return u23Gen1(0, 'land');
}

    if (i < n) { ctx.strokeStyle = CONFIG.C_GRID; ctx.lineWidth = 1.3;

function u23Table(area, g, upto, top, count){
  const D = g.D, n = g.n;
  const t0 = (top != null) ? top : (area.y + 26);
  const avail = area.y + area.h - t0 - 16;
  
  const cw = Math.max(14, Math.min(30, (area.w - 96) / (D + 1), avail / (D + 1)));
  const ox = W / 2 - (D + 1) * cw / 2 + 10;
  const oy = t0 + Math.min(24, Math.max(0, (avail - (D + 1) * cw) / 2));   
  let k = 0;
  ctx.save();
  for (let r = 0; r <= D; r++) for (let c = 0; c <= D; c++) {
    const x = ox + c * cw, y = oy + r * cw;
    ctx.strokeStyle = CONFIG.C_GRID; ctx.lineWidth = 1; ctx.strokeRect(x, y, cw, cw);
    if (r === 0 && c > 0) text(String(c), x + cw / 2, y + cw / 2, 13, CONFIG.C_INK, 'center', '800');
    else if (c === 0 && r > 0) text(String(r), x + cw / 2, y + cw / 2, 13, CONFIG.C_INK, 'center', '800');
    else if (r > 0 && c > 0 && (upto == null || r <= upto)) {
      const p1 = u23Move(0, r, n);
      if (p1 === n) { text('—', x + cw / 2, y + cw / 2, 11, CONFIG.C_INK_SOFT); continue; }
      if (p1 + c > n) { text('×', x + cw / 2, y + cw / 2, 12, '#b9b1a1', 'center', '800'); continue; }
      const v = p1 + c, goal = (v === n);
      if (goal) { rrect(x + 1.5, y + 1.5, cw - 3, cw - 3, 4); ctx.fillStyle = 'rgba(74,157,95,0.18)'; ctx.fill(); k++; }
      text(goal ? (count ? '①②③④⑤⑥⑦⑧'[k - 1] : '上') : String(v), x + cw / 2, y + cw / 2, goal ? 12 : 11,
        goal ? CONFIG.C_OK : CONFIG.C_INK_SOFT, 'center', '800');
    }
  }
  text('2回め', ox + (D + 1) * cw / 2 + 4, oy - 12, 10, CONFIG.C_INK_SOFT, 'center', '700');
  text('1回め', ox - 18, oy + (D + 1) * cw / 2, 10, CONFIG.C_INK_SOFT, 'center', '700');
  ctx.restore();
}

function u23Walk(from, to, prog){
  const total = Math.abs(to - from), dir = (to >= from) ? 1 : -1;
  if (!total) return { pos: from, hop: 0 };
  const f = Math.max(0, Math.min(total, prog * total));
  const k = Math.floor(f);
  const frac = Math.min(1, (f - k) * 2.0);
  const a = from + dir * Math.min(k, total), b = from + dir * Math.min(k + 1, total);
  return { pos: a + (b - a) * frac, hop: (k < total) ? frac : 0 };
}

const U24_V = {
  'ア': [0, 0, 1], 'イ': [1, 0, 1], 'ウ': [1, 1, 1], 'エ': [0, 1, 1],
  'オ': [0, 0, 0], 'カ': [1, 0, 0], 'キ': [1, 1, 0], 'ク': [0, 1, 0],
};
const U24_EDGES = ['アイ', 'イウ', 'ウエ', 'エア', 'オカ', 'カキ', 'キク', 'クオ', 'アオ', 'イカ', 'ウキ', 'エク'];
const U24_FACES = [
  { n: 'オカキク', t: '床の面', v: ['オ', 'カ', 'キ', 'ク'] },

];
function u24FaceName(f){ return f.t + f.n; }
function u24Rel(f, e){
  const a = f.v.includes(e[0]), b = f.v.includes(e[1]);
  return (a && b) ? 'in' : (a || b) ? 'cross' : 'para';
}
function u24FaceRel(f1, f2){
  if (f1.n === f2.n) return 'same';
  return f1.v.some(v => f2.v.includes(v)) ? 'suichoku' : 'heikou';
}
const U24_REL_TXT = { in: 'ふくまれる', cross: '交わる', para: '平行な' };
function u24Proj(area){
  const az = 34 * Math.PI / 180, el = 25 * Math.PI / 180;
  const D = [1.30, 0.80, 1.00];
  
  const sc = Math.min(area.w * 0.30, (area.h - 74) * 0.44);
  const cx = W / 2, cy = area.y + 44 + (area.h - 58) / 2;
  return (name) => {
    const v = U24_V[name];
    const x = (v[0] - 0.5) * D[0], y = (v[1] - 0.5) * D[1], z = (v[2] - 0.5) * D[2];
    const px = x * Math.cos(az) - y * Math.sin(az);
    const py0 = x * Math.sin(az) + y * Math.cos(az);
    const py = py0 * Math.sin(el) - z * Math.cos(el);
    return [cx + px * sc, cy + py * sc];
  };
}
function u24Box(area, opt){
  opt = opt || {};
  const P = u24Proj(area);
  ctx.save();
  if (opt.face) {
    poly(opt.face.v.map(P), 'rgba(141,133,119,0.22)', null, 0);
  }
  U24_EDGES.forEach(e => {
    const p1 = P(e[0]), p2 = P(e[1]);
    let col = '#b9b1a1', lw = 1.6;
    if (opt.hiEdge === e) { col = CONFIG.C_GOLD; lw = 3.4; }
    else if (opt.mark && opt.mark[e]) { col = opt.mark[e]; lw = 2.8; }
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  });
  if (opt.face2) poly(opt.face2.v.map(P), 'rgba(74,157,95,0.26)', CONFIG.C_OK, 2);
  const cx = W / 2, cy = area.y + 44 + (area.h - 58) / 2;
  Object.keys(U24_V).forEach(name => {
    const p = P(name);
    const dx = p[0] - cx, dy = p[1] - cy;
    const L = Math.max(1, Math.hypot(dx, dy));
    text(name, p[0] + dx / L * 13, p[1] + dy / L * 12, 12, CONFIG.C_INK, 'center', '800');
  });
  ctx.restore();
}

const U24_DIV = [
  { q: '直線', a: '点', w: ['直線', '平面'] },

function u24DivRow(cx, cy, sc, what, cut, on){
  ctx.save();
  const ink = on ? CONFIG.C_INK : '#b9b1a1';
  const c1 = on ? 'rgba(143,184,232,0.45)' : 'rgba(143,184,232,0.20)';
  const c2 = on ? 'rgba(201,150,63,0.35)' : 'rgba(201,150,63,0.16)';
  if (what === '直線') {
    const L = 96 * sc;
    ctx.strokeStyle = cut ? '#4a7fc9' : ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - L, cy); ctx.lineTo(cx - 2, cy); ctx.stroke();
    ctx.strokeStyle = cut ? '#c98b3f' : ink;
    ctx.beginPath(); ctx.moveTo(cx + 2, cy); ctx.lineTo(cx + L, cy); ctx.stroke();
    if (cut) {                                   
      ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = CONFIG.C_GOLD; ctx.fill();
      ctx.strokeStyle = CONFIG.C_EDGE; ctx.lineWidth = 1.4; ctx.stroke();
      text('点', cx, cy - 16, 12, CONFIG.C_GOLD, 'center', '800');
    }
  } else if (what === '平面') {
    const w = 104 * sc, h = 30 * sc, sk = 28 * sc;
    const A = [cx - w, cy + h], B = [cx - w + sk, cy - h], C = [cx + w, cy - h], D = [cx + w - sk, cy + h];
    const M1 = [cx - sk / 2 + sk / 2, cy - h], M2 = [cx - sk / 2, cy + h];
    if (cut) {
      poly([A, B, [cx, cy - h], [cx - sk, cy + h]], c1, ink, 1.8);
      poly([[cx - sk, cy + h], [cx, cy - h], C, D], c2, ink, 1.8);
      ctx.strokeStyle = CONFIG.C_GOLD; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy - h); ctx.lineTo(cx - sk, cy + h); ctx.stroke();
      text('直線', cx + 4, cy - h - 12, 12, CONFIG.C_GOLD, 'center', '800');
    } else {
      poly([A, B, C, D], c1, ink, 1.8);
    }
  } else {
    const w = 66 * sc, h = 34 * sc, d = 18 * sc, gap = cut ? 12 * sc : 0;
    const box = (ox, fill) => {
      poly([[ox, cy], [ox + w, cy], [ox + w, cy + h], [ox, cy + h]], fill, ink, 1.6);
      poly([[ox, cy], [ox + d, cy - d], [ox + w + d, cy - d], [ox + w, cy]], fill, ink, 1.6);
      poly([[ox + w, cy], [ox + w + d, cy - d], [ox + w + d, cy + h - d], [ox + w, cy + h]], fill, ink, 1.6);
    };
    box(cx - w - d / 2 - gap, c1);
    box(cx + d / 2 + gap, c2);
    if (cut) {
      
      const ex = d * 1.7, ey = -d * 1.7;          
      const y1 = cy + h + 10 * sc, y2 = cy - 14 * sc;
      poly([[cx, y1], [cx, y2], [cx + ex, y2 + ey], [cx + ex, y1 + ey]],
        'rgba(201,150,63,0.34)', CONFIG.C_GOLD, 2);
      ctx.strokeStyle = CONFIG.C_GOLD; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, y1); ctx.lineTo(cx, y2); ctx.stroke();
      text('平面', cx + ex + 18, y2 + ey - 2, 12, CONFIG.C_GOLD, 'center', '800');
    }
  }
  ctx.restore();
}
function u24DivDraw(area, opt){
  opt = opt || {};

function u24Gen(lv, kind){
  return uPick('u24' + kind, (kind === 'edge') ? 3 : (kind === 'face') ? 2 : 1, () => u24Gen1(lv, kind));
}
function u24Gen1(lv, kind){
  if (kind === 'divide') {
    const d = U24_DIV[randInt(0, U24_DIV.length - 1)];
    return { g: { what: d.q }, answer: d.a, kind: 'divide',
      choices: shuffleArr([{ v: d.a, txt: d.a }, { v: d.w[0], txt: d.w[0] }, { v: d.w[1], txt: d.w[1] }]) };
  }
  if (kind === 'face') {
    const f = U24_FACES[randInt(0, 5)];
    const ans = U24_FACES.find(x => u24FaceRel(f, x) === 'heikou');
    const others = shuffleArr(U24_FACES.filter(x => x.n !== f.n && x.n !== ans.n)).slice(0, 3);
    return { g: { f: f.n }, answer: ans.n, kind: 'face',
      choices: shuffleArr([{ v: ans.n, txt: ans.n }].concat(others.map(x => ({ v: x.n, txt: x.n })))) };
  }
  const rel = ['in', 'cross', 'para'][randInt(0, 2)];
  const f = U24_FACES[randInt(0, 5)];
  const good = U24_EDGES.filter(e => u24Rel(f, e) === rel);
  const bad = shuffleArr(U24_EDGES.filter(e => u24Rel(f, e) !== rel));
  const ans = good[randInt(0, good.length - 1)];
  const out = [{ v: ans, txt: ans }];
  bad.forEach(e => { if (out.length < CONFIG.CHOICES) out.push({ v: e, txt: e }); });
  return { g: { f: f.n, rel }, answer: ans, kind: 'edge', choices: shuffleArr(out) };
}

function u25QuadPts(g){
  const T = g.t, a = g.a, b = g.b, c = g.c, d = g.d;
  if (T === 'rect') return [[0, 0], [a, 0], [a, b], [0, b]];
  if (T === 'trap') return [[0, 0], [a, 0], [c, b], [0, b]];
  if (T === 'para') return [[0, 0], [a, 0], [a + d, b], [d, b]];
  return [[0, 0], [a, 0], [a, b], [d, c]];        
}
function u25RightCount(pts){
  let k = 0;
  for (let i = 0; i < 4; i++) {
    const p = pts[i], q = pts[(i + 1) % 4], o = pts[(i + 3) % 4];
    const ux = q[0] - p[0], uy = q[1] - p[1], vx = o[0] - p[0], vy = o[1] - p[1];
    if (ux * vx + uy * vy === 0) k++;
  }
  return k;
}

function u25QuadClear(pts){
  for (let i = 0; i < 4; i++) {
    const p = pts[i], q = pts[(i + 1) % 4], o = pts[(i + 3) % 4];
    const ux = q[0] - p[0], uy = q[1] - p[1], vx = o[0] - p[0], vy = o[1] - p[1];
    const dot = ux * vx + uy * vy;
    if (dot === 0) continue;
    const cos = dot / (Math.hypot(ux, uy) * Math.hypot(vx, vy));
    if (Math.abs(cos) < 0.30) return false;
  }
  return true;
}
function u25QuadDraw(area, opt){

  const pts = u25QuadPts(g);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const mnx = Math.min.apply(null, xs), mxx = Math.max.apply(null, xs);
  const mny = Math.min.apply(null, ys), mxy = Math.max.apply(null, ys);
  const sc = Math.min((area.w * 0.56) / Math.max(1, mxx - mnx), (area.h * 0.46) / Math.max(1, mxy - mny));
  const cx = W / 2, cy = area.y + area.h * 0.48;

}
function u25Gen(lv, kind){

function u25Gen1(lv, kind){

    const ans = (n - 2) * 2;
    return { g: { n, name }, answer: ans, kind: 'sum',
      choices: numChoices(ans, [n, ans + 2, ans - 2, ans + 1, n - 2]) };
  }
  if (kind === 'count') {
    for (let t = 0; t < 200; t++) {

      const a = randInt(3, 6), b = randInt(2, 5);
      const c = randInt(1, a - 1), d = randInt(1, 3);
      const g = { t: T, a, b, c, d };

      const cnt = u25RightCount(pts);

function u26RingGen(lv){

    const i = randInt(0, n - 1), j = randInt(0, n - 1);

    const m = (x) => ((i + j - x) % n + n) % n;
    const k = randInt(0, n - 1);
    if (k === i || k === j) continue;
    const ans = m(k);
    if (ans === k || ans === i || ans === j) continue;
    const out = [{ v: U26_RING[ans], txt: U26_RING[ans] }];
    shuffleArr(U26_RING.filter(v => v !== U26_RING[ans] && v !== U26_RING[k])).forEach(v => {
      if (out.length < CONFIG.CHOICES) out.push({ v, txt: v });

function u27Gen1(lv, kind){

      choices: numChoices(ans, [a + n, ans - a, ans + a, a * (n - 1), a * (n + 1)]) };
  }
  if (kind === 'stack') {
    const m = [5, 6, 7, 8, 9][randInt(0, 4)];

    return { g: { m, t }, answer: ans, kind: 'stack',

const U11_LAST = [];
function u11Gen(lv){
  const max = U11_LV[Math.min(lv, U11_LV.length - 1)];
  const bLo = (lv === 0) ? 2 : 5;
  let b, ans, form, key;
  for (let tries = 0; tries < 10; tries++){
    b = randInt(bLo, Math.max(bLo, Math.floor(max / 3)));
    ans = randInt(b + 2, max);
    form = randInt(0, 2);
    key = form + ':' + b + ':' + ans;
    if (!U11_LAST.includes(key)) break;
  }
  U11_LAST.push(key);
  if (U11_LAST.length > 5) U11_LAST.shift();
  let stmt, W, A, B, unknown;
  if (form === 0) {        
    const c = ans - b;
    stmt = '□ － ' + b + ' ＝ ' + c;
    W = ans; A = c; B = b; unknown = 'W';
  } else if (form === 1) { 
    const c = ans + b;
    stmt = '□ ＋ ' + b + ' ＝ ' + c;
    W = c; A = ans; B = b; unknown = 'A';
  } else {                 
    const big = ans + b;
    const c = big - ans;
    stmt = big + ' － □ ＝ ' + c;
    W = big; A = ans; B = c; unknown = 'A';
  }
  
  const wrongs = (unknown === 'W') ? [Math.max(1, Math.abs(A - B)), A, B] : [W + B, W, B];
  const choices = numChoices(ans, wrongs);
  return { g: { stmt, W, A, B, unknown, ans, form }, answer: ans, kind: 'u11', choices };
}


function u11Brace(x1, x2, lineY, dir, label, gold){
  
  const BR_H = 24, R = 6, FS = 17;
  const by = lineY + dir * BR_H, mid = (x1 + x2) / 2;
  const hookEnd = lineY + dir * 6;              
  const lw = textWidth(label, FS, '800');
  const col = gold ? CONFIG.C_GOLD : CONFIG.C_INK;
  const tight = (x2 - x1) < lw + 20;            
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (tight) {
    ctx.beginPath();
    ctx.moveTo(x1, hookEnd); ctx.arcTo(x1, by, x1 + R, by, R);
    ctx.lineTo(x2 - R, by); ctx.arcTo(x2, by, x2, hookEnd, R);
    ctx.lineTo(x2, hookEnd); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x1, hookEnd); ctx.arcTo(x1, by, x1 + R, by, R);
    ctx.lineTo(mid - lw / 2 - 7, by); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mid + lw / 2 + 7, by); ctx.lineTo(x2 - R, by);
    ctx.arcTo(x2, by, x2, hookEnd, R); ctx.lineTo(x2, hookEnd); ctx.stroke();
  }
  ctx.restore();
  text(label, mid, tight ? by + dir * 13 : by, FS, col, 'center', '800');
}
