const HOLO_HUES = ['#ff5fa2', '#ffd84d', '#5dff9b', '#4fd8ff', '#9d7bff', '#ff5fa2'];
let HOLO_SHIFT = 0;          
function drawSparkle(box){
  const t = S.t;
  ctx.save();
  rrect(box.x, box.y, box.w, box.h, 10); ctx.clip();
  const diag = box.w + box.h;

  
  for (let k = 0; k < 2; k++) {
    const ph = (((t * (0.13 + k * 0.05) + k * 0.5 + HOLO_SHIFT) % 1) + 1) % 1;
    const off = -diag + diag * 2 * ph;
    const g = ctx.createLinearGradient(box.x + off, box.y, box.x + off + diag * 0.9, box.y + box.h);
    for (let i = 0; i < HOLO_HUES.length; i++) {
      g.addColorStop(i / (HOLO_HUES.length - 1), HOLO_HUES[i]);
    }
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.30 - k * 0.10;
    ctx.fillStyle = g;
    ctx.fillRect(box.x, box.y, box.w, box.h);
  }

  
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
  const step = 7, slide = (t * 9) % step;
  ctx.beginPath();
  for (let x = -box.h + slide; x < box.w + box.h; x += step) {
    ctx.moveTo(box.x + x, box.y);
    ctx.lineTo(box.x + x + box.h, box.y + box.h);
  }
  ctx.stroke();

  
  const sp = (t * 0.42) % 1.6;
  if (sp < 1) {
    const sx = box.x - box.w * 0.5 + (box.w * 2) * sp;
    const lg = ctx.createLinearGradient(sx - box.w * 0.22, box.y, sx + box.w * 0.22, box.y + box.h);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(0.5, 'rgba(255,255,255,0.40)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.fillStyle = lg;
    ctx.fillRect(box.x, box.y, box.w, box.h);
  }
  ctx.restore();
}

const MAP_TOP = 152, MAP_BOTTOM_PAD = 24, MAP_GAP = 8;

function starPath(x, y, r, inner){
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = (k % 2 ? r * (inner || 0.45) : r);
    const X = x + Math.cos(a) * rr, Y = y + Math.sin(a) * rr;
    if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}

function drawStar(x, y, r){
  ctx.save();
  ctx.shadowColor = 'rgba(255,190,70,0.75)'; ctx.shadowBlur = 7;
  starPath(x, y, r);
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, CONFIG.C_GOLD); g.addColorStop(1, '#c08a27');
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#8a6420'; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.restore();
}

function drawShinEmblem(x, y, r){
  ctx.save();
  
  const glow = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 2.0);
  glow.addColorStop(0, 'rgba(255,200,90,0.55)');
  glow.addColorStop(1, 'rgba(255,200,90,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, r * 2.0, 0, Math.PI * 2); ctx.fill();
  
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#221a33'; ctx.fill();
  ctx.restore();
  
  const ring = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  ring.addColorStop(0, '#fff6d0'); ring.addColorStop(0.42, '#f0bd57');
  ring.addColorStop(0.72, '#b8832a'); ring.addColorStop(1, '#8a6420');
  ctx.beginPath(); ctx.arc(x, y, r - r * 0.10, 0, Math.PI * 2);
  ctx.strokeStyle = ring; ctx.lineWidth = r * 0.26; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r - r * 0.24, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(40,26,10,0.55)'; ctx.lineWidth = Math.max(0.8, r * 0.06); ctx.stroke();
  
  starPath(x, y - r * 0.02, r * 0.56, 0.42);
  const sg = ctx.createLinearGradient(x - r * 0.6, y - r * 0.6, x + r * 0.5, y + r * 0.6);
  sg.addColorStop(0, '#fffbe8'); sg.addColorStop(0.45, '#ffd86b'); sg.addColorStop(1, '#c9922c');
  ctx.fillStyle = sg; ctx.fill();
  ctx.strokeStyle = 'rgba(60,38,8,0.75)'; ctx.lineWidth = Math.max(0.8, r * 0.07); ctx.stroke();
  
  ctx.beginPath();
  ctx.arc(x, y, r - r * 0.14, Math.PI * 1.02, Math.PI * 1.52);
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = Math.max(1, r * 0.10); ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

const CARD = { ry: 0, rx: 0, vy: 0, target: 0, drag: null };
const CARD_M = 18;

function cardReset(){ CARD.ry = 0; CARD.rx = 0; CARD.vy = 0; CARD.target = 0; CARD.drag = null; }

function cardDeg(a){ return ((a % 360) + 540) % 360 - 180; }       
function cardBack(){ return Math.cos(CARD.ry * Math.PI / 180) < 0; }
function cardDown(lx, ly){
  const b = bookViewBox();
  if (lx < b.x - 10 || lx > b.x + b.w + 10 || ly < b.y - 10 || ly > b.y + b.h + 10) return false;
  CARD.drag = { x: lx, y: ly, sx: lx, sy: ly, t: performance.now(), moved: false, v: 0 };

function cardMove(lx, ly){
  const D = CARD.drag; if (!D) return;
  const now = performance.now(), dt = Math.max(1, now - D.t) / 1000;
  const dx = lx - D.x, dy = ly - D.y;
  if (Math.hypot(lx - D.sx, ly - D.sy) > 8) D.moved = true;
  CARD.ry += dx * 0.6;
  CARD.rx = Math.max(-28, Math.min(28, CARD.rx - dy * 0.35));
  D.v = D.v * 0.5 + (dx * 0.6 / dt) * 0.5;                          
  D.x = lx; D.y = ly; D.t = now;
}
function cardUp(){
  const D = CARD.drag; if (!D) return;
  CARD.drag = null;
  if (!D.moved) { CARD.target = Math.round(CARD.ry / 180) * 180 + 180; CARD.vy = 0; sfxTap(); return; }
  CARD.vy = (performance.now() - D.t > 120) ? 0 : Math.max(-1800, Math.min(1800, D.v));
  CARD.target = Math.round(CARD.ry / 180) * 180;
}
function updateCard(dt){
  if (CARD.drag) return;
  if (Math.abs(CARD.vy) > 140 && Math.abs(CARD.ry - CARD.target) > 1 || Math.abs(CARD.vy) > 500) {
    CARD.ry += CARD.vy * dt;                                         
    CARD.vy *= Math.pow(0.18, dt);
    CARD.target = Math.round(CARD.ry / 180) * 180;
  } else {
    const wob = 6 * Math.sin(S.t * 0.9);                             
    CARD.vy += ((CARD.target + wob - CARD.ry) * 60 - CARD.vy * 9) * dt;
    CARD.ry += CARD.vy * dt;
  }
  CARD.rx += ((4 * Math.sin(S.t * 1.3 + 1)) - CARD.rx) * Math.min(1, 5 * dt);
}

function renderCardSide(box, gi, lv, back, k){

  const g = cardTex.getContext('2d'), main = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  g.setTransform(w / tw, 0, 0, h / th, 0, 0);
  const b = { x: CARD_M, y: CARD_M, w: box.w, h: box.h };
  const rel = back ? cardDeg(CARD.ry - 180) : cardDeg(CARD.ry);

  try {

      HOLO_SHIFT = rel / 90;

    gr.addColorStop(0, 'rgba(255,255,255,0.30)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr; ctx.fillRect(b.x, b.y, b.w, b.h);

  return cardTex;
}

function drawCard3D(box, gi, lv){
  const back = cardBack();
  const k = Math.min(3, dpr * scale);
  const tex = renderCardSide(box, gi, lv, back, k);
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  const tw = box.w + CARD_M * 2, th = box.h + CARD_M * 2;
  const ry = CARD.ry * Math.PI / 180, rx = CARD.rx * Math.PI / 180, DIST = 760;
  const cY = Math.cos(ry), sY = Math.sin(ry), cX = Math.cos(rx), sX = Math.sin(rx);
  const proj = (x, y) => {
    const x1 = x * cY, z1 = x * sY;
    const y2 = y * cX - z1 * sX, z2 = y * sX + z1 * cX;
    const f = DIST / (DIST + z2);
    return [cx + x1 * f, cy + y2 * f];
  };
  
  ctx.save();
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#05020c';
  ctx.shadowColor = '#05020c'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.ellipse(cx, box.y + box.h + 14, box.w * 0.42 * Math.max(0.15, Math.abs(cY)) + 8, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const NX = 6, NY = 8, P = [];
  for (let j = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) {
    const u = i / NX, v = j / NY;
    P.push({ s: [(back ? 1 - u : u) * tex.width, v * tex.height], d: proj((u - 0.5) * tw, (v - 0.5) * th) });
  }
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const a = P[j * (NX + 1) + i], b = P[j * (NX + 1) + i + 1], c = P[(j + 1) * (NX + 1) + i], d = P[(j + 1) * (NX + 1) + i + 1];
    texTri(tex, a, b, d); texTri(tex, a, d, c);
  }
}
function texTri(img, p0, p1, p2){
  const [x0, y0] = p0.d, [x1, y1] = p1.d, [x2, y2] = p2.d;
  const [u0, v0] = p0.s, [u1, v1] = p1.s, [u2, v2] = p2.s;
  const den = u0 * (v1 - v2) + u1 * (v2 - v0) + u2 * (v0 - v1);
  if (Math.abs(den) < 1e-6) return;
  
  const mx = (x0 + x1 + x2) / 3, my = (y0 + y1 + y2) / 3;
  const ex = (x, y) => { const dx = x - mx, dy = y - my, l = Math.hypot(dx, dy) || 1; return [x + dx / l * 0.7, y + dy / l * 0.7]; };
  ctx.save();
  ctx.beginPath();
  let q = ex(x0, y0); ctx.moveTo(q[0], q[1]);
  q = ex(x1, y1); ctx.lineTo(q[0], q[1]);
  q = ex(x2, y2); ctx.lineTo(q[0], q[1]);
  ctx.closePath(); ctx.clip();
  ctx.transform(
    (x0 * (v1 - v2) + x1 * (v2 - v0) + x2 * (v0 - v1)) / den,
    (y0 * (v1 - v2) + y1 * (v2 - v0) + y2 * (v0 - v1)) / den,
    (x0 * (u2 - u1) + x1 * (u0 - u2) + x2 * (u1 - u0)) / den,
    (y0 * (u2 - u1) + y1 * (u0 - u2) + y2 * (u1 - u0)) / den,
    (x0 * (u1 * v2 - u2 * v1) + x1 * (u2 * v0 - u0 * v2) + x2 * (u0 * v1 - u1 * v0)) / den,
    (y0 * (u1 * v2 - u2 * v1) + y1 * (u2 * v0 - u0 * v2) + y2 * (u0 * v1 - u1 * v0)) / den);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

  ctx.beginPath(); ctx.arc(x, y, s + 6, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
  ctx.strokeStyle = '#e6dcff'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + s*0.4, y - s*0.6); ctx.lineTo(x - s*0.5, y); ctx.lineTo(x + s*0.4, y + s*0.6);
  ctx.closePath(); ctx.fillStyle = '#e6dcff'; ctx.fill();
  ctx.restore();
}
function drawBookIconLight(x, y, s){ drawBookShape(x, y, s, '#f7f2ff', '#b39bff', '#7b64c9'); }

const BTN_EXPORT = { x: 262, y: H - 34, r: 15 };
const BTN_IMPORT = { x: 306, y: H - 34, r: 15 };
function drawCodeBtn(b, out){
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 1.6; ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(b.x - 7, b.y + 1); ctx.lineTo(b.x - 7, b.y + 7);
  ctx.lineTo(b.x + 7, b.y + 7); ctx.lineTo(b.x + 7, b.y + 1);
  ctx.lineWidth = 1.8; ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(b.x, out ? b.y + 3 : b.y - 8);
  ctx.lineTo(b.x, out ? b.y - 8 : b.y + 3);
  ctx.stroke();
  const ty = out ? b.y - 8 : b.y + 3;
  const dy = out ? 1 : -1;
  ctx.beginPath();
  ctx.moveTo(b.x - 4, ty + 4*dy); ctx.lineTo(b.x, ty); ctx.lineTo(b.x + 4, ty + 4*dy);
  ctx.stroke();
  ctx.restore();
}
function drawBack(x, y, s){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, s + 6, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + s*0.4, y - s*0.6); ctx.lineTo(x - s*0.5, y); ctx.lineTo(x + s*0.4, y + s*0.6);
  ctx.closePath(); ctx.fillStyle = CONFIG.C_INK; ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#211f1b';
  ctx.fillRect(0, 0, cv.width / dpr, cv.height / dpr);
  ctx.save();
  ctx.translate(offX / 1, offY / 1);
  ctx.scale(scale, scale);
  if (BGM.on && (S.mode === 'map' || S.mode === 'title' || S.mode === 'book' || S.mode === 'bookView')) bgmStop();
  if (S.mode === 'title') drawTitle();
  else if (S.mode === 'map') drawMap();
  else if (S.mode === 'win') drawWin();
  else if (S.mode === 'book') drawBook();
  else if (S.mode === 'bookView') drawBookView();
  else drawPlay();
  ctx.restore();
}


const ovl = document.getElementById('ovl');
const ovlTtl = document.getElementById('ovlTtl');
const ovlIn = document.getElementById('ovlIn');
const ovlMsg = document.getElementById('ovlMsg');
const ovlYes = document.getElementById('ovlYes');
const ovlNo = document.getElementById('ovlNo');
let ovlMode = null;

function openCode(mode){
  ovlMode = mode;
  if (mode === 'export') {
    ovlTtl.textContent = 'かんたんコード（書き出し）';
    ovlIn.value = makeKidCode();
    ovlIn.readOnly = true;
    ovlYes.textContent = 'コピー';
    
    ovlMsg.textContent = 'この8文字を控えておけば、消えても戻せます。';
  } else {
    ovlTtl.textContent = 'かんたんコード（読み込み）';
    ovlIn.value = '';
    ovlIn.readOnly = false;
    ovlYes.textContent = '読み込む';
    ovlMsg.textContent = '8文字のコード（前の長いコードも読めます）。いまの記録は上書きされます。';
  }
  ovl.classList.add('on');
  if (mode === 'export') {
    
    setTimeout(() => { try { ovlIn.focus(); ovlIn.setSelectionRange(0, ovlIn.value.length); } catch(e){} }, 40);
  } else {
    setTimeout(() => { try { ovlIn.focus(); } catch(e){} }, 40);
  }
}
function closeCode(){
  ovl.classList.remove('on');
  ovlMode = null;
  try { ovlIn.blur(); } catch(e){}
}
ovlNo.addEventListener('click', () => { closeCode(); });
ovlYes.addEventListener('click', () => {
  if (ovlMode === 'export') {
    
    let done = false;
    try {
      ovlIn.focus(); ovlIn.setSelectionRange(0, ovlIn.value.length);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ovlIn.value).then(() => {
          ovlMsg.textContent = 'コピーしました。';
        }).catch(() => {
          ovlMsg.textContent = '選んであります。長おしでコピーしてください。';
        });
        done = true;
      }
    } catch(e){}
    if (!done) ovlMsg.textContent = '選んであります。長おしでコピーしてください。';
    return;
  }
  if (applyCode(ovlIn.value)) {
    ovlMsg.textContent = '読み込みました。';
    sfxPiece();
    setTimeout(closeCode, 550);
  } else {
    ovlMsg.textContent = 'そのコードは使えません。';
    sfxWrong();
  }
});


function hitMute(x, y){ return x > 300 && x < 350 && y > 4 && y < 48; }

function pickColumn(x, y){
  
  const B = playBasis(), fit = S.fit, g = S.g;
  const cubes = cubeList(g, B);
  for (let k = cubes.length - 1; k >= 0; k--) {
    const c = cubes[k];
    const f = cubeFaces(B, c.i, c.y, c.j, fit.S, fit.ox, fit.oy);
    if (pointInPoly(x, y, f.top) || pointInPoly(x, y, f.left) || pointInPoly(x, y, f.right)) {
      return { i: c.i, j: c.j };
    }
  }
  return null;
}

function onDown(lx, ly){
  initAudio(); resumeAudio();

  
  if (S.quitAsk) {
    const p = quitPanel();
    const inb = (b) => lx >= b.x && lx <= b.x + b.w && ly >= b.y - 6 && ly <= b.y + b.h + 6;
    if (inb(p.stay)) { S.quitAsk = false; sfxTap(); return; }
    if (inb(p.go))   { S.quitAsk = false; bgmStop(); S.intro = false; S.teach = null; S.boss = null; S.mode = 'map'; S.t = 0; sfxTap(); return; }
    return;
  }
  if (hitMute(lx, ly)) { muted = !muted; sfxTap(); return; }
  
  if (!S.intro && (S.mode === 'play' || S.mode === 'correct' || S.mode === 'teach') && hitQuit(lx, ly)) {
    S.quitAsk = true; sfxTap();
    return;
  }

  if (S.mode === 'title') { S.mode = 'map'; S.t = 0; sfxTap(); return; }

  
  if (S.mode === 'map') {
    
    if (lx > W - 96 && lx < W - 52 && ly < 52) { S.mode = 'book'; S.t = 0; sfxTap(); return; }
    
    {
      const tb = mapTabletRect();
      if (lx >= tb.x - 10 && lx <= tb.x + tb.w + 10 && ly >= tb.y - 10 && ly <= tb.y + tb.h + 10) {
        S.bookSel = curPage(); S.bookFrom = 'map'; S.mode = 'bookView'; S.t = 0; cardReset(); sfxTap(); return;
      }
    }
    
    if (bossOpen(curPage())) {
      const b = bossBarRect();
      if (lx >= b.x && lx <= b.x + b.w && ly >= b.y - 4 && ly <= b.y + b.h + 4) {
        startBoss(curPage()); sfxTap(); return;
      }
    }
    
    if (ly > 60 && ly < 150) {
      if (lx < MAP_ARROW.w && curPage() > 0) { setPage(curPage() - 1); sfxTap(); return; }
      if (lx > W - MAP_ARROW.w && curPage() < DRAGONS.length - 1) { setPage(curPage() + 1); sfxTap(); return; }
    }
    const list = pageStages(curPage());
    for (let i = 0; i < list.length; i++) {
      const q = mapRect(i);
      if (lx >= q.x && lx <= q.x + q.w && ly >= q.y && ly <= q.y + q.h) {
        if (!list[i].unlocked) { sfxWrong(); return; }
        enterStage(list[i].id, lx > q.x + q.w - 82);
        sfxTap();
        return;
      }
    }
    return;
  }

  if (S.mode === 'book') {
    const hit = (b) => (lx - b.x)*(lx - b.x) + (ly - b.y)*(ly - b.y) < (b.r + 10)*(b.r + 10);
    if (hit(BTN_EXPORT)) { openCode('export'); sfxTap(); return; }
    if (hit(BTN_IMPORT)) { openCode('import'); sfxTap(); return; }
    if (lx < 76 && ly < 84) { S.mode = 'map'; S.t = 0; sfxTap(); return; }
    for (const b of bookTiles()) {
      if (lx >= b.x - 6 && lx <= b.x + b.w + 6 && ly >= b.y - 6 && ly <= b.y + b.h + 36) {
        S.bookSel = b.k; S.bookFrom = 'book'; S.mode = 'bookView'; S.t = 0; cardReset(); sfxTap(); return;
      }
    }
    return;
  }
  if (S.mode === 'bookView') {
    
    if (dragonDone(S.bookSel) && cardDown(lx, ly)) return;
    
    S.mode = (S.bookFrom === 'map') ? 'map' : 'book'; S.t = 0; sfxTap();
    return;
  }

  if (S.mode === 'win') {
    
    if (S.win.isBoss) {
      const B = bossWinButtons();
      const inb = (b) => lx >= b.x && lx <= b.x + b.w && ly >= b.y - 8 && ly <= b.y + b.h + 8;
      if (inb(B.retry)) { sfxTap(); startBoss(S.win.gi); return; }
      if (inb(B.back))  { S.boss = null; S.mode = 'map'; S.t = 0; sfxTap(); return; }
      return;
    }
    if (S.win.phase === 'fail') {
      const B = failButtons(), WOFF = (H - BASE_H) / 2, yy = ly - WOFF;
      const inb = (b) => lx >= b.x && lx <= b.x + b.w && yy >= b.y - 6 && yy <= b.y + b.h + 6;
      if (inb(B.retry)) { sfxTap(); newBattle(); return; }
      if (inb(B.back))  { S.mode = 'map'; S.t = 0; sfxTap(); return; }
      return;
    }
    
    if (S.win.phase === 'defeat') { S.win.phase = 'piece'; S.t = 0; winStartPiece(); return; }
    if (S.win.phase === 'piece')  { S.win.phase = 'done'; S.t = 0; return; }
    S.mode = 'map'; S.t = 0; sfxTap();
    return;
  }

  if (S.mode === 'teach') {
    const tabs = introTabRects();
    if (tabs) {
      for (const t of tabs) {
        if (lx >= t.x - 4 && lx <= t.x + t.w + 4 && ly >= t.y - 8 && ly <= t.y + t.h + 8) {
          if (t.i !== S.introIdx) { startIntro(S.stage, t.i); sfxTap(); }
          return;
        }
      }
    }
    if (S.teach.phase === 'step') { if (hitStepBtn(lx, ly)) { teachStep(); } return; }
    if (S.teach.phase === 'wait') {
      const B2 = teachButtons();
      const hit = (b) => (lx - b.x) * (lx - b.x) + (ly - b.y) * (ly - b.y) < (b.r + 12) * (b.r + 12);
      if (hit(B2.replay)) { replayTeach(); sfxTap(); return; }
      if (hit(B2.next))   { teachNext(); sfxTap(); return; }
      
    }
    return;
  }
  
  if (S.mode !== 'play') return;

  
  if (!stageById(S.stage).drawQ && CONFIG.LEVELS[S.lv].assist &&
      ly > figArea().y && ly < figArea().y + figArea().h) {
    const c = pickColumn(lx, ly);
    if (c) {
      const key = c.i + ',' + c.j;
      if (S.assistOn[key]) delete S.assistOn[key]; else S.assistOn[key] = true;
      sfxTap();
      return;
    }
  }

  
  for (let i = 0; i < S.choices.length; i++) {
    const q = choiceRect(i);
    if (lx >= q.x && lx <= q.x + q.w && ly >= q.y && ly <= q.y + q.h) {
      submit(i);
      return;
    }
  }
}


let lastTouch = 0;
cv.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') lastTouch = Date.now();
  const p = toLocal(e.clientX, e.clientY);
  onDown(p.x, p.y);
}, { passive: true });

cv.addEventListener('pointermove', (e) => {
  if (!CARD.drag) return;
  const p = toLocal(e.clientX, e.clientY); cardMove(p.x, p.y);
}, { passive: true });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => cardUp(), { passive: true }));
cv.addEventListener('touchstart', (e) => {
  if (Date.now() - lastTouch < 600) return;
  lastTouch = Date.now();
  const t = e.changedTouches[0];
  const p = toLocal(t.clientX, t.clientY);
  onDown(p.x, p.y);
}, { passive: true });


window.addEventListener('keydown', (e) => {
  if (ovl.classList.contains('on')) {
    if (e.key === 'Escape') closeCode();
    return;                       
  }
  initAudio(); resumeAudio();
  const k = e.key;
  if (k === 'm' || k === 'M') { muted = !muted; return; }
  if (S.mode === 'title') {
    if (k === ' ' || k === 'Enter') { e.preventDefault(); S.mode = 'map'; S.t = 0; sfxTap(); }
    return;
  }
  if (S.mode === 'map') {
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      const first = pageStages(curPage()).find(st => st.unlocked);
      if (first) { enterStage(first.id, false); sfxTap(); }
    }
    if (k === 'ArrowLeft')  { e.preventDefault(); if (curPage() > 0) setPage(curPage() - 1); }
    if (k === 'ArrowRight') { e.preventDefault(); if (curPage() < DRAGONS.length - 1) setPage(curPage() + 1); }
    if (k === 'b' || k === 'B') { S.mode = 'book'; S.t = 0; }
    return;
  }
  if (S.mode === 'book') {
    if (k === ' ' || k === 'Enter' || k === 'Escape') { e.preventDefault(); S.mode = 'map'; S.t = 0; }
    return;
  }
  if (S.mode === 'bookView') {
    if (k === ' ' || k === 'Enter' || k === 'Escape') { e.preventDefault(); S.mode = 'book'; S.t = 0; }
    return;
  }
  if (S.mode === 'win') {
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (S.win.phase === 'fail') { S.mode = 'map'; S.t = 0; sfxTap(); }
      else if (S.win.phase === 'defeat') { S.win.phase = 'piece'; S.t = 0; winStartPiece(); }
      else if (S.win.phase === 'piece') { S.win.phase = 'done'; S.t = 0; }
      else { S.mode = 'map'; S.t = 0; sfxTap(); }
    }
    return;
  }
  if (S.mode === 'teach') {
    if (S.teach.phase === 'step' && (k === ' ' || k === 'Enter')) { e.preventDefault(); teachStep(); return; }
    if (S.teach.phase === 'wait') {
      if (k === ' ' || k === 'Enter') { e.preventDefault(); teachNext(); }
      if (k === 'r' || k === 'R') { e.preventDefault(); replayTeach(); }
    }
    if (k === 'm' || k === 'M') muted = !muted;
    return;
  }
  if (S.mode !== 'play') return;
  
  if (k >= '1' && k <= '6') submit(parseInt(k, 10) - 1);
});


['gesturestart','gesturechange','gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

function inOverlay(e){ return !!(e.target && e.target.closest && e.target.closest('#ovl')); }
document.addEventListener('contextmenu', e => { if (!inOverlay(e)) e.preventDefault(); });
let lastTapT = 0;
document.addEventListener('touchend', e => {
  if (inOverlay(e)) return;
  const now = Date.now();
  if (now - lastTapT < 320) e.preventDefault();
  lastTapT = now;
}, { passive: false });
document.addEventListener('dblclick', e => { if (!inOverlay(e)) e.preventDefault(); });

let last = 0;
function frame(ts){
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.1) dt = 0.1;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
