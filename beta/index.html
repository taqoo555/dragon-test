const U13_LV = [[2, 4, 2, 4], [2, 5, 2, 5], [3, 5, 3, 5], [3, 6, 3, 6], [4, 7, 3, 6]];

const U13_ZU_LAST = [];
const U13_KUFU_LAST = [];

function u13Pairs(g){
  if (g.t === 'same') return 0;
  if (g.t === 'seq') return Math.floor(g.cnt / 2);
  return 1;
}
function u13ZuGen(lv){
  const [pLo, pHi, bLo, bHi] = U13_LV[Math.min(lv, U13_LV.length - 1)];
  let per, bags, key;
  for (let tries = 0; tries < 30; tries++){
    per = randInt(pLo, pHi); bags = randInt(bLo, bHi);
    key = per + ':' + bags;
    if (!U13_ZU_LAST.includes(key)) break;
  }
  U13_ZU_LAST.push(key); if (U13_ZU_LAST.length > 5) U13_ZU_LAST.shift();
  const vis = (Math.random() < 0.5) ? 'dot' : 'line';   
  const correct = per + '×' + bags;
  
  const wrongs = [per + '＋' + bags, (per + 1) + '×' + bags, per + '×' + (bags + 1),
                  Math.max(1, per - 1) + '×' + bags];
  return { g: { per, bags, vis, k: 'zu' }, answer: correct, kind: 'zu',
           choices: txtChoices(correct, wrongs.filter(s => s !== correct)) };
}
function u13KufuGen(lv){
  const types = ['same', 'ends'];
  if (lv >= 1) types.push('seq');
  if (lv >= 2) types.push('group');
  let t, mid, cnt, step, nums, key;
  for (let tries = 0; tries < 30; tries++){
    t = types[randInt(0, types.length - 1)];
    if (t === 'same') {
      mid = randInt(2, 4 + lv); cnt = randInt(3, 5 + lv); step = 0;
      nums = Array.from({ length: cnt }, () => mid);
    } else if (t === 'ends') {
      mid = randInt(4, 5 + lv); cnt = randInt(4, 5 + lv);
      step = randInt(1, Math.min(2, mid - 2));
      nums = [mid - step, ...Array.from({ length: cnt - 2 }, () => mid), mid + step];
    } else if (t === 'seq') {
      cnt = (Math.random() < 0.5) ? 3 : 5;
      mid = randInt(3 + lv, 6 + lv);
      const half = (cnt - 1) / 2;
      step = randInt(1, Math.max(1, Math.min(2, Math.floor((mid - 1) / half))));
      nums = Array.from({ length: cnt }, (_, i) => mid + (i - half) * step);
    } else {
      
      const big = randInt(2, 3) * 10, small = randInt(3, 8);
      cnt = randInt(2, 3); mid = big + small; step = small;
      nums = [...Array.from({ length: cnt }, () => big), ...Array.from({ length: cnt }, () => small)];
    }
    if (mid === cnt) continue;            
    key = t + ':' + mid + ':' + cnt + ':' + step;
    if (!U13_KUFU_LAST.includes(key)) break;
  }
  U13_KUFU_LAST.push(key); if (U13_KUFU_LAST.length > 5) U13_KUFU_LAST.shift();
  const correct = mid + '×' + cnt;
  
  const wrongs = [mid + '×' + (cnt + 1), mid + '×' + (cnt - 1),
                  (mid + step) + '×' + cnt, Math.max(1, mid - step) + '×' + cnt,
                  (mid + 1) + '×' + cnt];
  return { g: { nums, mid, cnt, d: step, t, k: 'kufu' }, answer: correct, kind: 'kufu',
           choices: txtChoices(correct, wrongs.filter(s => s !== correct)) };
}
function u13Gen(lv, kind){
  return (kind === 'zu') ? u13ZuGen(lv) : u13KufuGen(lv);
}

function u13LineZu(area, per, bags){

  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke();

  }
  ctx.restore();
  u11Brace(x0, x0 + seg, y, -1, String(per), false);
  u11Brace(x0, x0 + w, y, 1, '□', true);
}

function u13KufuRow(area, g, opt){
  const n = g.nums.length, GAP = 15;
  const box = Math.max(20, Math.min(34, (area.w - 40 - (n - 1) * GAP) / n));
  const s = box + GAP;                                  
  const ox = W / 2 - (n - 1) * s / 2, oy = area.y + area.h / 2;
  const fs = Math.round(box * 0.5), pfs = Math.max(14, Math.round(box * 0.46));
  const lvd = opt.leveled || 0;
  const disp = g.nums.slice();
  if (g.t !== 'group') for (let i = 0; i < lvd; i++) { disp[i] = g.mid; disp[n - 1 - i] = g.mid; }
  disp.forEach((v, i) => {
    const x = ox + i * s;
    const moved = (g.t !== 'group') && (i < lvd || i >= n - lvd);
    const on = !!opt.allHi || moved;
    rrect(x - box / 2, oy - box / 2, box, box, 6);
    ctx.fillStyle = on ? CONFIG.C_HI_T : '#ffffff'; ctx.fill();
    ctx.strokeStyle = on ? CONFIG.C_GOLD : CONFIG.C_GRID; ctx.lineWidth = on ? 2.2 : 1.4; ctx.stroke();
    text(String(v), x, oy + 1, fs, CONFIG.C_INK);
    if (i < n - 1) text('＋', x + s / 2, oy + 1, pfs, CONFIG.C_INK, 'center', '800');
  });
  if (opt.arcPair != null) {

  { dig: 3, places: [1, 2] },
  { dig: 4, places: [2, 3] },
  { dig: 4, places: [2, 3] },
  { dig: 5, places: [3, 4] },
];
const U18_LAST = [];
function u18Gen(lv, kind){
  const cfg = U18_LV[Math.min(lv, U18_LV.length - 1)];
  const up = (kind !== 'down');
  const lo = Math.pow(10, cfg.dig - 1), hi = Math.pow(10, cfg.dig) - 1;
  let n, p, unit, key;
  for (let t = 0; t < 40; t++){
    p = cfg.places[randInt(0, cfg.places.length - 1)];
    unit = Math.pow(10, p);
    n = randInt(lo, hi);
    
    if (n % unit === 0) continue;
    key = (up ? 'u' : 'd') + ':' + n + ':' + p;
    if (!U18_LAST.includes(key)) break;
  }
  U18_LAST.push(key); if (U18_LAST.length > 4) U18_LAST.shift();
  const dn = Math.floor(n / unit) * unit, upv = dn + unit;
  const answer = String(up ? upv : dn);
  
  const other = String(up ? dn : upv);
  const big = Math.pow(10, p + 1), small = Math.pow(10, Math.max(0, p - 1));
  const wrongs = [other, String(n),
    String(up ? (Math.floor(n / big) * big + big) : (Math.floor(n / big) * big)),
    String(up ? (Math.floor(n / small) * small + small) : (Math.floor(n / small) * small))];
  return { g: { n, p, unit, up, dn, upv }, answer, kind: up ? 'up' : 'down',
    choices: txtChoices(answer, wrongs.filter(v => v !== answer)) };
}

  if (opt.reveal != null) text('→ ' + opt.reveal, W / 2, oy + box * 0.9 + 26, 20, CONFIG.C_OK, 'center', '800');

const U20_NAME = ['ア', 'イ', 'ウ', 'エ', 'オ'];

const U20_LV = [4, 4, 4, 5, 5];
function u20Perms(n){
  const out = [];
  const rec = (cur, rest) => {
    if (!rest.length) { out.push(cur.slice()); return; }
    for (let i = 0; i < rest.length; i++) rec(cur.concat(rest[i]), rest.filter((_, j) => j !== i));
  };
  rec([], Array.from({ length: n }, (_, i) => i + 1));
  return out;
}


function u20Candidates(sol){
  const n = sol.length, out = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (i === j) continue;
    const d = sol[j] - sol[i];
    if (d > 0) out.push({ t: U20_NAME[i] + 'の数は ' + U20_NAME[j] + 'の数より ' + d + ' 小さい',
                          p: [i, j], op: 'lt', k: d });
    if (d < 0) out.push({ t: U20_NAME[i] + 'の数は ' + U20_NAME[j] + 'の数より ' + (-d) + ' 大きい',
                          p: [i, j], op: 'gt', k: -d });
  }
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let m = 0; m < n; m++) {
    if (m === i || m === j) continue;
    if (sol[i] + sol[j] === sol[m])
      out.push({ t: U20_NAME[i] + 'の数と ' + U20_NAME[j] + 'の数を たすと ' + U20_NAME[m] + 'の数に なる',
                 p: [i, j, m], op: 'sum', k: 0 });
  }
  return out;
}

function u20Ok(c, v){
  const a = v[c.p[0]], b = v[c.p[1]], m = (c.p.length > 2) ? v[c.p[2]] : null;
  if (a == null || b == null || (c.p.length > 2 && m == null)) return true;
  if (c.op === 'lt') return b - a === c.k;
  if (c.op === 'gt') return a - b === c.k;
  return a + b === m;
}

function u20Rows(g, upto){
  const clues = g.clues.slice(0, upto);
  const pos = [];
  clues.forEach(c => c.p.forEach(i => { if (pos.indexOf(i) < 0) pos.push(i); }));
  pos.sort((a, b) => a - b);
  const out = [];
  const rec = (k, v, used) => {
    if (k >= pos.length) { out.push(v.slice()); return; }
    for (let x = 1; x <= g.n; x++) {
      if (used[x]) continue;
      v[pos[k]] = x; used[x] = 1;
      if (clues.every(c => u20Ok(c, v))) rec(k + 1, v, used);
      used[x] = 0; v[pos[k]] = null;
    }
  };
  rec(0, Array(g.n).fill(null), {});
  return out;
}

function u20Pos(g, upto){
  const pos = [];
  g.clues.slice(0, upto).forEach(c => c.p.forEach(i => { if (pos.indexOf(i) < 0) pos.push(i); }));
  return pos.sort((a, b) => a - b);
}

function u20Step(g, k){
  const cur = u20Rows(g, k);
  if (k <= 1) return cur.map(v => ({ v, dead: false }));
  const prev = u20Rows(g, k - 1), pp = u20Pos(g, k - 1);
  const out = [];
  prev.forEach(pv => {
    const kids = cur.filter(cv => pp.every(i => cv[i] === pv[i]));
    if (kids.length) kids.forEach(cv => out.push({ v: cv, dead: false }));
    else out.push({ v: pv, dead: true });
  });
  return out;
}
function u20Gen(lv){
  const n = U20_LV[Math.min(lv, U20_LV.length - 1)];
  const perms = u20Perms(n);
  const MAXROW = 7;                                  
  for (let attempt = 0; attempt < 60; attempt++) {
    const sol = perms[randInt(0, perms.length - 1)];
    const cands = shuffleArr(u20Candidates(sol).slice());
    const clues = [];
    let rest = perms;
    for (let step = 0; step < 4 && rest.length > 1; step++) {
      const okList = [], killList = [];
      for (const c of cands) {
        if (clues.indexOf(c) >= 0) continue;
        const nx = rest.filter(pp => u20Ok(c, pp));
        if (nx.length === rest.length) continue;     
        const tryClues = clues.concat(c);
        
        const disp = u20Step({ n, clues: tryClues }, tryClues.length);
        if (disp.length > MAXROW) continue;
        okList.push({ c, nx });
        
        if (step > 0 && disp.some(r => r.dead)) killList.push({ c, nx });
      }
      const pool = killList.length ? killList : okList;
      if (!pool.length) break;
      const pick = pool[randInt(0, pool.length - 1)];
      clues.push(pick.c); rest = pick.nx;
    }
    if (rest.length !== 1) continue;                 
    
    const gTry = { n, clues };
    let killed = false;
    for (let k = 2; k <= clues.length; k++) if (u20Step(gTry, k).some(r => r.dead)) { killed = true; break; }
    if (!killed) continue;
    const ask = randInt(0, n - 1);
    return { g: { n, sol, clues, ask }, answer: sol[ask], kind: 'u20',
      choices: shuffleArr(Array.from({ length: n }, (_, i) => i + 1)) };
  }
  
  const sol = [2, 4, 1, 3];
  const clues = [{ t: 'ウの数は エの数より 2 小さい', p: [2, 3], op: 'lt', k: 2 },
                 { t: 'アの数は エの数より 1 小さい', p: [0, 3], op: 'lt', k: 1 },
                 { t: 'イの数は アの数より 2 大きい', p: [1, 0], op: 'gt', k: 2 }];
  return { g: { n: 4, sol, clues, ask: 3 }, answer: 3, kind: 'u20',
    choices: shuffleArr([1, 2, 3, 4]) };
}

function isEven(n){ return n % 2 === 0; }
function pickParityNum(kind, lv){
  const hi = 4 + lv * 2;                              
  const k = randInt(1, hi);
  return (kind === 'even') ? k * 2 : k * 2 - 1;
}

const PARITY_EXPR = [
  [['even','＋','even']], [['odd','＋','odd']], [['even','＋','odd']],
  [['even','×','even']], [['odd','×','odd']], [['even','×','odd']],
  [['odd','－','odd'],['＋','even']], [['odd','×','even'],['×','odd']],
];

const PARITY_LAST = [];
function parityGen(lv){
  let nums, ops, val, stmt;
  for (let t = 0; t < 30; t++) {
    const tmpl = PARITY_EXPR[randInt(0, PARITY_EXPR.length - 1)];
    nums = []; ops = [];
    val = pickParityNum(tmpl[0][0], lv);
    nums.push(val);
    tmpl.forEach((seg) => {
      const [k1, op, k2] = seg.length === 3 ? seg : [null, seg[0], seg[1]];
      const n2 = pickParityNum(k2, lv);
      if (op === '＋') val = val + n2; else if (op === '－') val = val - n2; else val = val * n2;
      ops.push(op); nums.push(n2);
    });
    stmt = nums.map((n, i) => (i === 0 ? String(n) : ' ' + ops[i - 1] + ' ' + n)).join('');
    if (!PARITY_LAST.includes(stmt)) break;
  }
  PARITY_LAST.push(stmt); if (PARITY_LAST.length > 3) PARITY_LAST.shift();
  const answer = isEven(val) ? 'ぐう' : 'き';
  const choices = shuffleArr([{ v: 'ぐう', txt: 'ぐう数' }, { v: 'き', txt: 'き数' }]);
  return { g: { stmt, val, nums, ops }, answer, kind: 'parity', choices };
}
function parityDraw(area, opt){
  opt = opt || {};
  const g = opt.g || S.g;
  ctx.save();
  text(g.stmt, W / 2, area.y + area.h * 0.36, 28, CONFIG.C_INK, 'center', '800');
  if (opt.reveal != null) {
    text(g.stmt + ' ＝ ' + g.val, W / 2, area.y + area.h - 32, 16, CONFIG.C_GOLD, 'center', '800');
    text(g.val + ' は ' + opt.reveal + '数', W / 2, area.y + area.h - 10, 17, CONFIG.C_OK, 'center', '800');
  }
  ctx.restore();
}
function parityTeachBegin(){

    (g.ops && g.ops.length > 1) ? '左から1つずつ、じゅんに計算します。' : ('まず、' + st + 'を計算します。'),

                  : (g.val + 'を2でわると、' + Math.floor(g.val / 2) + 'あまり1です。\nあまりが出るので、' + g.val + 'はき数です。'),
  ];

  return makeTeach(3, msgs, ['', '計算', String(g.val), ans], { g, mk: 'parity' });
}

const GRIDMUL_LV = [[2, 4], [2, 5], [2, 6], [2, 7], [2, 9]];
function gridmulGen(lv){
  const [lo, hi] = GRIDMUL_LV[Math.min(lv, GRIDMUL_LV.length - 1)];
  const a = randInt(lo, hi), b = randInt(lo, hi), c = randInt(lo, hi), d = randInt(lo, hi);
  const vals = [a, b, c, d];                    
  const rowLab = [a * b, c * d], colLab = [a * c, b * d];
  const ask = randInt(0, 3);
  const answer = vals[ask];
  const others = vals.filter((_, i) => i !== ask);
  const wrongs = [rowLab[ask < 2 ? 0 : 1], colLab[ask % 2], others[0], others[1] || answer + 1, answer + 1, Math.max(1, answer - 1)];
  return { g: { vals, rowLab, colLab, ask }, answer, kind: 'gridmul', choices: numChoices(answer, wrongs) };
}
function gridmulDraw(area, opt){
  opt = opt || {};
  const g = opt.g || S.g;
  ctx.save();
  const cs = 58, x0 = W / 2 - cs, y0 = area.y + 56;
  const lx0 = x0 - 40, ly0 = y0 - 40;
  
  for (let c = 0; c < 2; c++) {
    text(String(g.colLab[c]), x0 + cs / 2 + c * cs, ly0, 15, CONFIG.C_INK_SOFT, 'center', '800');
    ctx.strokeStyle = CONFIG.C_INK_SOFT; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(x0 + cs / 2 + c * cs, ly0 + 10); ctx.lineTo(x0 + cs / 2 + c * cs, y0 - 4); ctx.stroke();
  }
  
  for (let r = 0; r < 2; r++) {
    text(String(g.rowLab[r]), lx0, y0 + cs / 2 + r * cs, 15, CONFIG.C_INK_SOFT, 'right', '800');
    ctx.strokeStyle = CONFIG.C_INK_SOFT; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(lx0 + 6, y0 + cs / 2 + r * cs); ctx.lineTo(x0 - 4, y0 + cs / 2 + r * cs); ctx.stroke();
  }
  for (let i = 0; i < 4; i++) {
    const r = Math.floor(i / 2), c = i % 2;
    const x = x0 + c * cs, y = y0 + r * cs;
    const isAsk = (i === g.ask);
    rrect(x + 2, y + 2, cs - 4, cs - 4, 6);
    ctx.fillStyle = isAsk ? (opt.reveal ? '#dff3e3' : '#fff1bd') : '#ffffff';
    ctx.fill();
    ctx.strokeStyle = isAsk ? CONFIG.C_GOLD : CONFIG.C_EDGE; ctx.lineWidth = isAsk ? 2.4 : 1.6; ctx.stroke();
    const lab = isAsk ? (opt.reveal ? String(g.vals[i]) : '？') : String(g.vals[i]);
    text(lab, x + cs / 2, y + cs / 2 + 1, 22, isAsk && opt.reveal ? CONFIG.C_OK : CONFIG.C_INK, 'center', '800');
  }
  ctx.restore();
}
function gridmulTeachBegin(){
  const g = S.g;
  const r = Math.floor(g.ask / 2), c = g.ask % 2;
  const other = g.vals[r * 2 + (1 - c)];           
  const rowLab = g.rowLab[r];

  
  const eq = (c === 0) ? ('？×' + other) : (other + '×？');
  const msgs = [
    '？と同じ横のならびを見ます。\n横の2つの数をかけると、左の' + rowLab + 'になります。',
    eq + '＝' + rowLab + 'なので、\n？は' + rowLab + '÷' + other + '＝' + g.vals[g.ask] + 'です。',
    '？に入る数は' + g.vals[g.ask] + 'です。',
  ];
  return makeTeach(2, msgs, ['', String(g.vals[g.ask]), String(g.vals[g.ask])], { g, mk: 'gridmul' });
}
function gridmulTeachDraw(area, T){
  const g = T.g, n = T.shown, last = T.total;
  gridmulDraw(teachFigArea(area), { g, reveal: n >= last });
}
function gridmulKindIcon(kind, x, y, s){
  ctx.save();
  for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
    rrect(x - s * 0.24 + c * s * 0.24, y - s * 0.24 + r * s * 0.24, s * 0.2, s * 0.2, 3);
    ctx.fillStyle = (r === 0 && c === 1) ? '#fff1bd' : '#ffffff'; ctx.fill();
    ctx.strokeStyle = CONFIG.C_EDGE; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
}

function iconBinary(x, y, s){          
  const r = s * 0.11, g2 = s * 0.26;
  const on = [1,0,1,1];
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(x - g2*1.5 + i*g2, y, r, 0, Math.PI*2);
    ctx.fillStyle = on[i] ? CONFIG.C_INK : '#ffffff';
    ctx.fill();
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 1.6; ctx.stroke();
  }
}
function iconPerm(x, y, s){            
  const w = s * 0.20, g2 = s * 0.25;
  for (let i = 0; i < 3; i++) {
    rrect(x - g2 - w/2 + i*g2, y - w/2 + (i===1 ? -s*0.14 : 0), w, w, 3);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 1.6; ctx.stroke();
  }
}
function iconComb(x, y, s){            
  const r = s * 0.11, g2 = s * 0.26;
  const pick = [1,0,1,0];
  for (let i = 0; i < 4; i++) {
    const cx = x - g2*0.5 + (i%2)*g2, cy = y - g2*0.5 + Math.floor(i/2)*g2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = pick[i] ? CONFIG.C_INK : '#ffffff'; ctx.fill();
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 1.6; ctx.stroke();
  }
}
function iconMixed(x, y, s){           
  const R = s * 0.30, r = R * 0.44, pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5, rad = (i % 2 === 0) ? R : r;
    pts.push([x + Math.cos(a)*rad, y + Math.sin(a)*rad]);
  }
  poly(pts, '#ffffff', CONFIG.C_INK, 1.8);
}

const WHITE_CACHE = {};
function whiteVersion(im){
  const key = im.src.length + 'x' + im.naturalWidth;
  if (WHITE_CACHE[key]) return WHITE_CACHE[key];
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(im, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  WHITE_CACHE[key] = c;
  return c;
}


function drawContain(im, box){
  const s = Math.min(box.w / imW(im), box.h / imH(im));
  const w = imW(im) * s, h = imH(im) * s;
  ctx.drawImage(im, box.x + (box.w - w) / 2, box.y + (box.h - h) / 2, w, h);
}

const RUBY_SIZE = 10, RUBY_GAP = 3;

const RUBY_ON = false;

function measureRuby(parts, size){
  ctx.font = '700 ' + size + 'px ' + FONT;
  let w = 0;
  for (const p of parts) {
    if (typeof p === 'string') { w += ctx.measureText(p).width; continue; }
    if (!RUBY_ON) { w += ctx.measureText(p[0]).width; continue; }
    const bw = ctx.measureText(p[0]).width;
    ctx.font = '700 ' + RUBY_SIZE + 'px ' + FONT;
    const rw = ctx.measureText(p[1]).width;
    ctx.font = '700 ' + size + 'px ' + FONT;
    w += Math.max(bw, rw);
  }
  return w;
}

function drawRuby(parts, x, y, size, color){
  let cx = x;
  for (const p of parts) {
    if (typeof p === 'string') {
      ctx.font = '700 ' + size + 'px ' + FONT;
      const w = ctx.measureText(p).width;
      text(p, cx + w/2, y, size, color);
      cx += w;
      continue;
    }
    ctx.font = '700 ' + size + 'px ' + FONT;
    const bw = ctx.measureText(p[0]).width;
    if (!RUBY_ON) { text(p[0], cx + bw/2, y, size, color); cx += bw; continue; }
    ctx.font = '700 ' + RUBY_SIZE + 'px ' + FONT;
    const rw = ctx.measureText(p[1]).width;
    const w = Math.max(bw, rw);
    text(p[0], cx + w/2, y, size, color);
    text(p[1], cx + w/2, y - size/2 - RUBY_GAP - RUBY_SIZE/2 + 1, RUBY_SIZE, color);
    cx += w;
  }
}


function drawKindIcon(kind, x, y, s){
  const B = basisIso(35, 30);
  ctx.save();
  if (kind === 'cols') {
    
    const g1 = [[1]];
    const f1 = fitFor(g1, B, { x: x - s*0.34, y: y - s*0.46, w: s*0.68, h: s*0.68, maxPx: s*0.40 });
    const P = (px, pz) => {
      const q = proj(B, px, 0, pz);
      return [ q[0]*f1.S + f1.ox, q[1]*f1.S + f1.oy ];
    };
    const m = 0.85;
    poly([P(-m,-m), P(1+m,-m), P(1+m,1+m), P(-m,1+m)], 'rgba(140,122,214,0.22)', '#8c7ad6', 2);
    drawShape(g1, B, f1, {});
  } else if (kind === 'hidden') {
    
    const g1 = [[1]];
    const f2 = fitFor(g1, B, { x: x - s*0.52, y: y - s*0.56, w: s*0.6, h: s*0.6, maxPx: s*0.46 });
    ctx.setLineDash([3, 2.5]);
    drawShape(g1, B, f2, { pal: { top:'rgba(0,0,0,0)', left:'rgba(0,0,0,0)', right:'rgba(0,0,0,0)', edge: CONFIG.C_INK_SOFT } });
    ctx.setLineDash([]);
    const f1 = fitFor(g1, B, { x: x - s*0.06, y: y - s*0.10, w: s*0.62, h: s*0.62, maxPx: s*0.48 });
    drawShape(g1, B, f1, {});
  } else {
    
    const g3 = [[2,1],[1,0]];
    const f = fitFor(g3, B, { x: x - s*0.5, y: y - s*0.5, w: s, h: s, maxPx: s*0.34 });
    drawShape(g3, B, f, {});
  }
  ctx.restore();
}

const TINT_CACHE = {};
function tintVersion(im, tint, alpha){
  alpha = alpha || 0.42;
  const key = (im.src || '').slice(-24) + '|' + tint + '|' + alpha;
  if (TINT_CACHE[key]) return TINT_CACHE[key];
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(im, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = alpha; g.fillStyle = tint; g.fillRect(0, 0, c.width, c.height);
  TINT_CACHE[key] = c;
  return c;
}


function drawEnemyArt(box, e, t, white){
  const im = e.img && IMG[e.img];
  if (im) {
    const fl = 1 + 0.03 * Math.sin(t * 2.2);      
    ctx.save();
    const cx0 = box.x + box.w/2, cy0 = box.y + box.h/2;
    ctx.translate(cx0, cy0); ctx.scale(1, fl); ctx.translate(-cx0, -cy0);
    if (e.tint) {
      const tv = tintVersion(im, e.tint, e.tintA);
      const sc0 = Math.min(box.w / im.naturalWidth, box.h / im.naturalHeight);
      const w0 = im.naturalWidth * sc0, h0 = im.naturalHeight * sc0;
      ctx.drawImage(tv, box.x + (box.w - w0)/2, box.y + (box.h - h0)/2, w0, h0);
    } else {
      drawContain(im, box);
    }
    if (white > 0.01) {
      ctx.globalAlpha = Math.min(1, white);
      const wv = whiteVersion(im);
      const sc = Math.min(box.w / im.naturalWidth, box.h / im.naturalHeight);
      const w = im.naturalWidth * sc, h = im.naturalHeight * sc;
      ctx.drawImage(wv, box.x + (box.w - w)/2, box.y + (box.h - h)/2, w, h);
    }
    ctx.restore();
    return;
  }
  const cx = box.x + box.w/2, cy = box.y + box.h/2;
  const s = Math.min(box.w / 130, box.h / 100);
  const P = (px, py) => [cx + px*s, cy + py*s];
  const fl = 1 + 0.04 * Math.sin(t * 2.2);      
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, fl); ctx.translate(-cx, -cy);
  ctx.lineJoin = 'round';
  
  poly([P(-44,44), P(-30,-6), P(-14,-30), P(14,-30), P(30,-6), P(44,44),
        P(26,36), P(12,46), P(0,34), P(-12,46), P(-26,36)], e.c1, e.c1, 2);
  
  poly([P(-30,-6), P(-46,-22), P(-22,-16)], e.c2, e.c1, 2);
  poly([P( 30,-6), P( 46,-22), P( 22,-16)], e.c2, e.c1, 2);
  
  poly([P(-15,-30), P(15,-30), P(19,-44), P(0,-52), P(-19,-44)], e.c1, e.c1, 2);
  
  if (e.horn === 1) {
    poly([P(-15,-44), P(-34,-64), P(-20,-38)], e.c2, e.c1, 2);
    poly([P( 15,-44), P( 34,-64), P( 20,-38)], e.c2, e.c1, 2);
  } else if (e.horn === 2) {
    poly([P(-13,-46), P(-24,-70), P(-6,-50)], e.c2, e.c1, 2);
    poly([P( 13,-46), P( 24,-70), P(  6,-50)], e.c2, e.c1, 2);
    poly([P(-4,-50), P(0,-72), P(4,-50)], e.c2, e.c1, 2);
  } else {
    poly([P(-16,-42), P(-40,-50), P(-30,-58), P(-18,-50)], e.c2, e.c1, 2);
    poly([P( 16,-42), P( 40,-50), P( 30,-58), P( 18,-50)], e.c2, e.c1, 2);
  }
  
  const glow = 0.65 + 0.35 * Math.sin(t * 3.1);
  for (const dx of [-7, 7]) {
    ctx.save();
    ctx.globalAlpha *= glow;      
    ctx.beginPath();
    ctx.ellipse(cx + dx*s, cy - 40*s, 4.2*s, 2.6*s, dx > 0 ? -0.3 : 0.3, 0, Math.PI*2);
    ctx.fillStyle = e.eye; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

const SIL_CACHE = {};
function silhouetteVersion(im){
  const key = (im.src || '').slice(-24);
  if (SIL_CACHE[key]) return SIL_CACHE[key];
  const c = document.createElement('canvas');
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d');
  g.drawImage(im, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = 0.88; g.fillStyle = '#141028'; g.fillRect(0, 0, c.width, c.height);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.font = '800 ' + Math.round(c.width * 0.6) + 'px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', c.width / 2, c.height * 0.55);
  SIL_CACHE[key] = c;

function pieceShapes(n){ return PIECE_SHAPES[n] || PIECE_SHAPES[5]; }
function piecePath(box, poly, dx, dy){
  ctx.beginPath();
  poly.forEach((p, i) => {
    const x = box.x + p[0] * box.w + (dx || 0), y = box.y + p[1] * box.h + (dy || 0);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
}
function pieceCenter(box, poly){
  let x = 0, y = 0;
  poly.forEach(p => { x += p[0]; y += p[1]; });
  return { x: box.x + (x / poly.length) * box.w, y: box.y + (y / poly.length) * box.h };
}

let STONE_TEX = null;
function stoneTexture(){
  if (STONE_TEX) return STONE_TEX;
  const c = document.createElement('canvas'); c.width = 160; c.height = 160;
  const g = c.getContext('2d');
  const im = g.createImageData(160, 160), d = im.data;
  let seed = 7;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < d.length; i += 4) {
    const v = 128 + (rnd() - 0.5) * 70;
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  
  for (let k = 0; k < 26; k++) {
    const x = rnd() * 160, y = rnd() * 160, r = 8 + rnd() * 22;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(' + (rnd() < 0.5 ? '0,0,0' : '255,255,255') + ',0.16)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  STONE_TEX = c;
  return c;
}
function drawStoneFill(box, poly, dark){
  ctx.save();
  piecePath(box, poly); ctx.clip();
  
  const g = ctx.createLinearGradient(box.x, box.y, box.x + box.w, box.y + box.h);
  if (dark) { g.addColorStop(0, '#5a5270'); g.addColorStop(0.5, '#3f3852'); g.addColorStop(1, '#2a2438'); }
  else      { g.addColorStop(0, '#d8d0c2'); g.addColorStop(0.5, '#bcb3a4'); g.addColorStop(1, '#9f968a'); }
  ctx.fillStyle = g; ctx.fill();
  
  try {
    const pat = ctx.createPattern(stoneTexture(), 'repeat');
    ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = dark ? 0.55 : 0.4;
    ctx.fillStyle = pat; ctx.fillRect(box.x, box.y, box.w, box.h); ctx.restore();
  } catch(e) {}
  
  ctx.save();
  piecePath(box, poly);
  ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 10; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawSealMark(box, dark){
  const cx = box.x + box.w/2, cy = box.y + box.h/2, r = box.w * 0.34;
  ctx.save();
  
  ctx.globalAlpha = dark ? 0.075 : 0.11;
  ctx.strokeStyle = dark ? '#ffd889' : '#6b5a2a'; ctx.lineWidth = Math.max(1, box.w * 0.008);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.72, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  for (let k = 0; k < 6; k++) { const a = -Math.PI/2 + k * Math.PI/3; const x = cx + Math.cos(a) * r * 0.72, y = cy + Math.sin(a) * r * 0.72; if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
  ctx.closePath(); ctx.stroke();
  for (let k = 0; k < 12; k++) { const a = k * Math.PI/6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.lineTo(cx + Math.cos(a) * r * 1.08, cy + Math.sin(a) * r * 1.08); ctx.stroke(); }
  ctx.restore();
}

function strokeOuterEdges(box, poly){
  const EPS = 0.012;
  const onEdge = (p) => (p[0] <= EPS || p[0] >= 1 - EPS || p[1] <= EPS || p[1] >= 1 - EPS);
  const sameSide = (a, b) =>
    (a[0] <= EPS && b[0] <= EPS) || (a[0] >= 1 - EPS && b[0] >= 1 - EPS) ||
    (a[1] <= EPS && b[1] <= EPS) || (a[1] >= 1 - EPS && b[1] >= 1 - EPS);
  const X = (p) => box.x + p[0] * box.w, Y = (p) => box.y + p[1] * box.h;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      if (!onEdge(a) || !onEdge(b) || !sameSide(a, b)) continue;
      ctx.moveTo(X(a), Y(a)); ctx.lineTo(X(b), Y(b));
    }
    if (pass === 0) { ctx.shadowColor = 'rgba(255,190,70,0.8)'; ctx.shadowBlur = 9; ctx.strokeStyle = '#e9b45c'; ctx.lineWidth = 3.4; }
    else { ctx.shadowBlur = 0; ctx.strokeStyle = '#ffe6a8'; ctx.lineWidth = 1.3; }
    ctx.stroke();
  }
  ctx.restore();
}
function drawDragonPuzzle(box, d, slots, opt){
  opt = opt || {};
  const n = opt.n || CONFIG.PIECES_PER_DRAGON;
  const gold = opt.gold || [];
  const shapes = pieceShapes(n);
  const shown = {};
  (slots || []).forEach((sl, k) => { shown[sl] = k; });
  const got = (slots || []).length;

  
  const sealed = 1 - got / n;
  const fw = Math.max(5, box.w * 0.032);
  ctx.save();
  ctx.shadowColor = 'rgba(179,155,255,' + (0.15 + 0.5 * sealed) + ')'; ctx.shadowBlur = 14 + 10 * sealed;
  rrect(box.x - fw, box.y - fw, box.w + 2 * fw, box.h + 2 * fw, fw * 1.2);
  ctx.fillStyle = opt.dark ? '#1b1626' : '#6f6656'; ctx.fill();
  ctx.restore();
  const fg = ctx.createLinearGradient(box.x, box.y, box.x + box.w, box.y + box.h);
  fg.addColorStop(0, 'rgba(255,255,255,0.35)'); fg.addColorStop(0.5, 'rgba(255,255,255,0.06)'); fg.addColorStop(1, 'rgba(0,0,0,0.5)');
  rrect(box.x - fw, box.y - fw, box.w + 2 * fw, box.h + 2 * fw, fw * 1.2);
  ctx.strokeStyle = fg; ctx.lineWidth = 2; ctx.stroke();

  
  for (let idx = 0; idx < n; idx++) if (!(idx in shown)) drawStoneFill(box, shapes[idx], opt.dark);
  if (got < n) {
    ctx.save();
    ctx.beginPath();
    for (let idx = 0; idx < n; idx++) if (!(idx in shown)) { const poly = shapes[idx]; poly.forEach((p, i) => { const x = box.x + p[0] * box.w, y = box.y + p[1] * box.h; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }); ctx.closePath(); }
    ctx.clip();
    drawSealMark(box, opt.dark);
    ctx.restore();
  }
  for (let idx = 0; idx < n; idx++) {
    if (idx in shown) continue;
    ctx.save();
    piecePath(box, shapes[idx]);
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.clip();
    piecePath(box, shapes[idx], 1.2, 1.2);
    ctx.strokeStyle = opt.dark ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  for (let idx = 0; idx < n; idx++) {
    if (!(idx in shown)) continue;
    const poly = shapes[idx];
    
    let dy = 0, sc = 1, al = 1, rot = 0;
    if (opt.popIdx === idx && opt.pop != null) {
      const p = opt.pop;                     
      const e2 = 1 - Math.pow(1 - Math.min(1, p * 1.25), 3);
      dy = (1 - e2) * 120;
      sc = 1 + (1 - e2) * 0.5;
      rot = (1 - e2) * 0.35;
      al = Math.min(1, p * 3);
      if (p > 0.8) { const q = (p - 0.8) / 0.2; sc = 1 + 0.07 * Math.sin(q * Math.PI); }
    }
    const c = pieceCenter(box, poly);
    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(c.x, c.y + dy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-c.x, -c.y);
    
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    piecePath(box, poly); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
    ctx.save();
    piecePath(box, poly); ctx.clip();
    drawDragonArt(box, d);
    ctx.restore();
    
    const isGold = gold.indexOf(idx) >= 0;
    piecePath(box, poly);
    ctx.strokeStyle = 'rgba(20,12,30,0.75)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
    if (isGold) strokeOuterEdges(box, poly);
    ctx.restore();
  }
}

function makeKindBag(){
  const st = stageById(S.stage);
  const kinds = st.kinds || CONFIG.KIND_BAG;
  const base = kinds.slice(0, CONFIG.QUESTIONS_PER_SET);
  while (base.length < CONFIG.QUESTIONS_PER_SET) base.push(kinds[0] || 'all');
  for (let t = 0; t < 40; t++) {
    for (let i = base.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const x = base[i]; base[i] = base[j]; base[j] = x;
    }
    let run = 1, bad = false;
    for (let i = 1; i < base.length; i++) {
      run = (base[i] === base[i-1]) ? run + 1 : 1;
      if (run >= 3) { bad = true; break; }
    }
    if (!bad) break;
  }
  return base;
}

function bossBag(gi){
  const ids = pageStages(gi).filter(st => st.unlocked).map(st => st.id);
  if (!ids.length) return [];
  const bag = [];
  while (bag.length < CONFIG.BOSS_QS) bag.push(ids[bag.length % ids.length]);
  for (let t = 0; t < 60; t++) {
    shuffleArr(bag);
    let run = 1, bad = false;
    for (let i = 1; i < bag.length; i++) { run = (bag[i] === bag[i-1]) ? run + 1 : 1; if (run >= 3) { bad = true; break; } }
    if (!bad) break;
  }
  return bag;
}

  const list = pageStages(gi);
  const a = enemyFor(list[list.length - 1].id);
  return Object.assign({}, a, { tint: null, tintA: 0 });
}

function spawnShards(x, y, n, strong){
  for (let i = 0; i < n; i++) {
    const a = (-0.15 - Math.random() * 0.7) * Math.PI;
    const sp = (70 + Math.random() * 160) * (strong ? 1.7 : 1);
    S.shards.push({
      
      x: x + (Math.random() - 0.5) * (strong ? 120 : 78),
      y: y + (Math.random() - 0.5) * 56,
      vx: Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1),
      vy: Math.sin(a) * sp,
      r: (Math.random() < 0.5 ? 1 : -1) * (2 + Math.random() * 5),
      a: Math.random() * 6.28,
      s: (strong ? 7 : 4) + Math.random() * 6,
      t: 0, life: 0.5 + Math.random() * 0.5,
    });
  }
}
function enemyHit(){
  const e = S.enemy;
  if (!e) return;
  e.hp = Math.max(0, e.hp - 1);
  S.hitFx = 1;
  e.knockT = 1;
  e.whiteT = 1;
  S.hpFlash = 1;
  
  S.combo++;
  S.comboPop = 1;
  S.slashN = CONFIG.COMBO_SLASH[Math.min(S.combo - 1, CONFIG.COMBO_SLASH.length - 1)];
  S.slashT = 1;
  
  if (S.boss) {
    const stt = bossState(S.boss.gi);
    const crit = S.slashN >= 3;
    const mult = 1 + 0.15 * Math.max(0, S.combo - 1);
    const dmg = Math.max(1, Math.round(stt.atk * mult * (crit ? 2 : 1)));
    S.boss.dmg += dmg;
    if (crit) S.boss.crits++;
    
    S.boss.maxHit = Math.max(S.boss.maxHit || 0, dmg);
    const tier = powTier(dmg);
    
    const seq = S.results.filter(Boolean).length;
    S.dmgPops.push({ v: dmg, crit, tier, t: 0,
      x: W/2 + ((seq % 3) - 1) * 62 + (Math.random() * 14 - 7),
      y: AREA.enemy.y + 104 + (seq % 2) * 14 });
    if (S.dmgPops.length > 4) S.dmgPops.shift();
    startBreath(tier);
  }
  
  S.finish = S.boss
    ? (S.results.filter(Boolean).length >= CONFIG.BOSS_MIN_OK)
    : (e.hp === 0);
  S.freeze = S.finish ? CONFIG.FREEZE_FINISH : CONFIG.FREEZE_HIT;
  S.impact = 1;
  const a = AREA.enemy;
  spawnShards(W/2, a.y + 66, S.finish ? CONFIG.SHARDS * 2 : CONFIG.SHARDS, S.finish);

function teachStep(){
  const T = S.teach;
  if (!T || T.phase !== 'step') return;
  if (T.shown >= T.total) { T.phase = 'wait'; S.t = 0; return; }
  T.onStep(T.shown);
  T.shown++;
  T.tStep = 0; S.t = 0;
  if (T.shown >= T.total) T.phase = 'wait';
}

function replayTeach(){
  const T = S.teach;

  S.t = 0;

function update(dt){
  
  if (S.freeze > 0) { S.freeze = Math.max(0, S.freeze - dt); return; }
  S.t += dt;
  if (S.mode === 'bookView') updateCard(dt);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.2);
  if (S.kindPop > 0) S.kindPop = Math.max(0, S.kindPop - dt * 2.0);
  if (S.comboPop > 0) S.comboPop = Math.max(0, S.comboPop - dt * 1.8);
  if (S.slashT > 0) S.slashT = Math.max(0, S.slashT - dt * 3.4);
  if (S.hpFlash > 0) S.hpFlash = Math.max(0, S.hpFlash - dt * 3.0);
  if (motes) for (const m of motes) { m.y += m.sp * dt; if (m.y > 1.05) { m.y = -0.05; m.x = Math.random() * W; } }
  if (S.impact > 0) S.impact = Math.max(0, S.impact - dt / (S.finish ? 0.75 : 0.34));
  if (S.hintT > 0) S.hintT = Math.max(0, S.hintT - dt / 2.0);
  
  for (let i = S.shards.length - 1; i >= 0; i--) {
    const p = S.shards[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 620 * dt;
    p.a += p.r * dt;
    if (p.t >= p.life) S.shards.splice(i, 1);
  }
  
  if (S.breathT > 0) S.breathT = Math.max(0, S.breathT - dt * 1.6);
  if (S.dmgPops) for (let i = S.dmgPops.length - 1; i >= 0; i--) {
    S.dmgPops[i].t += dt;
    if (S.dmgPops[i].t > 1.1) S.dmgPops.splice(i, 1);
  }
  if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
  if (S.hitFx > 0) S.hitFx = Math.max(0, S.hitFx - dt / CONFIG.T_HIT);
  if (S.enemy) {
    if (S.enemy.hurtT > 0) S.enemy.hurtT = Math.max(0, S.enemy.hurtT - dt);
    if (S.enemy.knockT > 0) S.enemy.knockT = Math.max(0, S.enemy.knockT - dt / CONFIG.T_KNOCK);
    if (S.enemy.whiteT > 0) S.enemy.whiteT = Math.max(0, S.enemy.whiteT - dt * 5.5);
    if (S.enemy.introT < 1) S.enemy.introT = Math.min(1, S.enemy.introT + dt / CONFIG.T_INTRO);
    
    const d = S.enemy.hp - S.enemy.hpShown;
    S.enemy.hpShown += d * Math.min(1, dt * 7);
    if (Math.abs(d) < 0.02) S.enemy.hpShown = S.enemy.hp;
    if (S.mode === 'win' && S.win && S.win.phase !== 'fail') S.enemy.fallT += dt;
  }

  if (S.mode === 'win') {
    const w = S.win;
    
    if (w.isBoss) { if (S.breathT > 0) S.breathT = Math.max(0, S.breathT - dt * 1.6); return; }
    updateWinFx(dt);
    if (w.phase === 'defeat' && S.t >= CONFIG.T_DEFEAT) {
      w.phase = 'piece'; S.t = 0; winStartPiece();
      if (w.completed || w.goldNow) setTimeout(() => { if (!muted) sfxDragon(); }, 700);
    } else if (w.phase === 'piece' && S.t >= CONFIG.T_PIECE) {
      w.phase = 'done'; S.t = 0;
    }
  }
  else if (S.mode === 'correct') {
    if (S.t >= CONFIG.T_CORRECT) nextQuestion();
  }
  else if (S.mode === 'teach') {
    const T = S.teach;
    if (T.phase !== 'in') T.lay = 1;
    else T.lay = Math.min(1, S.t / CONFIG.T_TEACH_ROT);
    
    if (T.phase === 'in') {
      if (S.t >= CONFIG.T_TEACH_ROT) { T.phase = 'step'; S.t = 0; T.tStep = 0; }
    } else if (T.phase === 'step' || T.phase === 'wait') {
      T.tStep += dt;
    }
  }
}

function teachLay(){ return S.teach ? ease(Math.min(1, S.teach.lay)) : 0; }
function ease(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

function drawTopHint(){
  if (S.hintT <= 0 || S.mode !== 'play') return;
  const f = figArea();
  const cx = W/2, cy = f.y + f.h/2;
  const p = 1 - S.hintT;                 
  const k = Math.min(1, p / 0.55);       
  const fade = p < 0.75 ? 1 : Math.max(0, 1 - (p - 0.75) / 0.25);
  const rx = 128, ry = 104;
  const a0 = Math.PI * 0.42, a1 = -Math.PI * 0.5;   
  const a = a0 + (a1 - a0) * ease(k);

  ctx.save();
  ctx.globalAlpha = fade;
  
  ctx.strokeStyle = CONFIG.C_INK_SOFT; ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, a0, a, true);
  ctx.stroke();
  ctx.setLineDash([]);

  const ex = cx + Math.cos(a) * rx, ey = cy + Math.sin(a) * ry;
  
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(a + Math.PI/2);
  ctx.beginPath();
  ctx.moveTo(-15, 0); ctx.quadraticCurveTo(0, -10, 15, 0);
  ctx.quadraticCurveTo(0, 10, -15, 0);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();

  ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, Math.PI*2);
  ctx.fillStyle = CONFIG.C_INK; ctx.fill();
  ctx.restore();

  
  if (k >= 1) {
    const q = Math.min(1, (p - 0.55) / 0.2);
    ctx.save();
    ctx.globalAlpha = fade * (0.25 + 0.75 * q);
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const dx of [-30, 0, 30]) {
      const y0 = ey + 16, y1 = y0 + 26 * q;
      ctx.beginPath(); ctx.moveTo(cx + dx, y0); ctx.lineTo(cx + dx, y1); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + dx - 6, y1 - 7); ctx.lineTo(cx + dx, y1); ctx.lineTo(cx + dx + 6, y1 - 7);
      ctx.stroke();

}

function choiceCols(n){
  if (n <= 2) return 2;
  if (n === 3) return 3;
  if (n === 4) return 2;
  return 3;
}
function choiceRect(i, n){
  n = n || (S.choices ? S.choices.length : 6);
  const cols = choiceCols(n), rows = Math.ceil(n / cols);
  const span = CH_W * 3 + CH_GX * 2;                 
  const w = (span - CH_GX * (cols - 1)) / cols;
  const h = (rows === 1) ? CH_BLOCK : CH_H;
  const c = i % cols, r = Math.floor(i / cols);
  return { x: CH_X0 + c * (w + CH_GX), y: CH_Y0 + r * (CH_H + CH_GY), w, h };
}

function choiceVal(c){ return (c !== null && typeof c === 'object') ? c.v : c; }

function txtChoices(correct, wrongs){
  const out = [{ v: correct, txt: correct }];
  for (const w of wrongs) if (!out.some(o => o.v === w)) out.push({ v: w, txt: w });
  return shuffleArr(out);
}


function fitText(str, q, ink){
  const padW = q.w - 14, maxSize = (q.h >= CH_BLOCK) ? 30 : 24;
  let size = maxSize;
  while (size > 11 && textWidth(str, size, '700') > padW) size -= 1;
  if (textWidth(str, size, '700') <= padW) { text(str, q.x + q.w/2, q.y + q.h/2 + 1, size, ink); return; }
  
  const sp = str.lastIndexOf(' ', Math.ceil(str.length / 2) + 2);
  const cut = (sp > 0) ? sp : Math.ceil(str.length / 2);
  const a = str.slice(0, cut).trim(), b = str.slice(sp > 0 ? sp + 1 : cut).trim();
  size = maxSize;
  while (size > 10 && Math.max(textWidth(a, size, '700'), textWidth(b, size, '700')) > padW) size -= 1;
  const lh = size * 1.15;
  text(a, q.x + q.w/2, q.y + q.h/2 - lh/2 + 1, size, ink);
  text(b, q.x + q.w/2, q.y + q.h/2 + lh/2 + 1, size, ink);
}
function drawChoices(){
  const active = (S.mode === 'play');
  
  const top = CH_Y0 - 16;
  const g = ctx.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, '#2a2140'); g.addColorStop(1, '#151024');
  ctx.fillStyle = g; ctx.fillRect(0, top, W, H - top);
  ctx.fillStyle = 'rgba(179,155,255,0.35)'; ctx.fillRect(0, top, W, 1.5);

  for (let i = 0; i < S.choices.length; i++) {
    const q = choiceRect(i), c = S.choices[i], v = choiceVal(c);
    const picked = (S.picked === i);
    const isAns = (v === S.answer);
    
    let line = '#b39bff', lw = 1.6, ink = '#fff2cc', glow = 'rgba(179,155,255,0.35)';
    if (!active) {
      if (picked && isAns) { line = '#7fe3a1'; lw = 3; ink = '#bfffd4'; glow = 'rgba(127,227,161,0.6)'; }
      else if (picked)     { line = '#ff8a7a'; lw = 3; ink = '#ffc9c0'; glow = 'rgba(255,138,122,0.6)'; }
      else if (isAns && S.mode === 'teach') { line = '#7fe3a1'; lw = 3; ink = '#bfffd4'; }
    }
    ctx.save();
    ctx.globalAlpha = active ? 1 : (picked || (isAns && S.mode === 'teach') ? 1 : 0.35);
    if (picked && !active) {
      const p = 1 + 0.06 * Math.max(0, 1 - S.t / 0.3);
      ctx.translate(q.x + q.w/2, q.y + q.h/2); ctx.scale(p, p);
      ctx.translate(-(q.x + q.w/2), -(q.y + q.h/2));
    }
    
    ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = 10;
    rrect(q.x, q.y, q.w, q.h, 10);
    const cg = ctx.createLinearGradient(0, q.y, 0, q.y + q.h);
    cg.addColorStop(0, '#3d3158'); cg.addColorStop(1, '#241c38');
    ctx.fillStyle = cg; ctx.fill(); ctx.restore();
    rrect(q.x, q.y, q.w, q.h, 10);
    ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke();
    
    rrect(q.x + 3, q.y + 3, q.w - 6, q.h - 6, 7);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1; ctx.stroke();
    
    ctx.save(); ctx.shadowColor = 'rgba(255,214,120,0.45)'; ctx.shadowBlur = 6;
    if (c !== null && typeof c === 'object' && c.draw) {
      c.draw(q, ink);
    } else {
      const s = (c !== null && typeof c === 'object' && c.txt != null) ? String(c.txt) : String(v);
      
      fitText(s, q, ink);
    }
    ctx.restore();
    ctx.restore();
  }
}

function drawFloorPlate(B, fit){
  const n = S.g.length;
  let iMin = n, iMax = 0, jMin = n, jMax = 0, any = false;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (S.g[i][j] > 0) {
      any = true;
      if (i < iMin) iMin = i; if (i + 1 > iMax) iMax = i + 1;
      if (j < jMin) jMin = j; if (j + 1 > jMax) jMax = j + 1;
    }
  }
  if (!any) return;
  const m = 0.7;
  const P = (x, z) => {
    const q = proj(B, x, 0, z);
    return [ q[0]*fit.S + fit.ox, q[1]*fit.S + fit.oy ];
  };
  const quad = [ P(iMin-m, jMin-m), P(iMax+m, jMin-m), P(iMax+m, jMax+m), P(iMin-m, jMax+m) ];
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 2.4);
  ctx.save();
  poly(quad, 'rgba(120,96,196,0.13)', null);
  ctx.globalAlpha = 0.35 + 0.4 * pulse;
  poly(quad, null, '#8c7ad6', 2.4);
  ctx.restore();
}

function drawFigure(){
  const stQ = stageById(S.stage);
  if (stQ.drawQ) { stQ.drawQ(figArea()); return; }
  const B = playBasis();                 
  if (!S.fit) S.fit = fitFor(S.g, B, figAreaFor(S.kind));
  let fit = S.fit;
  if (S.mode === 'teach') {
    const t = teachLay();
    const f1 = fitFor(S.g, B, teachAreas().left);
    fit = { S:  S.fit.S  + (f1.S  - S.fit.S)  * t,
            ox: S.fit.ox + (f1.ox - S.fit.ox) * t,
            oy: S.fit.oy + (f1.oy - S.fit.oy) * t };
  }

  ctx.save();
  if (S.shakeT > 0) {
    const k = S.shakeT * 14;
    ctx.translate(Math.sin(S.shakeT * 60) * k, 0);
  }
  if (S.mode === 'correct') {
    const p = 1 + 0.06 * Math.sin(Math.min(1, S.t / CONFIG.T_CORRECT) * Math.PI);
    ctx.translate(W/2, figArea().y + figArea().h/2);
    ctx.scale(p, p);
    ctx.translate(-W/2, -(figArea().y + figArea().h/2));
  }

  const marks = [];
  let hi = null;
  if (S.mode === 'play') {
    for (const key in S.assistOn) {
      const [i, j] = key.split(',').map(Number);
      marks.push({ i, j, color: CONFIG.C_INK });
    }
  } else if (S.mode === 'teach') {
    const T = S.teach;
    
    if (T.phase === 'step' && T.shown > 0 && T.shown <= T.cols.length) hi = T.cols[T.shown - 1];
  }
  
  if (S.kind === 'cols' && (S.mode === 'play' || S.mode === 'wrong' || S.mode === 'correct')) {
    drawFloorPlate(B, fit);
  }
  drawShape(S.g, B, fit, { marks, hi });

  
  if (S.mode === 'teach' && hi && S.teach.hiddenAt) {
    const ys = S.teach.hiddenAt[hi.i + ',' + hi.j];
    if (ys && ys.length) {
      const blink = 0.45 + 0.4 * Math.abs(Math.sin(S.t * 6.5));
      ctx.save();
      for (const y of ys) {
        const f = cubeFaces(B, hi.i, y, hi.j, fit.S, fit.ox, fit.oy);
        ctx.globalAlpha = blink * 0.85;
        poly(f.left,  CONFIG.C_HI_L, null);
        poly(f.right, CONFIG.C_HI_R, null);
        poly(f.top,   CONFIG.C_HI_T, null);
        ctx.globalAlpha = blink;
        ctx.setLineDash([4, 3]);
        poly(f.left, null, '#c9632a', 2);
        poly(f.right, null, '#c9632a', 2);
        poly(f.top, null, '#c9632a', 2);
        ctx.setLineDash([]);
      }
      ctx.restore();
    }
  }
  ctx.restore();
}


function drawTopView(area, alpha){
  const g = S.g, n = g.length, T = S.teach;
  let iMin = n, iMax = 0, jMin = n, jMax = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (g[i][j] > 0) {
    if (i < iMin) iMin = i; if (i > iMax) iMax = i;
    if (j < jMin) jMin = j; if (j > jMax) jMax = j;
  }
  const cols = iMax - iMin + 1, rows = jMax - jMin + 1;
  const cs = Math.min(area.w * 0.92 / cols, area.h * 0.92 / rows, 50);
  const ox = area.x + area.w/2 - cols * cs / 2;
  const oy = area.y + area.h/2 - rows * cs / 2;

  const hi = (T.phase === 'step' && T.shown > 0 && T.shown <= T.cols.length) ? T.cols[T.shown - 1] : null;
  const shownSet = {};
  for (let k = 0; k < Math.min(T.shown, T.cols.length); k++) shownSet[T.cols[k].i + ',' + T.cols[k].j] = k;

  ctx.save();
  ctx.globalAlpha = alpha;
  for (let j = jMin; j <= jMax; j++) for (let i = iMin; i <= iMax; i++) {
    const x = ox + (i - iMin) * cs, y = oy + (j - jMin) * cs;
    const filled = g[i][j] > 0;
    const lit = hi && hi.i === i && hi.j === j;
    ctx.beginPath(); ctx.rect(x, y, cs, cs);
    ctx.fillStyle = filled ? (lit ? CONFIG.C_HI_T : '#ffffff') : 'rgba(0,0,0,0.035)';
    ctx.fill();
    ctx.strokeStyle = filled ? CONFIG.C_EDGE : CONFIG.C_GRID;
    ctx.lineWidth = filled ? 1.7 : 1;
    ctx.stroke();
    if (filled) {
      const key = i + ',' + j;
      if (key in shownSet) {
        const k = shownSet[key];
        const age = (T.shown - k - 1) * CONFIG.T_TEACH_STEP + Math.min(T.tStep, CONFIG.T_TEACH_STEP);
        const pop = Math.min(1, Math.max(0, age) / 0.16);
        const v = T.val(i, j);
        ctx.save();
        ctx.translate(x + cs/2, y + cs/2 + 1);
        ctx.scale(0.5 + 0.5 * pop, 0.5 + 0.5 * pop);
        
        text(String(v), 0, 0, Math.round(cs * 0.56), v === 0 ? CONFIG.C_INK_SOFT : CONFIG.C_INK);
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

function drawEnemy(fallen){
  const e = S.enemy;
  if (!e) return;
  const a = AREA.enemy;
  
  const art = { x: W/2 - 170, y: a.y + 2, w: 340, h: a.h - 44 };

  ctx.save();
  
  if (e.introT < 1) {
    const p = ease(e.introT);
    ctx.globalAlpha = Math.min(1, e.introT * 2.2);
    ctx.translate(0, -(1 - p) * 150);
    const sq = 1 + 0.22 * Math.sin(Math.min(1, Math.max(0, (e.introT - 0.7) / 0.3)) * Math.PI);
    ctx.translate(W/2, art.y + art.h); ctx.scale(1 / sq, sq); ctx.translate(-W/2, -(art.y + art.h));
  }
  if (e.hurtT > 0) {
    ctx.translate(0, Math.sin((0.4 - e.hurtT) / 0.4 * Math.PI) * 9);
  }
  
  if (e.knockT > 0 && !fallen) {
    const k = e.knockT;
    ctx.translate(0, -k * 18 * Math.sin(k * Math.PI));
    ctx.translate(W/2, art.y + art.h/2);
    ctx.rotate(-k * 0.10 * Math.sin(k * Math.PI * 1.6));
    ctx.scale(1 + k * 0.06, 1 - k * 0.05);
    ctx.translate(-W/2, -(art.y + art.h/2));
  }
  if (fallen) {
    const t = Math.min(1, e.fallT / 1.2);
    ctx.globalAlpha = 1 - t;
    ctx.translate(0, t * t * 80);
    ctx.rotate(t * 0.22);
    ctx.scale(1, 1 - t * 0.35);
    ctx.translate(0, t * 40);
  }
  drawEnemyArt(art, e.art, S.t + (save.played || 0), fallen ? 0 : e.whiteT);
  ctx.restore();

  
  if (S.slashT > 0) {
    const p = 1 - S.slashT;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < S.slashN; i++) {
      const off = (i - (S.slashN - 1) / 2) * 30;
      const k = Math.max(0, Math.min(1, (p - i * 0.10) * 2.2));
      if (k <= 0) continue;
      ctx.globalAlpha = Math.max(0, (1 - k)) * 0.95;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8 * (1 - k * 0.6);
      ctx.lineCap = 'round';
      const cx = W/2 + off, cy = a.y + 66;
      const len = 130 * (0.5 + k);
      ctx.beginPath();
      ctx.moveTo(cx - len/2, cy + len/2 * 0.55);
      ctx.lineTo(cx + len/2, cy - len/2 * 0.55);
      ctx.stroke();
    }
    ctx.restore();
  }

  
  for (const p of S.shards) {
    const k = p.t / p.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.translate(p.x, p.y); ctx.rotate(p.a);
    rrect(-p.s/2, -p.s/2, p.s, p.s, 1.5);
    ctx.fillStyle = CONFIG.C_ENEMY_T; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  if (fallen) return;
  
  drawHpBar(W/2 - 108, a.y + a.h - 24, 216, 9);

  
  if (S.combo >= 2) {
    const pop = 1 + 0.5 * S.comboPop;
    ctx.save();
    
    ctx.translate(W - 58, a.y + 20);
    ctx.scale(pop, pop);
    ctx.font = '800 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(30,16,50,0.9)'; ctx.lineWidth = 4; ctx.strokeText(S.combo + '連続正解！', 0, 0);
    ctx.fillStyle = CONFIG.C_GOLD; ctx.fillText(S.combo + '連続正解！', 0, 0);
    ctx.restore();
  }
  
  if ((S.slashN || 1) >= 3 && S.comboPop > 0 && (S.mode === 'correct')) {
    const q = S.comboPop, sc = 1.6 - 0.5 * q;
    ctx.save();
    ctx.globalAlpha = Math.min(1, q * 2);
    ctx.translate(W/2, a.y + a.h * 0.42); ctx.rotate(-0.14); ctx.scale(sc, sc);
    ctx.font = '800 30px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(255,170,60,0.9)'; ctx.shadowBlur = 18;
    ctx.strokeStyle = '#3a1608'; ctx.lineWidth = 6; ctx.strokeText('クリティカル！', 0, 0);   
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd162'; ctx.fillText('クリティカル！', 0, 0);
    ctx.restore();
  }
}


function drawImpact(){
  if (S.impact <= 0) return;
  const p = 1 - S.impact;             
  let col = null, al = 0;
  if (p < 0.22) { col = '0,0,0'; al = (p / 0.22) * 0.42; }          
  else if (p < 0.34) { col = '255,255,255'; al = 0.34; }            
  else { col = '255,255,255'; al = 0.34 * (1 - (p - 0.34) / 0.66); }
  ctx.fillStyle = 'rgba(' + col + ',' + Math.max(0, al).toFixed(3) + ')';

function drawHpBar(x, y, w, h){
  const e = S.enemy, n = CONFIG.QUESTIONS_PER_SET;
  rrect(x, y, w, h, h/2);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  const p = Math.max(0, Math.min(1, e.hpShown / n));
  if (p > 0.001) {
    ctx.save();
    rrect(x, y, w, h, h/2); ctx.clip();
    
    const col = p > 0.6 ? '#5ed07a' : (p > 0.3 ? '#e0c04a' : '#e05a4a');
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.22, col); g.addColorStop(1, col);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w * p, h);
    ctx.restore();
    
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(x + w * p, y + h/2, h * 0.62, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
  }
  if (S.hpFlash > 0) {
    ctx.save();
    rrect(x, y, w, h, h/2); ctx.clip();
    ctx.globalAlpha = S.hpFlash * 0.8;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
    ctx.restore();
  }
  rrect(x, y, w, h, h/2);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1.6; ctx.stroke();
  
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  for (let i = 1; i < n; i++) {
    const gx = x + w * i / n;
    ctx.beginPath(); ctx.moveTo(gx, y + 2); ctx.lineTo(gx, y + h - 2); ctx.stroke();
  }
  ctx.restore();
}

function breathLeaf(x, y, sz, rot, col, al){

  ctx.quadraticCurveTo(-sz * 0.82, 0, 0, -sz);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = 'rgba(28,66,36,0.55)'; ctx.lineWidth = 1; ctx.stroke();

function jag(p0, p1, seg, amp){
  const pts = [p0];
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
  const nx = -dy, ny = dx, nl = Math.hypot(nx, ny) || 1;
  for (let k = 1; k < seg; k++) {
    const t = k / seg;
    const w = (Math.random() * 2 - 1) * amp * Math.sin(t * Math.PI);   
    pts.push([p0[0] + dx * t + (nx / nl) * w, p0[1] + dy * t + (ny / nl) * w]);
  }
  pts.push(p1);
  return pts;
}
function drawBreath(){
  const b = S.breathT, fx = S.breathFx;
  if (b <= 0 || !fx) return;
  const a = AREA.enemy;
  const d = DRAGONS[S.boss ? S.boss.gi : 0];
  const ty = a.y + a.h * 0.44;
  const p = 1 - b;                                  
  ctx.save();
  ctx.beginPath(); ctx.rect(a.x, a.y, a.w, a.h); ctx.clip();
  
  const pw = fx.tier || 0;
  ctx.save();
  if (pw > 0) { const sc = 1 + 0.1 * pw; ctx.translate(W / 2, ty); ctx.scale(sc, sc); ctx.translate(-W / 2, -ty); }

  if (fx.kind === 'thunder' || fx.kind === 'beam') {
    const col = (fx.kind === 'thunder') ? '#8fd4ff' : (d.c2 || '#cfd6ff');
    
    if (b > 0.55) {
      ctx.save();
      ctx.globalAlpha = (b - 0.55) / 0.45 * 0.22;
      ctx.fillStyle = col; ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const bo of fx.bolts) {
      const q = Math.max(0, Math.min(1, (p - bo.delay) * 4.6));
      if (q <= 0) continue;
      let al = Math.min(1, b * 2.4);
      if (bo.fade) al *= 0.85;
      const n = bo.pts.length;
      const upto = Math.max(1, Math.round(q * (n - 1)));
      
      const layers = [
        [col, 26 * bo.w, 0.30],
        [col, 12 * bo.w, 0.75],
        ['#ffffff', 4.6 * bo.w, 1.0],
      ];
      for (const [c, lw, la] of layers) {
        ctx.beginPath();
        ctx.moveTo(bo.pts[0][0], bo.pts[0][1]);
        for (let k = 1; k <= upto; k++) ctx.lineTo(bo.pts[k][0], bo.pts[k][1]);
        ctx.globalAlpha = al * la;
        ctx.strokeStyle = c; ctx.lineWidth = Math.max(1, lw);
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.stroke();
      }
      if (q >= 1 && !bo.fade) {
        const rr = 18 + 56 * (1 - b);
        ctx.globalAlpha = al * 0.95;
        const rg = ctx.createRadialGradient(bo.tx, bo.ty, 2, bo.tx, bo.ty, rr);
        rg.addColorStop(0, 'rgba(255,255,255,0.98)');
        rg.addColorStop(0.4, col);
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(bo.tx, bo.ty, rr, 0, Math.PI * 2); ctx.fill();
        
        ctx.globalAlpha = al * 0.8;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let k = 0; k < 8; k++) {
          const an = k * Math.PI / 4 + 0.3;
          const r0 = 14 + 20 * (1 - b), r1 = r0 + 16;
          ctx.beginPath();
          ctx.moveTo(bo.tx + Math.cos(an) * r0, bo.ty + Math.sin(an) * r0);
          ctx.lineTo(bo.tx + Math.cos(an) * r1, bo.ty + Math.sin(an) * r1);
          ctx.stroke();
        }
      }
    }
  } else if (fx.kind === 'flame') {
    
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      const sp = 1 + k * 0.22;
      const q = Math.min(1.25, p * 2.0 * sp);
      const cx = a.x - 60 + (a.w + 140) * q;
      const hh = a.h * (0.30 - k * 0.05);
      const cy = ty + (k - 1) * 12;
      const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 110);
      g.addColorStop(0, 'rgba(255,250,220,' + (0.85 * b).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(255,170,50,' + (0.65 * b).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(200,40,10,0)');
      ctx.fillStyle = g;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(1.9, hh / 70); ctx.translate(-cx, -cy);
      ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 0.55 * b;
      const lg = ctx.createLinearGradient(a.x, 0, cx, 0);
      lg.addColorStop(0, 'rgba(255,120,20,0)');
      lg.addColorStop(1, 'rgba(255,210,120,0.8)');
      ctx.strokeStyle = lg; ctx.lineWidth = hh * 0.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, cy); ctx.lineTo(cx, cy); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else if (fx.kind === 'ice') {
    
    const mx = (fx.mx != null) ? fx.mx : a.x - 34, my = (fx.my != null) ? fx.my : a.y + a.h * 0.16;
    const dx = W / 2 - mx, dy = ty - my, dl = Math.hypot(dx, dy) || 1;
    const ux = dx / dl, uy = dy / dl, px = -uy, py = ux;          
    const q = Math.min(1, p * 2.1);
    const halfW = (t) => 7 + 46 * t;                              
    ctx.globalCompositeOperation = 'lighter';
    
    const steps = 16;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = q * i / steps, hw = halfW(t);
      const cx2 = mx + dx * t, cy2 = my + dy * t;
      const pt = [cx2 + px * hw, cy2 + py * hw];
      if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
    }
    for (let i = steps; i >= 0; i--) {
      const t = q * i / steps, hw = halfW(t);
      const cx2 = mx + dx * t, cy2 = my + dy * t;
      ctx.lineTo(cx2 - px * hw, cy2 - py * hw);
    }
    ctx.closePath();
    const lg = ctx.createLinearGradient(mx, my, W / 2, ty);
    lg.addColorStop(0, 'rgba(226,248,255,' + (0.66 * b).toFixed(3) + ')');
    lg.addColorStop(0.55, 'rgba(150,215,255,' + (0.46 * b).toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(120,190,255,0)');
    ctx.fillStyle = lg; ctx.fill();
    
    (fx.shards || []).forEach(sh => {
      const t = Math.max(0, Math.min(1.05, (p - sh.d) * sh.sp * 2.6));
      if (t <= 0) return;
      const hw = halfW(Math.min(1, t)) * 0.82;
      const cx2 = mx + dx * t + px * sh.off * hw;
      const cy2 = my + dy * t + py * sh.off * hw;
      ctx.globalAlpha = Math.min(1, b * 2.2) * (t > 1 ? 0.3 : 0.95);
      ctx.save();
      ctx.translate(cx2, cy2); ctx.rotate(Math.atan2(uy, ux));
      
      ctx.beginPath();
      ctx.moveTo(sh.len * 0.62, 0);
      ctx.lineTo(sh.len * 0.10, -sh.w);
      ctx.lineTo(-sh.len * 0.38, 0);
      ctx.lineTo(sh.len * 0.10, sh.w);
      ctx.closePath();
      ctx.fillStyle = 'rgba(224,246,255,0.92)'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sh.len * 0.6, 0); ctx.lineTo(-sh.len * 0.36, 0);
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    
    if (p > 0.42) {
      const g2 = Math.min(1, (p - 0.42) / 0.3);
      const al = Math.min(1, b * 2.2);
      ctx.globalAlpha = al;
      ctx.strokeStyle = '#e8f8ff'; ctx.lineCap = 'round';
      (fx.crys || []).forEach(cr => {
        const L = cr.len * g2;
        const ex = W / 2 + Math.cos(cr.a) * L, ey = ty + Math.sin(cr.a) * L;
        ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(W / 2, ty); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.lineWidth = 2;
        [0.45, 0.75].forEach(f => {
          const bx = W / 2 + Math.cos(cr.a) * L * f, by = ty + Math.sin(cr.a) * L * f;
          [-0.7, 0.7].forEach(o => {
            ctx.beginPath(); ctx.moveTo(bx, by);
            ctx.lineTo(bx + Math.cos(cr.a + o) * L * 0.3, by + Math.sin(cr.a + o) * L * 0.3);
            ctx.stroke();
          });
        });
      });
      const rr = 12 + 44 * g2;
      const rg = ctx.createRadialGradient(W / 2, ty, 2, W / 2, ty, rr);
      rg.addColorStop(0, 'rgba(255,255,255,' + (0.95 * b).toFixed(3) + ')');
      rg.addColorStop(0.45, 'rgba(165,225,255,' + (0.55 * b).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(165,225,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(W / 2, ty, rr, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.16 * b;
    ctx.fillStyle = '#9fd8ff'; ctx.fillRect(a.x, a.y, a.w, a.h);
    ctx.globalAlpha = 1;
  } else if (fx.kind === 'forest') {
    
    const al = Math.min(1, b * 2.2);
    (fx.vines || []).forEach(v => {
      const t = Math.max(0, Math.min(1, (p - v.delay) * 2.8));
      if (t <= 0) return;
      
      const P0 = v.p0, C = v.c, P1 = [W / 2, ty];
      const lerp = (A, B, k) => [A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k];
      const A1 = lerp(P0, C, t), B1 = lerp(C, P1, t), E = lerp(A1, B1, t);
      ctx.globalAlpha = al;
      [[ 'rgba(38,84,46,0.95)', v.w + 2.4 ], [ 'rgba(84,150,88,0.95)', v.w ],
       [ 'rgba(178,222,160,0.9)', v.w * 0.34 ]].forEach(([c, lw]) => {
        ctx.beginPath(); ctx.moveTo(P0[0], P0[1]);
        ctx.quadraticCurveTo(A1[0], A1[1], E[0], E[1]);
        ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
      });
      
      for (let k = 1; k <= 6; k++) {
        const kk = k / 7;
        if (kk > t) break;
        const a2 = lerp(P0, C, kk * t), b2 = lerp(C, P1, kk * t), e2 = lerp(a2, b2, kk * t);
        breathLeaf(e2[0], e2[1], 6.5, kk * 5 + v.delay * 9, '#5aa860', al * 0.95);
      }
    });
    (fx.leaves || []).forEach(lf => {
      const t = Math.max(0, Math.min(1, (p - lf.d) * lf.sp * 2.2));
      if (t <= 0) return;
      const ang = lf.a0 + t * 3.4;
      const r = lf.r * (1 - t);
      breathLeaf(W / 2 + Math.cos(ang) * r, ty + Math.sin(ang) * r, lf.sz,
        lf.rot + t * 7, (lf.sz > 9) ? '#8fd07a' : '#63b566', al * (t > 0.96 ? 0.25 : 1));
    });
    if (p > 0.5) {
      const g2 = Math.min(1, (p - 0.5) / 0.35);
      ctx.globalCompositeOperation = 'lighter';
      const rr = 16 + 52 * g2;
      const rg = ctx.createRadialGradient(W / 2, ty, 2, W / 2, ty, rr);
      rg.addColorStop(0, 'rgba(226,255,206,' + (0.85 * b).toFixed(3) + ')');
      rg.addColorStop(0.5, 'rgba(110,200,110,' + (0.45 * b).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(110,200,110,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(W / 2, ty, rr, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
  } else if (fx.kind === 'shine') {
    
    const al = Math.min(1, b * 2.2);
    const grow = Math.min(1, p * 3.4);
    const colW = (16 + 64 * grow) * (0.5 + 0.5 * b);
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(W / 2 - colW, 0, W / 2 + colW, 0);
    lg.addColorStop(0, 'rgba(255,240,190,0)');
    lg.addColorStop(0.5, 'rgba(255,252,232,' + (0.78 * b).toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(W / 2 - colW, a.y, colW * 2, (ty - a.y) + 34 * grow);
    
    ctx.globalAlpha = al;
    (fx.rays || []).forEach(ry => {
      const L = ry.len * grow;
      const a2 = ry.a + p * 0.5;
      ctx.beginPath();
      ctx.moveTo(W / 2, ty);
      ctx.lineTo(W / 2 + Math.cos(a2 - ry.w) * L, ty + Math.sin(a2 - ry.w) * L);
      ctx.lineTo(W / 2 + Math.cos(a2 + ry.w) * L, ty + Math.sin(a2 + ry.w) * L);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,238,176,0.55)'; ctx.fill();
    });
    
    [0, 0.18, 0.36].forEach(d => {
      const t = (p - d) * 1.9;
      if (t <= 0 || t > 1) return;
      ctx.beginPath(); ctx.ellipse(W / 2, ty, 24 + 120 * t, (24 + 120 * t) * 0.34, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,248,214,' + (0.7 * (1 - t) * b).toFixed(3) + ')';
      ctx.lineWidth = 3.4 * (1 - t) + 1; ctx.stroke();
    });
    
    (fx.stars || []).forEach(st => {
      const t = Math.max(0, Math.min(1, (p - st.d) * 2.4));
      if (t <= 0) return;
      const x = W / 2 + Math.cos(st.a) * st.r * t, y = ty + Math.sin(st.a) * st.r * t;
      const sz = st.sz * (1 - t * 0.5);
      ctx.globalAlpha = al * (1 - t) * 0.95;
      ctx.strokeStyle = '#fffbe8'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - sz, y); ctx.lineTo(x + sz, y);
      ctx.moveTo(x, y - sz); ctx.lineTo(x, y + sz); ctx.stroke();
    });
    ctx.globalAlpha = al;
    const rr = 14 + 56 * grow;
    const rg = ctx.createRadialGradient(W / 2, ty, 2, W / 2, ty, rr);
    rg.addColorStop(0, 'rgba(255,255,255,0.98)');
    rg.addColorStop(0.42, 'rgba(255,236,168,0.8)');
    rg.addColorStop(1, 'rgba(255,236,168,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(W / 2, ty, rr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (fx.kind === 'dark') {
    
    const gather = Math.min(1, p / 0.5);
    const burst = Math.max(0, (p - 0.5) / 0.5);
    
    ctx.globalAlpha = 0.42 * b * (0.35 + 0.65 * gather);
    ctx.fillStyle = '#140a22'; ctx.fillRect(a.x, a.y, a.w, a.h);
    ctx.globalAlpha = 1;
    if (burst <= 0) {
      (fx.dots || []).forEach(dt2 => {
        const t = Math.max(0, Math.min(1, (gather - dt2.d) * 1.6));
        if (t <= 0) return;
        const r = dt2.r * (1 - t);
        ctx.globalAlpha = 0.85 * b;
        ctx.fillStyle = '#b57ce0';
        ctx.beginPath(); ctx.arc(W / 2 + Math.cos(dt2.a) * r, ty + Math.sin(dt2.a) * r, dt2.sz, 0, Math.PI * 2); ctx.fill();
      });
    }
    const core = burst > 0 ? (30 * (1 - Math.min(1, burst * 3))) : (8 + 26 * gather);
    if (core > 0.5) {
      const rg = ctx.createRadialGradient(W / 2, ty, 1, W / 2, ty, core);
      rg.addColorStop(0, 'rgba(10,4,18,0.98)');
      rg.addColorStop(0.72, 'rgba(60,20,92,0.9)');
      rg.addColorStop(1, 'rgba(160,100,220,0)');
      ctx.globalAlpha = b;
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(W / 2, ty, core, 0, Math.PI * 2); ctx.fill();
    }
    if (burst > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const al = Math.min(1, b * 2.4);
      (fx.arms || []).forEach(ar => {
        const t = Math.min(1, burst * 1.6);
        const L = ar.len * t;
        const ex = W / 2 + Math.cos(ar.a) * L, ey = ty + Math.sin(ar.a) * L;
        const mxp = W / 2 + Math.cos(ar.a) * L * 0.55 - Math.sin(ar.a) * ar.bend * L * 0.35;
        const myp = ty + Math.sin(ar.a) * L * 0.55 + Math.cos(ar.a) * ar.bend * L * 0.35;
        ctx.globalAlpha = al * (1 - t * 0.35);
        [[ '#7a3fb5', ar.w + 3 ], [ '#c79bf0', ar.w ]].forEach(([c, lw]) => {
          ctx.beginPath(); ctx.moveTo(W / 2, ty);
          ctx.quadraticCurveTo(mxp, myp, ex, ey);
          ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
        });
      });
      const t2 = Math.min(1, burst * 1.35);
      ctx.globalAlpha = al * (1 - t2);
      ctx.strokeStyle = '#d7b3ff'; ctx.lineWidth = 5 * (1 - t2) + 1.5;
      ctx.beginPath(); ctx.arc(W / 2, ty, 16 + 120 * t2, 0, Math.PI * 2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();                                   
  drawBreathPower(fx, a, ty, p, b);
  ctx.restore();
  if (b > 0.88) {
    ctx.save();
    ctx.globalAlpha = (b - 0.88) / 0.12 * 0.14;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(a.x, a.y, a.w, a.h);
    ctx.restore();
  }
}

function drawBreathPower(fx, a, ty, p, b){
  const pw = fx.tier || 0;
  if (pw <= 0) return;
  const col = ELEM_COL[fx.kind] || '#ffffff';
  const cx = W / 2;
  ctx.save();
  if (pw >= 3 && b > 0.6) {
    ctx.globalAlpha = (b - 0.6) / 0.4 * (0.12 + 0.05 * pw);
    ctx.fillStyle = col; ctx.fillRect(a.x, a.y, a.w, a.h);
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'lighter';
  if (pw >= 2) {
    const n = 6 + pw * 3, rot = p * 0.6;
    const len = (60 + pw * 26) * Math.min(1, p * 3);
    ctx.globalAlpha = Math.min(1, b * 1.6) * 0.55;
    ctx.strokeStyle = col; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const ang = rot + i * Math.PI * 2 / n;
      const l = len * (i % 2 ? 0.62 : 1);
      ctx.lineWidth = (i % 2 ? 2 : 3.5);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * 18, ty + Math.sin(ang) * 18);
      ctx.lineTo(cx + Math.cos(ang) * l, ty + Math.sin(ang) * l);
      ctx.stroke();
    }
  }
  const rings = Math.min(3, pw);
  for (let i = 0; i < rings; i++) {
    const q = Math.max(0, Math.min(1, (p - i * 0.1) * 1.8));
    if (q <= 0 || q >= 1) continue;
    ctx.globalAlpha = (1 - q) * 0.9;
    ctx.strokeStyle = col; ctx.lineWidth = 3 + pw;
    ctx.beginPath(); ctx.arc(cx, ty, 20 + q * (70 + pw * 22), 0, Math.PI * 2); ctx.stroke();
  }
  if (pw >= 4) {
    const q = Math.min(1, p * 2.5);
    const r = 18 + 30 * q;
    const g = ctx.createRadialGradient(cx, ty, 0, cx, ty, r * 2);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.55 * (1 - q * 0.6)) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = Math.min(1, b * 1.8);
    ctx.fillStyle = g; ctx.fillRect(cx - r * 2, ty - r * 2, r * 4, r * 4);
  }
  if (pw >= 5) {
    const q = Math.max(0, Math.min(1, (p - 0.15) * 1.6));
    if (q > 0 && q < 1) {
      ctx.globalAlpha = (1 - q);
      ctx.strokeStyle = '#ffd162'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx, ty, 30 + q * 150, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawDmgPops(){

function drawRichLine(segs, cx, y, fs, col){
  const total = segs.reduce((a, g) => a + textWidth(g.t, fs, g.b ? '900' : '700'), 0);
  let x = cx - total / 2;
  segs.forEach(g => {
    if (g.t) text(g.t, x, y, fs, g.b ? CONFIG.C_GOLD : col, 'left', g.b ? '900' : '700');
    x += textWidth(g.t, fs, g.b ? '900' : '700');
  });
}


const NO_HEAD = /^[、。，．！？）」』】〉・ー…]/;
function richAtoms(line){
  const out = [];
  String(line).split('**').forEach((part, i) => {
    const b = (i % 2) === 1;
    
    part.split(/(\s+)/).forEach(t => { if (!t) return;
      (/^\s+$/.test(t) ? [t] : t.split(/(?<=[、。])/)).forEach(u => { if (u) out.push({ t: u, b, nb: NO_HEAD.test(u) }); });
    });
  });
  return out;
}

function wrapRich(atoms, maxW, fs){
  const lines = []; let cur = [], w = 0;
  
  const q = atoms.slice();
  while (q.length) {
    const a = q.shift();
    const aw = textWidth(a.t, fs, a.b ? '900' : '700');
    if (w + aw > maxW && a.t.length > 1 && !/^\s+$/.test(a.t) && aw > maxW * 0.4) {
      let k = 0;
      while (k < a.t.length && w + textWidth(a.t.slice(0, k + 1), fs, a.b ? '900' : '700') <= maxW) k++;
      while (k > 0 && k < a.t.length && NO_HEAD.test(a.t[k])) k--;
      if (k > 0) {
        cur.push({ t: a.t.slice(0, k), b: a.b, nb: a.nb });
        lines.push(cur); cur = []; w = 0;
        q.unshift({ t: a.t.slice(k), b: a.b, nb: NO_HEAD.test(a.t[k]) });
        continue;
      }
    }
    if (w + aw > maxW && cur.length && !a.nb) {
      while (cur.length && /^\s+$/.test(cur[cur.length - 1].t)) cur.pop();
      lines.push(cur); cur = []; w = 0;
      if (/^\s+$/.test(a.t)) continue;
    }
    cur.push(a); w += aw;
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function drawTeachMsg(){
  const T = S.teach, m = teachAreas().msg;
  const msg = T.msgFn ? T.msgFn() : '';
  if (!msg) return;
  const maxW = m.w - 34;
  
  let fs = 17, rows = [];
  for (const size of [17, 15, 13, 12]) {
    fs = size; rows = [];
    msg.split('\n').forEach(ln => { rows = rows.concat(wrapRich(richAtoms(ln), maxW, size)); });
    if (rows.length <= 3) break;
  }
  const lh = Math.round(fs * 1.45);
  const boxH = Math.max(m.h - 8, rows.length * lh + 16);
  const boxY = m.y + m.h - 4 - boxH;
  ctx.save();
  rrect(m.x + 6, boxY, m.w - 12, boxH, 10);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
  ctx.restore();
  const y0 = boxY + boxH/2 - (rows.length - 1) * lh / 2;
  rows.forEach((segs, i) => drawRichLine(segs, W/2, y0 + i * lh, fs, CONFIG.C_INK));
}
function drawTeachOverlay(){

  if (T.phase === 'step') {

    ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
    
    for (let k = 0; k < T.total; k++) {

      ctx.beginPath(); ctx.arc(x, b.y - 8, 2.2, 0, Math.PI*2);
      ctx.fillStyle = k < T.shown ? CONFIG.C_INK : 'rgba(0,0,0,0.15)'; ctx.fill();
    }
  }
  if (T.phase === 'wait') {
    const B2 = teachButtons();
    
    ctx.save();
    ctx.beginPath(); ctx.arc(B2.replay.x, B2.replay.y, B2.replay.r, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.arc(B2.replay.x, B2.replay.y, 8, Math.PI * 0.55, Math.PI * 2.15);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.stroke();
    const ax = B2.replay.x + 8 * Math.cos(Math.PI * 0.55), ay = B2.replay.y + 8 * Math.sin(Math.PI * 0.55);
    ctx.beginPath();
    ctx.moveTo(ax - 4.5, ay - 1.5); ctx.lineTo(ax + 3.5, ay - 3.5); ctx.lineTo(ax + 1.5, ay + 4.5);
    ctx.closePath(); ctx.fillStyle = CONFIG.C_INK; ctx.fill();
    ctx.restore();
    
    const rr = ((S.t * 26) % 40);
    ctx.save(); ctx.globalAlpha = Math.max(0, 0.28 * (1 - rr / 40));
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(B2.next.x, B2.next.y, B2.next.r + rr, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(B2.next.x, B2.next.y, B2.next.r, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 2; ctx.stroke();
    if (S.intro && introNextLabel() === 'おわる') {
      
      ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(B2.next.x - 6, B2.next.y - 6); ctx.lineTo(B2.next.x + 6, B2.next.y + 6);
      ctx.moveTo(B2.next.x + 6, B2.next.y - 6); ctx.lineTo(B2.next.x - 6, B2.next.y + 6);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(B2.next.x - 5, B2.next.y - 8); ctx.lineTo(B2.next.x + 9, B2.next.y); ctx.lineTo(B2.next.x - 5, B2.next.y + 8);

const LOOKS = [

function lookGained(lv0, lv1){ let g = null; for (const L of LOOKS) if (L.lv > lv0 && L.lv <= lv1) g = L; return g; }
function lookCol(gi){ return ELEM_COL[DRAGONS[gi].breath] || '#ffffff'; }
function hexA(hex, al){
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + al + ')';
}

function drawLookBack(box, gi, lv, small){
  if (lv < 6) return;
  
  const col = lookCol(gi), t = S.t;
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  ctx.save();
  if (lv >= 20 && !small) {
    ctx.globalCompositeOperation = 'lighter';
    const n = 12, R = box.h * 0.78;
    for (let i = 0; i < n; i++) {
      const a0 = t * 0.25 + i * Math.PI * 2 / n;
      ctx.globalAlpha = 0.16 + 0.06 * Math.sin(t * 2 + i);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, a0 - 0.07, a0 + 0.07); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  const pl = 0.75 + 0.25 * Math.sin(t * 1.8);
  const g = ctx.createRadialGradient(cx, cy, box.w * 0.3, cx, cy, box.w * (small ? 0.72 : 0.95));
  g.addColorStop(0, hexA(col, (small ? 0.5 : 0.75) * pl)); g.addColorStop(1, hexA(col, 0));   
  ctx.globalAlpha = 1;
  ctx.fillStyle = g; ctx.fillRect(box.x - box.w, box.y - box.h * 0.6, box.w * 3, box.h * 2.2);
  if (lv >= 10 && !small) {
    ctx.strokeStyle = hexA(col, 0.7); ctx.lineWidth = 2;

    ctx.rotate(t * 0.35);
    ctx.setLineDash([10, 6]); ctx.beginPath(); ctx.arc(0, 0, r1, 0, Math.PI * 2); ctx.stroke();
    ctx.rotate(-t * 0.8);
    ctx.setLineDash([3, 7]); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r2, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  ctx.restore();
}


function drawLookFront(box, gi, lv, part){
  if (lv < 3) return;
  const col = lookCol(gi), kind = DRAGONS[gi].breath, t = S.t;
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  ctx.save();
  if (lv >= 15 && part !== 'parts') {
    ctx.shadowColor = col; ctx.shadowBlur = 16 + 6 * Math.sin(t * 2.4);
    rrect(box.x, box.y, box.w, box.h, 10);
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    ctx.shadowBlur = 0;
  }
  if (part === 'frame') { ctx.restore(); return; }
  
  const n = lv >= 20 ? 18 : (lv >= 15 ? 12 : 8);
  ctx.shadowColor = col; ctx.shadowBlur = 10;
  for (let i = 0; i < n; i++) {
    const ph = ((i / n) + t * (0.07 + (i % 3) * 0.02)) % 1;
    const side = (i % 2) ? 1 : -1;
    let x, y, al = Math.sin(ph * Math.PI);
    if (kind === 'flame' || kind === 'ice' || kind === 'forest') {
      const down = (kind !== 'flame');
      x = cx + side * (box.w * 0.46 + 6 + 12 * Math.sin(i * 2.7 + t * 1.5)) + (i % 4 < 2 ? 0 : side * -box.w * 0.3);
      y = box.y - box.h * 0.06 + box.h * 1.12 * (down ? ph : 1 - ph);
    } else {
      const a = ph * Math.PI * 2 + i;
      x = cx + Math.cos(a) * box.w * 0.62; y = cy + Math.sin(a) * box.h * 0.56;
    }
    const sz = 4.5 + (i % 3) * 1.2;
    ctx.globalAlpha = al;
    if (kind === 'ice') {
      ctx.strokeStyle = col; ctx.lineWidth = 2.2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.8 + i);
      for (let k = 0; k < 3; k++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(-sz * 1.5, 0); ctx.lineTo(sz * 1.5, 0); ctx.stroke(); }
      ctx.restore();
    } else if (kind === 'forest') {
      breathLeaf(x, y, sz * 1.4, t * 1.2 + i, col, al);
    } else if (kind === 'thunder') {
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - sz, y - sz * 1.6); ctx.lineTo(x + sz * 0.4, y - sz * 0.2);
      ctx.lineTo(x - sz * 0.4, y + sz * 0.2); ctx.lineTo(x + sz, y + sz * 1.6); ctx.stroke();
    } else if (kind === 'shine') {
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const r = (k % 2) ? sz * 0.45 : sz * 1.8, a = k * Math.PI / 4 + t; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.fillStyle = (kind === 'dark') ? '#3a1f55' : col;
      ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.stroke();
    }
  }
  ctx.restore();
}
