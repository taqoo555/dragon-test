function makeKindBag(){
  const st = stageById(S.stage);
  const kinds = st.kinds || CONFIG.KIND_BAG;
  const base = kinds.slice(0, CONFIG.QUESTIONS_PER_SET);
  while (base.length < CONFIG.QUESTIONS_PER_SET) base.push(kinds[0] || 'all');
  for (let t = 0; t < 40; t++) {
    for (let i = base.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const x = base[i]; base[i] = base[j]; base[j] = x;
    }
    let run = 1, bad = false;
    for (let i = 1; i < base.length; i++) {
      run = (base[i] === base[i-1]) ? run + 1 : 1;
      if (run >= 3) { bad = true; break; }
    }
    if (!bad) break;
  }
  return base;
}

function bossBag(gi){
  const ids = pageStages(gi).filter(st => st.unlocked).map(st => st.id);
  if (!ids.length) return [];
  const bag = [];
  while (bag.length < CONFIG.BOSS_QS) bag.push(ids[bag.length % ids.length]);
  for (let t = 0; t < 60; t++) {
    shuffleArr(bag);
    let run = 1, bad = false;
    for (let i = 1; i < bag.length; i++) { run = (bag[i] === bag[i-1]) ? run + 1 : 1; if (run >= 3) { bad = true; break; } }
    if (!bad) break;
  }
  return bag;
}

function spawnShards(x, y, n, strong){
  for (let i = 0; i < n; i++) {
    const a = (-0.15 - Math.random() * 0.7) * Math.PI;
    const sp = (70 + Math.random() * 160) * (strong ? 1.7 : 1);
    S.shards.push({
      
      x: x + (Math.random() - 0.5) * (strong ? 120 : 78),
      y: y + (Math.random() - 0.5) * 56,
      vx: Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1),
      vy: Math.sin(a) * sp,
      r: (Math.random() < 0.5 ? 1 : -1) * (2 + Math.random() * 5),
      a: Math.random() * 6.28,
      s: (strong ? 7 : 4) + Math.random() * 6,
      t: 0, life: 0.5 + Math.random() * 0.5,
    });
  }
}
function enemyHit(){
  const e = S.enemy;
  if (!e) return;
  e.hp = Math.max(0, e.hp - 1);
  S.hitFx = 1;
  e.knockT = 1;
  e.whiteT = 1;
  S.hpFlash = 1;
  
  S.combo++;
  S.comboPop = 1;
  S.slashN = CONFIG.COMBO_SLASH[Math.min(S.combo - 1, CONFIG.COMBO_SLASH.length - 1)];
  S.slashT = 1;
  
  if (S.boss) {
    const stt = bossState(S.boss.gi);
    const crit = S.slashN >= 3;
    const mult = 1 + 0.15 * Math.max(0, S.combo - 1);
    const dmg = Math.max(1, Math.round(stt.atk * mult * (crit ? 2 : 1)));
    S.boss.dmg += dmg;
    if (crit) S.boss.crits++;
    
    const seq = S.results.filter(Boolean).length;
    S.dmgPops.push({ v: dmg, crit, t: 0,
      x: W/2 + ((seq % 3) - 1) * 62 + (Math.random() * 14 - 7),
      y: AREA.enemy.y + 104 + (seq % 2) * 14 });
    if (S.dmgPops.length > 4) S.dmgPops.shift();
    startBreath();
  }
  
  S.finish = S.boss
    ? (S.results.filter(Boolean).length >= CONFIG.BOSS_MIN_OK)
    : (e.hp === 0);
  S.freeze = S.finish ? CONFIG.FREEZE_FINISH : CONFIG.FREEZE_HIT;
  S.impact = 1;
  const a = AREA.enemy;
  spawnShards(W/2, a.y + 66, S.finish ? CONFIG.SHARDS * 2 : CONFIG.SHARDS, S.finish);
  if (S.finish) sfxDefeat();
}

function submit(idx){
  if (S.mode !== 'play') return;
  
  if (idx == null) idx = S.choices.findIndex(c => choiceVal(c) === S.answer);
  S.picked = idx;
  const v = choiceVal(S.choices[idx]);
  S.input = String(v);
  const ok = (v === S.answer);
  S.results.push(ok);
  if (ok) {
    S.streak++;
    save.totalOk = (save.totalOk || 0) + 1;
    
    if (!S.boss && S.streak >= CONFIG.LV_UP_STREAK && S.lv < CONFIG.LEVELS.length - 1
        && S.lvUps < CONFIG.LV_UP_PER_BATTLE) {
      S.lv++; S.streak = 0; S.lvUps++; setStageLv(S.stage, S.lv);
    }
    putSave();
    
    enemyHit();
    S.mode = 'correct'; S.t = 0; S.flash = 1;
    sfxHit(); setTimeout(() => sfxCorrect(), 90);
  } else {
    S.streak = 0;
    S.missInSet++;
    if (!S.boss && S.missInSet >= CONFIG.LV_DOWN_MISS && S.lv > 0) {
      S.lv--; S.missInSet = 0; setStageLv(S.stage, S.lv);
    }
    putSave();

  if (S.kind === 'hidden') {

      }

function teachStep(){
  const T = S.teach;
  if (!T || T.phase !== 'step') return;
  if (T.shown >= T.total) { T.phase = 'wait'; S.t = 0; return; }
  T.onStep(T.shown);
  T.shown++;
  T.tStep = 0; S.t = 0;
  if (T.shown >= T.total) T.phase = 'wait';
}

function replayTeach(){
  const T = S.teach;
  T.phase = 'step'; T.shown = 0; T.sum = 0; T.tStep = 0; T.lay = 1;

  S.t = 0;
}

function update(dt){
  
  if (S.freeze > 0) { S.freeze = Math.max(0, S.freeze - dt); return; }
  S.t += dt;
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.2);
  if (S.kindPop > 0) S.kindPop = Math.max(0, S.kindPop - dt * 2.0);
  if (S.comboPop > 0) S.comboPop = Math.max(0, S.comboPop - dt * 1.8);
  if (S.slashT > 0) S.slashT = Math.max(0, S.slashT - dt * 3.4);
  if (S.hpFlash > 0) S.hpFlash = Math.max(0, S.hpFlash - dt * 3.0);
  if (motes) for (const m of motes) { m.y += m.sp * dt; if (m.y > 1.05) { m.y = -0.05; m.x = Math.random() * W; } }
  if (S.impact > 0) S.impact = Math.max(0, S.impact - dt / (S.finish ? 0.75 : 0.34));
  if (S.hintT > 0) S.hintT = Math.max(0, S.hintT - dt / 2.0);
  
  for (let i = S.shards.length - 1; i >= 0; i--) {
    const p = S.shards[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 620 * dt;
    p.a += p.r * dt;
    if (p.t >= p.life) S.shards.splice(i, 1);
  }
  
  if (S.breathT > 0) S.breathT = Math.max(0, S.breathT - dt * 1.6);
  if (S.dmgPops) for (let i = S.dmgPops.length - 1; i >= 0; i--) {
    S.dmgPops[i].t += dt;
    if (S.dmgPops[i].t > 1.1) S.dmgPops.splice(i, 1);
  }
  if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
  if (S.hitFx > 0) S.hitFx = Math.max(0, S.hitFx - dt / CONFIG.T_HIT);
  if (S.enemy) {
    if (S.enemy.hurtT > 0) S.enemy.hurtT = Math.max(0, S.enemy.hurtT - dt);
    if (S.enemy.knockT > 0) S.enemy.knockT = Math.max(0, S.enemy.knockT - dt / CONFIG.T_KNOCK);
    if (S.enemy.whiteT > 0) S.enemy.whiteT = Math.max(0, S.enemy.whiteT - dt * 5.5);
    if (S.enemy.introT < 1) S.enemy.introT = Math.min(1, S.enemy.introT + dt / CONFIG.T_INTRO);
    
    const d = S.enemy.hp - S.enemy.hpShown;
    S.enemy.hpShown += d * Math.min(1, dt * 7);
    if (Math.abs(d) < 0.02) S.enemy.hpShown = S.enemy.hp;
    if (S.mode === 'win' && S.win && S.win.phase !== 'fail') S.enemy.fallT += dt;
  }

  if (S.mode === 'win') {
    const w = S.win;
    
    if (w.isBoss) { if (S.breathT > 0) S.breathT = Math.max(0, S.breathT - dt * 1.6); return; }
    updateWinFx(dt);
    if (w.phase === 'defeat' && S.t >= CONFIG.T_DEFEAT) {
      w.phase = 'piece'; S.t = 0; winStartPiece();
      if (w.completed || w.goldNow) setTimeout(() => { if (!muted) sfxDragon(); }, 700);
    } else if (w.phase === 'piece' && S.t >= CONFIG.T_PIECE) {
      w.phase = 'done'; S.t = 0;
    }
  }
  else if (S.mode === 'correct') {
    if (S.t >= CONFIG.T_CORRECT) nextQuestion();
  }
  else if (S.mode === 'teach') {
    const T = S.teach;
    if (T.phase !== 'in') T.lay = 1;
    else T.lay = Math.min(1, S.t / CONFIG.T_TEACH_ROT);
    
    if (T.phase === 'in') {
      if (S.t >= CONFIG.T_TEACH_ROT) { T.phase = 'step'; S.t = 0; T.tStep = 0; }
    } else if (T.phase === 'step' || T.phase === 'wait') {
      T.tStep += dt;
    }
  }
}

function ease(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

function choiceCols(n){
  if (n <= 2) return 2;
  if (n === 3) return 3;
  if (n === 4) return 2;
  return 3;
}
function choiceRect(i, n){
  n = n || (S.choices ? S.choices.length : 6);
  const cols = choiceCols(n), rows = Math.ceil(n / cols);
  const span = CH_W * 3 + CH_GX * 2;                 
  const w = (span - CH_GX * (cols - 1)) / cols;
  const h = (rows === 1) ? CH_BLOCK : CH_H;
  const c = i % cols, r = Math.floor(i / cols);
  return { x: CH_X0 + c * (w + CH_GX), y: CH_Y0 + r * (CH_H + CH_GY), w, h };
}

function choiceVal(c){ return (c !== null && typeof c === 'object') ? c.v : c; }

function txtChoices(correct, wrongs){
  const out = [{ v: correct, txt: correct }];
  for (const w of wrongs) if (!out.some(o => o.v === w)) out.push({ v: w, txt: w });
  return shuffleArr(out);
}


function fitText(str, q, ink){
  const padW = q.w - 14, maxSize = (q.h >= CH_BLOCK) ? 30 : 24;
  let size = maxSize;
  while (size > 11 && textWidth(str, size, '700') > padW) size -= 1;
  if (textWidth(str, size, '700') <= padW) { text(str, q.x + q.w/2, q.y + q.h/2 + 1, size, ink); return; }
  
  const sp = str.lastIndexOf(' ', Math.ceil(str.length / 2) + 2);
  const cut = (sp > 0) ? sp : Math.ceil(str.length / 2);
  const a = str.slice(0, cut).trim(), b = str.slice(sp > 0 ? sp + 1 : cut).trim();
  size = maxSize;
  while (size > 10 && Math.max(textWidth(a, size, '700'), textWidth(b, size, '700')) > padW) size -= 1;
  const lh = size * 1.15;
  text(a, q.x + q.w/2, q.y + q.h/2 - lh/2 + 1, size, ink);
  text(b, q.x + q.w/2, q.y + q.h/2 + lh/2 + 1, size, ink);
}

    const q = choiceRect(i), c = S.choices[i], v = choiceVal(c);
    const picked = (S.picked === i);
    const isAns = (v === S.answer);
    
    let line = '#b39bff', lw = 1.6, ink = '#fff2cc', glow = 'rgba(179,155,255,0.35)';
    if (!active) {
      if (picked && isAns) { line = '#7fe3a1'; lw = 3; ink = '#bfffd4'; glow = 'rgba(127,227,161,0.6)'; }
      else if (picked)     { line = '#ff8a7a'; lw = 3; ink = '#ffc9c0'; glow = 'rgba(255,138,122,0.6)'; }
      else if (isAns && S.mode === 'teach') { line = '#7fe3a1'; lw = 3; ink = '#bfffd4'; }
    }
    ctx.save();
    ctx.globalAlpha = active ? 1 : (picked || (isAns && S.mode === 'teach') ? 1 : 0.35);
    if (picked && !active) {
      const p = 1 + 0.06 * Math.max(0, 1 - S.t / 0.3);
      ctx.translate(q.x + q.w/2, q.y + q.h/2); ctx.scale(p, p);
      ctx.translate(-(q.x + q.w/2), -(q.y + q.h/2));
    }
    
    ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = 10;
    rrect(q.x, q.y, q.w, q.h, 10);
    const cg = ctx.createLinearGradient(0, q.y, 0, q.y + q.h);
    cg.addColorStop(0, '#3d3158'); cg.addColorStop(1, '#241c38');
    ctx.fillStyle = cg; ctx.fill(); ctx.restore();
    rrect(q.x, q.y, q.w, q.h, 10);
    ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke();
    
    rrect(q.x + 3, q.y + 3, q.w - 6, q.h - 6, 7);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1; ctx.stroke();
    
    ctx.save(); ctx.shadowColor = 'rgba(255,214,120,0.45)'; ctx.shadowBlur = 6;
    if (c !== null && typeof c === 'object' && c.draw) {
      c.draw(q, ink);
    } else {
      const s = (c !== null && typeof c === 'object' && c.txt != null) ? String(c.txt) : String(v);
      
      fitText(s, q, ink);
    }
    ctx.restore();
    ctx.restore();
  }
}

const TEACH_BAR_H = 46, TEACH_FOOT_H = 52, TEACH_MSG_H = 68;   



const INTRO_TAB_H = 30;
function introTabRects(){

function teachArea(){

function figArea(){

}

function figAreaFor(kind){
  const a = figArea();
  if (kind !== 'cols') return a;
  return { x: a.x + 18, y: a.y + 10, w: a.w - 36, h: a.h - 34 };
}
function drawFloorPlate(B, fit){
  const n = S.g.length;
  let iMin = n, iMax = 0, jMin = n, jMax = 0, any = false;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (S.g[i][j] > 0) {
      any = true;
      if (i < iMin) iMin = i; if (i + 1 > iMax) iMax = i + 1;
      if (j < jMin) jMin = j; if (j + 1 > jMax) jMax = j + 1;
    }
  }
  if (!any) return;
  const m = 0.7;
  const P = (x, z) => {
    const q = proj(B, x, 0, z);
    return [ q[0]*fit.S + fit.ox, q[1]*fit.S + fit.oy ];
  };
  const quad = [ P(iMin-m, jMin-m), P(iMax+m, jMin-m), P(iMax+m, jMax+m), P(iMin-m, jMax+m) ];
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 2.4);
  ctx.save();
  poly(quad, 'rgba(120,96,196,0.13)', null);
  ctx.globalAlpha = 0.35 + 0.4 * pulse;
  poly(quad, null, '#8c7ad6', 2.4);
  ctx.restore();
}

function drawFigure(){
  const stQ = stageById(S.stage);
  if (stQ.drawQ) { stQ.drawQ(figArea()); return; }
  const B = playBasis();                 
  if (!S.fit) S.fit = fitFor(S.g, B, figAreaFor(S.kind));
  let fit = S.fit;
  if (S.mode === 'teach') {
    const t = teachLay();
    const f1 = fitFor(S.g, B, teachAreas().left);
    fit = { S:  S.fit.S  + (f1.S  - S.fit.S)  * t,
            ox: S.fit.ox + (f1.ox - S.fit.ox) * t,
            oy: S.fit.oy + (f1.oy - S.fit.oy) * t };
  }

  ctx.save();
  if (S.shakeT > 0) {
    const k = S.shakeT * 14;
    ctx.translate(Math.sin(S.shakeT * 60) * k, 0);
  }
  if (S.mode === 'correct') {
    const p = 1 + 0.06 * Math.sin(Math.min(1, S.t / CONFIG.T_CORRECT) * Math.PI);
    ctx.translate(W/2, figArea().y + figArea().h/2);
    ctx.scale(p, p);
    ctx.translate(-W/2, -(figArea().y + figArea().h/2));
  }

  const marks = [];
  let hi = null;
  if (S.mode === 'play') {
    for (const key in S.assistOn) {
      const [i, j] = key.split(',').map(Number);
      marks.push({ i, j, color: CONFIG.C_INK });
    }
  } else if (S.mode === 'teach') {
    const T = S.teach;
    
    if (T.phase === 'step' && T.shown > 0 && T.shown <= T.cols.length) hi = T.cols[T.shown - 1];
  }
  
  if (S.kind === 'cols' && (S.mode === 'play' || S.mode === 'wrong' || S.mode === 'correct')) {
    drawFloorPlate(B, fit);
  }
  drawShape(S.g, B, fit, { marks, hi });

  
  if (S.mode === 'teach' && hi && S.teach.hiddenAt) {
    const ys = S.teach.hiddenAt[hi.i + ',' + hi.j];
    if (ys && ys.length) {
      const blink = 0.45 + 0.4 * Math.abs(Math.sin(S.t * 6.5));
      ctx.save();
      for (const y of ys) {
        const f = cubeFaces(B, hi.i, y, hi.j, fit.S, fit.ox, fit.oy);
        ctx.globalAlpha = blink * 0.85;
        poly(f.left,  CONFIG.C_HI_L, null);
        poly(f.right, CONFIG.C_HI_R, null);
        poly(f.top,   CONFIG.C_HI_T, null);
        ctx.globalAlpha = blink;
        ctx.setLineDash([4, 3]);
        poly(f.left, null, '#c9632a', 2);
        poly(f.right, null, '#c9632a', 2);
        poly(f.top, null, '#c9632a', 2);
        ctx.setLineDash([]);
      }
      ctx.restore();
    }
  }
  ctx.restore();
}


function drawTopView(area, alpha){
  const g = S.g, n = g.length, T = S.teach;
  let iMin = n, iMax = 0, jMin = n, jMax = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (g[i][j] > 0) {
    if (i < iMin) iMin = i; if (i > iMax) iMax = i;
    if (j < jMin) jMin = j; if (j > jMax) jMax = j;
  }
  const cols = iMax - iMin + 1, rows = jMax - jMin + 1;
  const cs = Math.min(area.w * 0.92 / cols, area.h * 0.92 / rows, 50);
  const ox = area.x + area.w/2 - cols * cs / 2;
  const oy = area.y + area.h/2 - rows * cs / 2;

  const hi = (T.phase === 'step' && T.shown > 0 && T.shown <= T.cols.length) ? T.cols[T.shown - 1] : null;
  const shownSet = {};
  for (let k = 0; k < Math.min(T.shown, T.cols.length); k++) shownSet[T.cols[k].i + ',' + T.cols[k].j] = k;

  ctx.save();
  ctx.globalAlpha = alpha;
  for (let j = jMin; j <= jMax; j++) for (let i = iMin; i <= iMax; i++) {
    const x = ox + (i - iMin) * cs, y = oy + (j - jMin) * cs;
    const filled = g[i][j] > 0;
    const lit = hi && hi.i === i && hi.j === j;
    ctx.beginPath(); ctx.rect(x, y, cs, cs);
    ctx.fillStyle = filled ? (lit ? CONFIG.C_HI_T : '#ffffff') : 'rgba(0,0,0,0.035)';
    ctx.fill();
    ctx.strokeStyle = filled ? CONFIG.C_EDGE : CONFIG.C_GRID;
    ctx.lineWidth = filled ? 1.7 : 1;
    ctx.stroke();
    if (filled) {
      const key = i + ',' + j;
      if (key in shownSet) {
        const k = shownSet[key];
        const age = (T.shown - k - 1) * CONFIG.T_TEACH_STEP + Math.min(T.tStep, CONFIG.T_TEACH_STEP);
        const pop = Math.min(1, Math.max(0, age) / 0.16);
        const v = T.val(i, j);
        ctx.save();
        ctx.translate(x + cs/2, y + cs/2 + 1);
        ctx.scale(0.5 + 0.5 * pop, 0.5 + 0.5 * pop);
        
        text(String(v), 0, 0, Math.round(cs * 0.56), v === 0 ? CONFIG.C_INK_SOFT : CONFIG.C_INK);
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

function drawEnemy(fallen){
  const e = S.enemy;
  if (!e) return;
  const a = AREA.enemy;
  
  const art = { x: W/2 - 170, y: a.y + 2, w: 340, h: a.h - 44 };

  ctx.save();
  
  if (e.introT < 1) {
    const p = ease(e.introT);
    ctx.globalAlpha = Math.min(1, e.introT * 2.2);
    ctx.translate(0, -(1 - p) * 150);
    const sq = 1 + 0.22 * Math.sin(Math.min(1, Math.max(0, (e.introT - 0.7) / 0.3)) * Math.PI);
    ctx.translate(W/2, art.y + art.h); ctx.scale(1 / sq, sq); ctx.translate(-W/2, -(art.y + art.h));
  }
  if (e.hurtT > 0) {
    ctx.translate(0, Math.sin((0.4 - e.hurtT) / 0.4 * Math.PI) * 9);
  }
  
  if (e.knockT > 0 && !fallen) {
    const k = e.knockT;
    ctx.translate(0, -k * 18 * Math.sin(k * Math.PI));
    ctx.translate(W/2, art.y + art.h/2);
    ctx.rotate(-k * 0.10 * Math.sin(k * Math.PI * 1.6));
    ctx.scale(1 + k * 0.06, 1 - k * 0.05);
    ctx.translate(-W/2, -(art.y + art.h/2));
  }
  if (fallen) {
    const t = Math.min(1, e.fallT / 1.2);
    ctx.globalAlpha = 1 - t;
    ctx.translate(0, t * t * 80);
    ctx.rotate(t * 0.22);
    ctx.scale(1, 1 - t * 0.35);
    ctx.translate(0, t * 40);
  }
  drawEnemyArt(art, e.art, S.t + (save.played || 0), fallen ? 0 : e.whiteT);
  ctx.restore();

  
  if (S.slashT > 0) {
    const p = 1 - S.slashT;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < S.slashN; i++) {
      const off = (i - (S.slashN - 1) / 2) * 30;
      const k = Math.max(0, Math.min(1, (p - i * 0.10) * 2.2));
      if (k <= 0) continue;
      ctx.globalAlpha = Math.max(0, (1 - k)) * 0.95;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8 * (1 - k * 0.6);
      ctx.lineCap = 'round';
      const cx = W/2 + off, cy = a.y + 66;
      const len = 130 * (0.5 + k);
      ctx.beginPath();
      ctx.moveTo(cx - len/2, cy + len/2 * 0.55);
      ctx.lineTo(cx + len/2, cy - len/2 * 0.55);
      ctx.stroke();
    }
    ctx.restore();
  }

  
  for (const p of S.shards) {
    const k = p.t / p.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.translate(p.x, p.y); ctx.rotate(p.a);
    rrect(-p.s/2, -p.s/2, p.s, p.s, 1.5);
    ctx.fillStyle = CONFIG.C_ENEMY_T; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  if (fallen) return;
  
  drawHpBar(W/2 - 108, a.y + a.h - 24, 216, 9);

  
  if (S.combo >= 2) {
    const pop = 1 + 0.5 * S.comboPop;
    ctx.save();
    
    ctx.translate(W - 58, a.y + 20);
    ctx.scale(pop, pop);
    ctx.font = '800 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(30,16,50,0.9)'; ctx.lineWidth = 4; ctx.strokeText(S.combo + '連続正解！', 0, 0);
    ctx.fillStyle = CONFIG.C_GOLD; ctx.fillText(S.combo + '連続正解！', 0, 0);
    ctx.restore();
  }
  
  if ((S.slashN || 1) >= 3 && S.comboPop > 0 && (S.mode === 'correct')) {
    const q = S.comboPop, sc = 1.6 - 0.5 * q;
    ctx.save();
    ctx.globalAlpha = Math.min(1, q * 2);
    ctx.translate(W/2, a.y + a.h * 0.42); ctx.rotate(-0.14); ctx.scale(sc, sc);
    ctx.font = '800 30px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(255,170,60,0.9)'; ctx.shadowBlur = 18;
    ctx.strokeStyle = '#3a1608'; ctx.lineWidth = 6; ctx.strokeText('クリティカル！', 0, 0);   
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd162'; ctx.fillText('クリティカル！', 0, 0);
    ctx.restore();
  }
}


function drawImpact(){
  if (S.impact <= 0) return;
  const p = 1 - S.impact;             
  let col = null, al = 0;
  if (p < 0.22) { col = '0,0,0'; al = (p / 0.22) * 0.72; }

  ctx.fillStyle = 'rgba(' + col + ',' + Math.max(0, al).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}


function drawHpBar(x, y, w, h){
  const e = S.enemy, n = CONFIG.QUESTIONS_PER_SET;
  rrect(x, y, w, h, h/2);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  const p = Math.max(0, Math.min(1, e.hpShown / n));
  if (p > 0.001) {
    ctx.save();
    rrect(x, y, w, h, h/2); ctx.clip();
    
    const col = p > 0.6 ? '#5ed07a' : (p > 0.3 ? '#e0c04a' : '#e05a4a');
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.22, col); g.addColorStop(1, col);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w * p, h);
    ctx.restore();
    
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(x + w * p, y + h/2, h * 0.62, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
  }
  if (S.hpFlash > 0) {
    ctx.save();
    rrect(x, y, w, h, h/2); ctx.clip();
    ctx.globalAlpha = S.hpFlash * 0.8;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
    ctx.restore();
  }
  rrect(x, y, w, h, h/2);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1.6; ctx.stroke();
  
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  for (let i = 1; i < n; i++) {
    const gx = x + w * i / n;
    ctx.beginPath(); ctx.moveTo(gx, y + 2); ctx.lineTo(gx, y + h - 2); ctx.stroke();
  }
  ctx.restore();
}



function startBreath(){
  const d = DRAGONS[S.boss.gi];
  const kind = d.breath || 'beam';
  const a = AREA.enemy;
  const ty = a.y + a.h * 0.44;
  const fx = { kind, bolts: [], sparks: [] };
  if (kind === 'thunder' || kind === 'beam') {
    
    const mx = -20, my = a.y - 4;                    
    const main = jag([mx, my], [W / 2, ty], 11, 30);
    fx.bolts.push({ pts: main, tx: W / 2, ty, delay: 0, w: 1 });
    
    const nb = (kind === 'thunder') ? 6 : 2;
    for (let i = 0; i < nb; i++) {
      const k = 2 + Math.floor(Math.random() * (main.length - 4));
      const from = main[k];
      const ang = Math.atan2(ty - my, W / 2 - mx) + (Math.random() < 0.5 ? -1 : 1) * (0.45 + Math.random() * 0.7);
      const len = 40 + Math.random() * 90;
      const to = [from[0] + Math.cos(ang) * len, from[1] + Math.sin(ang) * len];
      fx.bolts.push({ pts: jag(from, to, 4, 16), tx: to[0], ty: to[1], delay: 0.06 + Math.random() * 0.1, w: 0.42, fade: true });
    }
  }
  if (kind === 'ice') {
    for (let i = 0; i < 7; i++) {
      fx.sparks.push({ a: -Math.PI * (0.18 + Math.random() * 0.34), r: 70 + Math.random() * 60, w: 3 + Math.random() * 4, d: Math.random() * 0.2 });
    }
  }
  S.breathFx = fx;
  S.breathT = 1;
  sfxBreath(kind);
}

function jag(p0, p1, seg, amp){
  const pts = [p0];
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
  const nx = -dy, ny = dx, nl = Math.hypot(nx, ny) || 1;
  for (let k = 1; k < seg; k++) {
    const t = k / seg;
    const w = (Math.random() * 2 - 1) * amp * Math.sin(t * Math.PI);   
    pts.push([p0[0] + dx * t + (nx / nl) * w, p0[1] + dy * t + (ny / nl) * w]);
  }
  pts.push(p1);
  return pts;
}
function drawBreath(){
  const b = S.breathT, fx = S.breathFx;
  if (b <= 0 || !fx) return;
  const a = AREA.enemy;
  const d = DRAGONS[S.boss ? S.boss.gi : 0];
  const ty = a.y + a.h * 0.44;
  const p = 1 - b;                                  
  ctx.save();
  ctx.beginPath(); ctx.rect(a.x, a.y, a.w, a.h); ctx.clip();

  if (fx.kind === 'thunder' || fx.kind === 'beam') {
    const col = (fx.kind === 'thunder') ? '#8fd4ff' : (d.c2 || '#cfd6ff');
    
    if (b > 0.55) {
      ctx.save();
      ctx.globalAlpha = (b - 0.55) / 0.45 * 0.22;
      ctx.fillStyle = col; ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const bo of fx.bolts) {
      const q = Math.max(0, Math.min(1, (p - bo.delay) * 4.6));
      if (q <= 0) continue;
      let al = Math.min(1, b * 2.4);
      if (bo.fade) al *= 0.85;
      const n = bo.pts.length;
      const upto = Math.max(1, Math.round(q * (n - 1)));
      
      const layers = [
        [col, 26 * bo.w, 0.30],
        [col, 12 * bo.w, 0.75],
        ['#ffffff', 4.6 * bo.w, 1.0],
      ];
      for (const [c, lw, la] of layers) {
        ctx.beginPath();
        ctx.moveTo(bo.pts[0][0], bo.pts[0][1]);
        for (let k = 1; k <= upto; k++) ctx.lineTo(bo.pts[k][0], bo.pts[k][1]);
        ctx.globalAlpha = al * la;
        ctx.strokeStyle = c; ctx.lineWidth = Math.max(1, lw);
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.stroke();
      }
      if (q >= 1 && !bo.fade) {
        const rr = 18 + 56 * (1 - b);
        ctx.globalAlpha = al * 0.95;
        const rg = ctx.createRadialGradient(bo.tx, bo.ty, 2, bo.tx, bo.ty, rr);
        rg.addColorStop(0, 'rgba(255,255,255,0.98)');
        rg.addColorStop(0.4, col);
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(bo.tx, bo.ty, rr, 0, Math.PI * 2); ctx.fill();
        
        ctx.globalAlpha = al * 0.8;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let k = 0; k < 8; k++) {
          const an = k * Math.PI / 4 + 0.3;
          const r0 = 14 + 20 * (1 - b), r1 = r0 + 16;
          ctx.beginPath();
          ctx.moveTo(bo.tx + Math.cos(an) * r0, bo.ty + Math.sin(an) * r0);
          ctx.lineTo(bo.tx + Math.cos(an) * r1, bo.ty + Math.sin(an) * r1);
          ctx.stroke();
        }
      }
    }
  } else if (fx.kind === 'flame') {
    
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      const sp = 1 + k * 0.22;
      const q = Math.min(1.25, p * 2.0 * sp);
      const cx = a.x - 60 + (a.w + 140) * q;
      const hh = a.h * (0.30 - k * 0.05);
      const cy = ty + (k - 1) * 12;
      const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 110);
      g.addColorStop(0, 'rgba(255,250,220,' + (0.85 * b).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(255,170,50,' + (0.65 * b).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(200,40,10,0)');
      ctx.fillStyle = g;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(1.9, hh / 70); ctx.translate(-cx, -cy);
      ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 0.55 * b;
      const lg = ctx.createLinearGradient(a.x, 0, cx, 0);
      lg.addColorStop(0, 'rgba(255,120,20,0)');
      lg.addColorStop(1, 'rgba(255,210,120,0.8)');
      ctx.strokeStyle = lg; ctx.lineWidth = hh * 0.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, cy); ctx.lineTo(cx, cy); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else if (fx.kind === 'ice') {
    ctx.globalCompositeOperation = 'lighter';
    for (const sp of fx.sparks) {
      const q = Math.max(0, Math.min(1, (p - sp.d) * 3.0));
      if (q <= 0) continue;
      const x0 = W / 2 - Math.cos(sp.a) * sp.r * (1 - q) - 40;
      const y0 = ty - Math.sin(sp.a) * sp.r * (1 - q) + 60 * (1 - q);
      ctx.globalAlpha = Math.min(1, b * 2) * 0.95;
      ctx.strokeStyle = '#dff2ff'; ctx.lineWidth = sp.w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(W / 2, ty); ctx.stroke();
    }
    const rr = 14 + 40 * (1 - b);
    const rg = ctx.createRadialGradient(W / 2, ty, 2, W / 2, ty, rr);
    rg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * b).toFixed(3) + ')');
    rg.addColorStop(0.5, 'rgba(150,220,255,' + (0.5 * b).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(150,220,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(W / 2, ty, rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (b > 0.88) {
    ctx.save();
    ctx.globalAlpha = (b - 0.88) / 0.12 * 0.14;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(a.x, a.y, a.w, a.h);
    ctx.restore();
  }
}

function drawRichLine(segs, cx, y, fs, col){

const NO_HEAD = /^[、。，．！？）」』】〉・ー…]/;
function richAtoms(line){
  const out = [];
  String(line).split('**').forEach((part, i) => {
    const b = (i % 2) === 1;
    part.split(/(\s+)/).forEach(t => { if (t) out.push({ t, b, nb: NO_HEAD.test(t) }); });
  });
  return out;
}

function wrapRich(atoms, maxW, fs){
  const lines = []; let cur = [], w = 0;
  for (const a of atoms) {
    const aw = textWidth(a.t, fs, a.b ? '900' : '700');
    if (w + aw > maxW && cur.length && !a.nb) {
      while (cur.length && /^\s+$/.test(cur[cur.length - 1].t)) cur.pop();
      lines.push(cur); cur = []; w = 0;
      if (/^\s+$/.test(a.t)) continue;
    }
    cur.push(a); w += aw;
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function drawTeachMsg(){
  const T = S.teach, m = teachAreas().msg;
  const msg = T.msgFn ? T.msgFn() : '';
  if (!msg) return;
  const maxW = m.w - 34;
  
  let fs = 17, rows = [];
  for (const size of [17, 15, 13, 12]) {
    fs = size; rows = [];
    msg.split('\n').forEach(ln => { rows = rows.concat(wrapRich(richAtoms(ln), maxW, size)); });
    if (rows.length <= 3) break;
  }
  const lh = Math.round(fs * 1.45);
  const boxH = Math.max(m.h - 8, rows.length * lh + 16);
  const boxY = m.y + m.h - 4 - boxH;
  ctx.save();
  rrect(m.x + 6, boxY, m.w - 12, boxH, 10);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
  ctx.restore();
  const y0 = boxY + boxH/2 - (rows.length - 1) * lh / 2;
  rows.forEach((segs, i) => drawRichLine(segs, W/2, y0 + i * lh, fs, CONFIG.C_INK));
}

  const sh = small ? imH(im) * LOGO_TXT.h : imH(im);
  return { w, h: w * sh / sw, sw, sh };
}

const HOLO_HUES = ['#ff5fa2', '#ffd84d', '#5dff9b', '#4fd8ff', '#9d7bff', '#ff5fa2'];
function drawSparkle(box){
  const t = S.t;
  ctx.save();
  rrect(box.x, box.y, box.w, box.h, 10); ctx.clip();
  const diag = box.w + box.h;

  
  for (let k = 0; k < 2; k++) {
    const ph = ((t * (0.13 + k * 0.05) + k * 0.5) % 1);
    const off = -diag + diag * 2 * ph;
    const g = ctx.createLinearGradient(box.x + off, box.y, box.x + off + diag * 0.9, box.y + box.h);
    for (let i = 0; i < HOLO_HUES.length; i++) {
      g.addColorStop(i / (HOLO_HUES.length - 1), HOLO_HUES[i]);
    }
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.30 - k * 0.10;
    ctx.fillStyle = g;
    ctx.fillRect(box.x, box.y, box.w, box.h);
  }

  
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
  const step = 7, slide = (t * 9) % step;
  ctx.beginPath();
  for (let x = -box.h + slide; x < box.w + box.h; x += step) {
    ctx.moveTo(box.x + x, box.y);
    ctx.lineTo(box.x + x + box.h, box.y + box.h);
  }
  ctx.stroke();

  
  const sp = (t * 0.42) % 1.6;
  if (sp < 1) {
    const sx = box.x - box.w * 0.5 + (box.w * 2) * sp;
    const lg = ctx.createLinearGradient(sx - box.w * 0.22, box.y, sx + box.w * 0.22, box.y + box.h);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(0.5, 'rgba(255,255,255,0.40)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.fillStyle = lg;
    ctx.fillRect(box.x, box.y, box.w, box.h);
  }
  ctx.restore();
}

  const last = STAGES.filter(st => st.unlocked).pop();

  const rows = CONFIG.PIECES_PER_DRAGON;
  
  const y0 = MAP_TOP + (bossOpen(curPage()) ? BOSS_BAR_H + 8 : 0);

function starPath(x, y, r, inner){
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = (k % 2 ? r * (inner || 0.45) : r);
    const X = x + Math.cos(a) * rr, Y = y + Math.sin(a) * rr;
    if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}

  ctx.save();

  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, CONFIG.C_GOLD); g.addColorStop(1, '#c08a27');
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;

}

  ctx.strokeStyle = ring; ctx.lineWidth = r * 0.26; ctx.stroke();

function drawWinRays(box){
  const w = S.win;
  if (w.phase === 'defeat') return;
  const cx = W/2, cy = box.y + box.h/2, age = w.rayT || 0;
  const al = Math.min(0.34, age * 1.0) * (w.got ? 1 : 0.6);
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(age * 0.25);
  for (let k = 0; k < 14; k++) {
    const a = k * Math.PI * 2 / 14, wdt = 0.09;
    const g = ctx.createRadialGradient(0, 0, 40, 0, 0, 420);
    g.addColorStop(0, 'rgba(255,214,120,' + (al * (k % 2 ? 0.55 : 0.85)).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 420, a - wdt, a + wdt); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.restore();
}

function winStartPiece(){

function winBurst(x, y, n, big){
  const w = S.win; if (!w) return;
  w.flash = big ? 1 : 0.7; w.sparks = w.sparks || [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (big ? 220 : 150) * (0.4 + Math.random() * 0.8);
    w.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.9 + Math.random() * 0.7, t: 0,
      col: ['#ffd162', '#fff6d0', '#e9b45c', '#b39bff'][i % 4], sz: 3 + Math.random() * 4, rot: Math.random() * 6 });
  }
}
function updateWinFx(dt){
  const w = S.win; if (!w) return;
  if (w.flash > 0) w.flash = Math.max(0, w.flash - dt * 2.2);
  if (w.phase !== 'defeat') w.rayT = (w.rayT || 0) + dt;
  if (w.phase === 'piece' && w.pieceBurstAt != null && S.t >= w.pieceBurstAt) {
    w.pieceBurstAt = null;
    const box = { x: W/2 - 108, y: 168 + (H - BASE_H) / 2, w: 216, h: 288 };
    const c = pieceCenter(box, pieceShapes(w.n)[w.slot]);
    winBurst(c.x, c.y, 36, false);
  }
  if (w.sparks) {
    for (const p of w.sparks) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.vx *= 0.985; p.rot += dt * 4; }
    w.sparks = w.sparks.filter(p => p.t < p.life);
  }
}
function drawWinSparks(){
  const w = S.win; if (!w || !w.sparks) return;
  ctx.save();
  for (const p of w.sparks) {
    const al = 1 - p.t / p.life;
    ctx.globalAlpha = Math.max(0, al);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col; ctx.fillRect(-p.sz/2, -p.sz/2, p.sz, p.sz);
    ctx.rotate(-p.rot); ctx.translate(-p.x, -p.y);
  }
  ctx.restore();
}

}


const ovl = document.getElementById('ovl');
const ovlTtl = document.getElementById('ovlTtl');
const ovlIn = document.getElementById('ovlIn');
const ovlMsg = document.getElementById('ovlMsg');
const ovlYes = document.getElementById('ovlYes');
const ovlNo = document.getElementById('ovlNo');
let ovlMode = null;

function openCode(mode){
  ovlMode = mode;
  if (mode === 'export') {
    ovlTtl.textContent = 'かんたんコード（書き出し）';
    ovlIn.value = makeKidCode();
    ovlIn.readOnly = true;
    ovlYes.textContent = 'コピー';
    
    ovlMsg.textContent = 'この8文字を控えておけば、消えても戻せます。';
  } else {
    ovlTtl.textContent = 'かんたんコード（読み込み）';
    ovlIn.value = '';
    ovlIn.readOnly = false;
    ovlYes.textContent = '読み込む';
    ovlMsg.textContent = '8文字のコード（前の長いコードも読めます）。いまの記録は上書きされます。';
  }
  ovl.classList.add('on');
  if (mode === 'export') {
    
    setTimeout(() => { try { ovlIn.focus(); ovlIn.setSelectionRange(0, ovlIn.value.length); } catch(e){} }, 40);
  } else {
    setTimeout(() => { try { ovlIn.focus(); } catch(e){} }, 40);
  }
}
function closeCode(){
  ovl.classList.remove('on');
  ovlMode = null;
  try { ovlIn.blur(); } catch(e){}
}
ovlNo.addEventListener('click', () => { closeCode(); });
ovlYes.addEventListener('click', () => {
  if (ovlMode === 'export') {
    
    let done = false;
    try {
      ovlIn.focus(); ovlIn.setSelectionRange(0, ovlIn.value.length);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ovlIn.value).then(() => {
          ovlMsg.textContent = 'コピーしました。';
        }).catch(() => {
          ovlMsg.textContent = '選んであります。長おしでコピーしてください。';
        });
        done = true;
      }
    } catch(e){}
    if (!done) ovlMsg.textContent = '選んであります。長おしでコピーしてください。';
    return;
  }
  if (applyCode(ovlIn.value)) {
    ovlMsg.textContent = '読み込みました。';
    sfxPiece();
    setTimeout(closeCode, 550);
  } else {
    ovlMsg.textContent = 'そのコードは使えません。';
    sfxWrong();
  }
});


function hitMute(x, y){ return x > 300 && x < 350 && y > 4 && y < 48; }

function pickColumn(x, y){
  
  const B = playBasis(), fit = S.fit, g = S.g;
  const cubes = cubeList(g, B);
  for (let k = cubes.length - 1; k >= 0; k--) {
    const c = cubes[k];
    const f = cubeFaces(B, c.i, c.y, c.j, fit.S, fit.ox, fit.oy);
    if (pointInPoly(x, y, f.top) || pointInPoly(x, y, f.left) || pointInPoly(x, y, f.right)) {
      return { i: c.i, j: c.j };
    }
  }
  return null;
}

function onDown(lx, ly){
  initAudio(); resumeAudio();

  
  if (S.quitAsk) {
    const p = quitPanel();
    const inb = (b) => lx >= b.x && lx <= b.x + b.w && ly >= b.y - 6 && ly <= b.y + b.h + 6;
    if (inb(p.stay)) { S.quitAsk = false; sfxTap(); return; }
    if (inb(p.go))   { S.quitAsk = false; bgmStop(); S.intro = false; S.teach = null; S.boss = null; S.mode = 'map'; S.t = 0; sfxTap(); return; }
    return;
  }
  if (hitMute(lx, ly)) { muted = !muted; sfxTap(); return; }
  
  if (!S.intro && (S.mode === 'play' || S.mode === 'correct' || S.mode === 'teach') && hitQuit(lx, ly)) {
    S.quitAsk = true; sfxTap();
    return;
  }

  if (S.mode === 'title') { S.mode = 'map'; S.t = 0; sfxTap(); return; }

  
  if (S.mode === 'map') {
    
    if (lx > W - 96 && lx < W - 52 && ly < 52) { S.mode = 'book'; S.t = 0; sfxTap(); return; }
    
    {
      const tb = mapTabletRect();
      if (lx >= tb.x - 10 && lx <= tb.x + tb.w + 10 && ly >= tb.y - 10 && ly <= tb.y + tb.h + 10) {
        S.bookSel = curPage(); S.bookFrom = 'map'; S.mode = 'bookView'; S.t = 0; sfxTap(); return;
      }
    }
    
    if (bossOpen(curPage())) {
      const b = bossBarRect();
      if (lx >= b.x && lx <= b.x + b.w && ly >= b.y - 4 && ly <= b.y + b.h + 4) {
        startBoss(curPage()); sfxTap(); return;
      }
    }
    
    if (ly > 60 && ly < 150) {
      if (lx < MAP_ARROW.w && curPage() > 0) { setPage(curPage() - 1); sfxTap(); return; }
      if (lx > W - MAP_ARROW.w && curPage() < DRAGONS.length - 1) { setPage(curPage() + 1); sfxTap(); return; }
    }
    const list = pageStages(curPage());
    for (let i = 0; i < list.length; i++) {
      const q = mapRect(i);
      if (lx >= q.x && lx <= q.x + q.w && ly >= q.y && ly <= q.y + q.h) {
        if (!list[i].unlocked) { sfxWrong(); return; }
        enterStage(list[i].id, lx > q.x + q.w - 82);
        sfxTap();
        return;
      }
    }
    return;
  }

  if (S.mode === 'book') {
    const hit = (b) => (lx - b.x)*(lx - b.x) + (ly - b.y)*(ly - b.y) < (b.r + 10)*(b.r + 10);
    if (hit(BTN_EXPORT)) { openCode('export'); sfxTap(); return; }
    if (hit(BTN_IMPORT)) { openCode('import'); sfxTap(); return; }
    if (lx < 76 && ly < 84) { S.mode = 'map'; S.t = 0; sfxTap(); return; }
    for (const b of bookTiles()) {
      if (lx >= b.x - 6 && lx <= b.x + b.w + 6 && ly >= b.y - 6 && ly <= b.y + b.h + 36) {
        S.bookSel = b.k; S.bookFrom = 'book'; S.mode = 'bookView'; S.t = 0; sfxTap(); return;
      }
    }
    return;
  }
  if (S.mode === 'bookView') {
    
    S.mode = (S.bookFrom === 'map') ? 'map' : 'book'; S.t = 0; sfxTap();
    return;
  }

  if (S.mode === 'win') {
    
    if (S.win.isBoss) {
      const B = bossWinButtons();
      const inb = (b) => lx >= b.x && lx <= b.x + b.w && ly >= b.y - 8 && ly <= b.y + b.h + 8;
      if (inb(B.retry)) { sfxTap(); startBoss(S.win.gi); return; }
      if (inb(B.back))  { S.boss = null; S.mode = 'map'; S.t = 0; sfxTap(); return; }
      return;
    }
    if (S.win.phase === 'fail') {
      const B = failButtons(), WOFF = (H - BASE_H) / 2, yy = ly - WOFF;
      const inb = (b) => lx >= b.x && lx <= b.x + b.w && yy >= b.y - 6 && yy <= b.y + b.h + 6;
      if (inb(B.retry)) { sfxTap(); newBattle(); return; }
      if (inb(B.back))  { S.mode = 'map'; S.t = 0; sfxTap(); return; }
      return;
    }
    
    if (S.win.phase === 'defeat') { S.win.phase = 'piece'; S.t = 0; winStartPiece(); return; }
    if (S.win.phase === 'piece')  { S.win.phase = 'done'; S.t = 0; return; }
    S.mode = 'map'; S.t = 0; sfxTap();
    return;
  }

  if (S.mode === 'teach') {
    const tabs = introTabRects();
    if (tabs) {
      for (const t of tabs) {
        if (lx >= t.x - 4 && lx <= t.x + t.w + 4 && ly >= t.y - 8 && ly <= t.y + t.h + 8) {
          if (t.i !== S.introIdx) { startIntro(S.stage, t.i); sfxTap(); }
          return;
        }
      }
    }
    if (S.teach.phase === 'step') { if (hitStepBtn(lx, ly)) { teachStep(); } return; }
    if (S.teach.phase === 'wait') {
      const B2 = teachButtons();
      const hit = (b) => (lx - b.x) * (lx - b.x) + (ly - b.y) * (ly - b.y) < (b.r + 12) * (b.r + 12);
      if (hit(B2.replay)) { replayTeach(); sfxTap(); return; }
      if (hit(B2.next))   { teachNext(); sfxTap(); return; }
      
    }
    return;
  }
  
  if (S.mode !== 'play') return;

  
  if (!stageById(S.stage).drawQ && CONFIG.LEVELS[S.lv].assist &&
      ly > figArea().y && ly < figArea().y + figArea().h) {
    const c = pickColumn(lx, ly);
    if (c) {
      const key = c.i + ',' + c.j;
      if (S.assistOn[key]) delete S.assistOn[key]; else S.assistOn[key] = true;
      sfxTap();
      return;
    }
  }

  
  for (let i = 0; i < S.choices.length; i++) {
    const q = choiceRect(i);
    if (lx >= q.x && lx <= q.x + q.w && ly >= q.y && ly <= q.y + q.h) {
      submit(i);
      return;
    }
  }
}


let lastTouch = 0;
cv.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') lastTouch = Date.now();
  const p = toLocal(e.clientX, e.clientY);
  onDown(p.x, p.y);
}, { passive: true });
cv.addEventListener('touchstart', (e) => {
  if (Date.now() - lastTouch < 600) return;
  lastTouch = Date.now();
  const t = e.changedTouches[0];
  const p = toLocal(t.clientX, t.clientY);
  onDown(p.x, p.y);
}, { passive: true });


window.addEventListener('keydown', (e) => {
  if (ovl.classList.contains('on')) {
    if (e.key === 'Escape') closeCode();
    return;                       
  }
  initAudio(); resumeAudio();
  const k = e.key;
  if (k === 'm' || k === 'M') { muted = !muted; return; }
  if (S.mode === 'title') {
    if (k === ' ' || k === 'Enter') { e.preventDefault(); S.mode = 'map'; S.t = 0; sfxTap(); }
    return;
  }
  if (S.mode === 'map') {
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      const first = pageStages(curPage()).find(st => st.unlocked);
      if (first) { enterStage(first.id, false); sfxTap(); }
    }
    if (k === 'ArrowLeft')  { e.preventDefault(); if (curPage() > 0) setPage(curPage() - 1); }
    if (k === 'ArrowRight') { e.preventDefault(); if (curPage() < DRAGONS.length - 1) setPage(curPage() + 1); }
    if (k === 'b' || k === 'B') { S.mode = 'book'; S.t = 0; }
    return;
  }
  if (S.mode === 'book') {
    if (k === ' ' || k === 'Enter' || k === 'Escape') { e.preventDefault(); S.mode = 'map'; S.t = 0; }
    return;
  }
  if (S.mode === 'bookView') {
    if (k === ' ' || k === 'Enter' || k === 'Escape') { e.preventDefault(); S.mode = 'book'; S.t = 0; }
    return;
  }
  if (S.mode === 'win') {
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (S.win.phase === 'fail') { S.mode = 'map'; S.t = 0; sfxTap(); }
      else if (S.win.phase === 'defeat') { S.win.phase = 'piece'; S.t = 0; winStartPiece(); }
      else if (S.win.phase === 'piece') { S.win.phase = 'done'; S.t = 0; }
      else { S.mode = 'map'; S.t = 0; sfxTap(); }
    }
    return;
  }
  if (S.mode === 'teach') {
    if (S.teach.phase === 'step' && (k === ' ' || k === 'Enter')) { e.preventDefault(); teachStep(); return; }
    if (S.teach.phase === 'wait') {
      if (k === ' ' || k === 'Enter') { e.preventDefault(); teachNext(); }
      if (k === 'r' || k === 'R') { e.preventDefault(); replayTeach(); }
    }
    if (k === 'm' || k === 'M') muted = !muted;
    return;
  }
  if (S.mode !== 'play') return;
  
  if (k >= '1' && k <= '6') submit(parseInt(k, 10) - 1);
});
