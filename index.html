const W = 360, BASE_H = 640;


function safeInsets(){
  const el = document.getElementById('sa');
  if (!el) return { t: 0, b: 0, l: 0, r: 0 };
  const c = getComputedStyle(el);
  const n = (v) => Math.max(0, Math.round(parseFloat(v) || 0));
  return { t: n(c.paddingTop), b: n(c.paddingBottom), l: n(c.paddingLeft), r: n(c.paddingRight) };
}
let H = BASE_H;
(function initH(){
  const ins = safeInsets();
  const vw = (window.innerWidth || 360) - ins.l - ins.r;
  const vh = (window.innerHeight || 640) - ins.t - ins.b;
  H = Math.round(Math.min(800, Math.max(620, W * vh / Math.max(1, vw))));
})();



const CH_W = 96, CH_H = 46, CH_GX = 10, CH_GY = 8;
const CH_X0 = (W - (CH_W*3 + CH_GX*2)) / 2;
const CH_BLOCK = CH_H * 2 + CH_GY;          
const CH_Y0 = H - CH_BLOCK - 26;

  hud:    { x:0,  y:0,   w:360, h:44  },

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  
  const ins = safeInsets();
  const aw = Math.max(1, vw - ins.l - ins.r), ah = Math.max(1, vh - ins.t - ins.b);
  scale = Math.min(aw / W, ah / H);
  const dw = W * scale, dh = H * scale;
  offX = ins.l + (aw - dw) / 2; offY = ins.t + (ah - dh) / 2;
  cv.style.width = vw + 'px';
  cv.style.height = vh + 'px';
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

function toLocal(cx, cy){
  return { x: (cx - offX) / scale, y: (cy - offY) / scale };
}


let audio = null, muted = false;
function initAudio(){
  if (audio) return;
  try {
    
    if (navigator.audioSession) navigator.audioSession.type = 'ambient';
  } catch(e) {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    
    try {
      master = audio.createDynamicsCompressor();
      master.threshold.value = -14; master.knee.value = 18; master.ratio.value = 6;
      master.attack.value = 0.002; master.release.value = 0.12;
      master.connect(audio.destination);
    } catch(e) { master = null; }
    
    const b = audio.createBuffer(1, 1, 22050);
    const s = audio.createBufferSource();
    s.buffer = b; s.connect(audio.destination); s.start(0);
  } catch(e) { audio = null; }
}
let master = null;
function out(){ return master || audio.destination; }
function tone(freq, dur, type, vol, delay){
  if (!audio || muted) return;
  try {
    const t = audio.currentTime + (delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((vol == null ? CONFIG.VOL : vol), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out());
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e) {}
}

let noiseBuf = null;
function getNoise(){
  if (!audio) return null;
  if (!noiseBuf) {
    const n = Math.floor(audio.sampleRate * 1.0);
    noiseBuf = audio.createBuffer(1, n, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function noiseHit(dur, f0, f1, q, vol, type, delay){
  if (!audio || muted) return;
  try {
    const t = audio.currentTime + (delay || 0);
    const src = audio.createBufferSource();
    src.buffer = getNoise(); src.loop = true;
    const flt = audio.createBiquadFilter();
    flt.type = type || 'bandpass';
    flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(out());
    src.start(t); src.stop(t + dur + 0.02);
  } catch(e){}
}

function sweep(f0, f1, dur, type, vol, delay){
  if (!audio || muted) return;
  try {
    const t = audio.currentTime + (delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out());
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}


function sfxSlash(n, d0){
  d0 = d0 || 0;
  for (let i = 0; i < n; i++) {
    const d = d0 + i * 0.085, k = 1 + i * 0.12;              
    noiseHit(0.13, 9000 * k, 1800, 0.9, 0.17, 'bandpass', d);          
    noiseHit(0.035, 5200 * k, 5200 * k, 6, 0.13, 'bandpass', d + 0.035); 
    sweep(3100 * k, 2300 * k, 0.11, 'sine', 0.05, d + 0.03);            
  }
}
function sfxHit(){
  const n = S.slashN || 1;
  sfxSlash(n);

const BGM = { on: false, next: 0, bar: 0, timer: null, gain: null, ctx: null };
const BGM_BPM = 76, BGM_BAR = 60 / BGM_BPM * 4;
const BGM_CHORDS = [[62, 65, 69], [58, 62, 65], [55, 58, 62], [57, 62, 64]];   
const BGM_MEL = [   
  [[0, 74], [3, 77], [6, 81], [10, 79], [13, 77]],
  [[0, 74], [4, 72], [8, 74], [11, 69], [14, 72]],
  [[0, 77], [3, 79], [6, 81], [10, 84], [13, 81]],
  [[0, 79], [4, 77], [8, 74], [12, 76], [14, 77]],
];
function mid2f(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function bgmNote(ac, dest, t, f, dur, type, vol, atk, rel, cutoff){
  const o = ac.createOscillator(), g = ac.createGain(), flt = ac.createBiquadFilter();
  o.type = type; o.frequency.value = f;
  flt.type = 'lowpass'; flt.frequency.value = cutoff || 1200; flt.Q.value = 0.7;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + atk);
  g.gain.setValueAtTime(vol, t + Math.max(atk, dur - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(flt); flt.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
}
function bgmBar(ac, dest, t, bar){
  const ch = BGM_CHORDS[bar % 4];
  
  bgmNote(ac, dest, t, mid2f(ch[0] - 24), BGM_BAR + 0.3, 'sine', 0.16, 0.6, 0.6, 400);
  bgmNote(ac, dest, t, mid2f(ch[0] - 12) * 1.003, BGM_BAR + 0.3, 'triangle', 0.05, 0.9, 0.8, 500);
  
  ch.forEach((m, i) => bgmNote(ac, dest, t + 0.05 * i, mid2f(m), BGM_BAR + 0.2, 'triangle', 0.045, 1.2, 1.0, 900));
  
  const mel = BGM_MEL[bar % BGM_MEL.length], e8 = BGM_BAR / 8;
  for (const [pos, m] of mel) {
    const tt = t + pos * e8 / 2;
    bgmNote(ac, dest, tt, mid2f(m), 0.9, 'sine', 0.06, 0.01, 0.7, 3000);
    bgmNote(ac, dest, tt, mid2f(m) * 2, 0.5, 'sine', 0.018, 0.01, 0.4, 5000);
  }
}
function bgmStart(){
  if (!audio || BGM.on) return;
  try {
    BGM.on = true; BGM.ctx = audio;
    BGM.gain = audio.createGain();
    BGM.gain.gain.setValueAtTime(0.0001, audio.currentTime);
    BGM.gain.gain.exponentialRampToValueAtTime(1, audio.currentTime + 1.6);
    BGM.gain.connect(out());
    BGM.next = audio.currentTime + 0.05; BGM.bar = 0;
    BGM.timer = setInterval(bgmTick, 250);
    bgmTick();
  } catch(e) { BGM.on = false; }
}
function bgmTick(){
  if (!BGM.on || !audio) return;
  try {
    while (BGM.next < audio.currentTime + 1.0) {
      if (!muted) bgmBar(audio, BGM.gain, BGM.next, BGM.bar);
      BGM.next += BGM_BAR; BGM.bar++;
    }
  } catch(e) {}
}
function bgmStop(){
  if (!BGM.on) return;
  BGM.on = false; clearInterval(BGM.timer); BGM.timer = null;
  try {
    const g = BGM.gain, ac = BGM.ctx;
    g.gain.cancelScheduledValues(ac.currentTime);
    g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.8);
    setTimeout(() => { try { g.disconnect(); } catch(e) {} }, 1200);
  } catch(e) {}
}

function bgmRender(ac, bars){
  const g = ac.createGain(); g.gain.value = 1; g.connect(ac.destination);
  for (let b = 0; b < bars; b++) bgmBar(ac, g, 0.05 + b * BGM_BAR, b);
}

function suspendAudio(){ try { if (audio && audio.state === 'running') audio.suspend(); } catch(e){} }
function resumeAudio(){ try { if (audio && audio.state === 'suspended') audio.resume(); } catch(e){} }
window.addEventListener('blur', suspendAudio);

    lv: 0, totalOk: 0, bestSet: 0, played: 0,

    day: '',

function clearedSlots(gi){
  const out = [];
  for (const st of STAGES) if (st.dragon === gi && save.cleared && save.cleared[st.id]) out.push(st.slot);
  out.sort((a, b) => a - b);
  return out;
}
function groupSize(gi){ return STAGES.filter(st => st.dragon === gi).length; }

function isPerfect(id){ return ((save.best && save.best[id]) || 0) >= CONFIG.QUESTIONS_PER_SET; }
function perfectSlots(gi){
  return STAGES.filter(st => st.dragon === gi && isPerfect(st.id)).map(st => st.slot).sort((a, b) => a - b);
}
function dragonGold(gi){ return dragonDone(gi) && perfectSlots(gi).length >= groupSize(gi); }
function dragonDone(gi){ return !!(save.dragons && save.dragons['d' + gi]); }

function dragonName(gi, short){
  if (!dragonDone(gi)) return '？？？';
  const d = DRAGONS[gi];
  return (short ? (d.sname || d.dname) : d.dname) + (dragonGold(gi) ? '・真' : '');
}
function textWidth(str, size, weight){
  ctx.font = (weight || '700') + ' ' + size + 'px ' + FONT;
  return ctx.measureText(str).width;
}

function bossExp(gi){ return (save.bx && save.bx['d' + gi]) || 0; }
function expNeed(lv){ return 20 + (lv - 1) * 15; }        
function bossState(gi){
  let e = bossExp(gi), lv = 1;
  while (lv < 30 && e >= expNeed(lv)) { e -= expNeed(lv); lv++; }
  const base = CONFIG.BOSS_ATK + (lv - 1) * CONFIG.BOSS_ATK_LV;
  
  const awake = dragonGold(gi);
  return { lv, cur: e, need: expNeed(lv), atk: base * (awake ? 2 : 1), base, awake };
}
function bossLv(gi){ return bossState(gi).lv; }
function addBossExp(gi, n){
  if (!save.bx) save.bx = {};
  save.bx['d' + gi] = Math.min(99999, bossExp(gi) + Math.max(0, Math.round(n)));
  putSave();
}

function bossOpen(gi){ return dragonDone(gi); }
function dragonsDoneCount(){ let n = 0; for (let g = 0; g < DRAGONS.length; g++) if (dragonDone(g)) n++; return n; }
function today(){
  const t = new Date();
  return t.getFullYear() + '-' + (t.getMonth()+1) + '-' + t.getDate();
}
function piecesToday(){
  if (save.day !== today()) { save.day = today(); save.dayPieces = 0; }
  return save.dayPieces;
}
function canGetPiece(){
  return CONFIG.PIECES_PER_DAY === 0 || piecesToday() < CONFIG.PIECES_PER_DAY;
}



const CODE_VER = 4;

function b36(n){ return Math.max(0, Math.round(n || 0)).toString(36); }
function codeSum(body){
  let t = 0;
  for (let i = 0; i < body.length; i++) t = (t * 31 + body.charCodeAt(i)) % 1296;
  return b36(Math.floor(t / 36)) + b36(t % 36);
}
function makeCode(){
  const f = [CODE_VER, save.lv, save.totalOk, save.bestSet, save.played];
  
  let mask = 0, seen = 0, dr = 0;
  STAGES.forEach((st, i) => { if (save.cleared && save.cleared[st.id]) mask |= (1 << i); if (save.seen && save.seen[st.id]) seen |= (1 << i); });
  DRAGONS.forEach((d, g) => { if (save.dragons && save.dragons['d' + g]) dr |= (1 << g); });
  f.push(mask); f.push(dr); f.push(seen);
  
  let lvs = '', best = '';
  STAGES.forEach((st, i) => { const lv = (save.lvs && save.lvs[st.id]) || 0; if (lv > 0) lvs += b36(i) + b36(lv); });
  STAGES.forEach((st, i) => { const b = (save.best && save.best[st.id]) || 0; if (b > 0) best += b36(i) + b36(b); });
  
  let bxs = '';
  DRAGONS.forEach((d, g) => { const e = bossExp(g); if (e > 0) bxs += b36(g) + b36(e) + '.'; });
  const body = f.map(b36).join('-') + '-' + (lvs || '0') + '-' + (best || '0') + (bxs ? '-' + bxs : '');
  return (body + '-' + codeSum(body)).toUpperCase();
}

function applyCode(raw){
  const t = String(raw || '').trim().toLowerCase().replace(/\s/g, '');
  if (!t) return false;
  
  if (t.indexOf('-') < 0) return applyKidCode(t);
  const parts = t.split('-');
  if (parts.length < 6) return false;
  const sum = parts.pop();
  const body = parts.join('-');
  if (codeSum(body) !== sum) return false;
  const lvStr = (parts[8] && parts[8] !== '0') ? parts[8] : '';   
  const bestStr = (parts[9] && parts[9] !== '0') ? parts[9] : '';    
  const bxStr = parts[10] || '';                                     
  const f = parts.slice(0, 8).map(x => parseInt(x, 36));
  if (f.some(x => !isFinite(x) || x < 0)) return false;
  if (f[0] !== CODE_VER && f[0] !== 3 && f[0] !== 1) return false;
  if (parts.length > 11 || (f[0] === 1 && parts.length > 5)) return false;

  save.lv = Math.min(CONFIG.LEVELS.length - 1, f[1] || 0);
  save.totalOk = f[2] || 0;
  save.bestSet = Math.min(CONFIG.QUESTIONS_PER_SET, f[3] || 0);
  save.played = f[4] || 0;
  save.pieces = {}; save.dragons = {}; save.cleared = {}; save.seen = {}; save.lvs = {}; save.best = {}; save.bx = {};
  if (f[0] === CODE_VER || f[0] === 3) {
    const mask = f[5] || 0, dr = f[6] || 0, seen = f[7] || 0;
    const lvMap = {}, bestMap = {};
    for (let k = 0; k + 1 < lvStr.length; k += 2) lvMap[parseInt(lvStr[k], 36)] = parseInt(lvStr[k + 1], 36);
    for (let k = 0; k + 1 < bestStr.length; k += 2) bestMap[parseInt(bestStr[k], 36)] = parseInt(bestStr[k + 1], 36);
    STAGES.forEach((st, i) => {
      if (mask & (1 << i)) save.cleared[st.id] = true;
      if (seen & (1 << i)) save.seen[st.id] = true;
      const b = bestMap[i] || 0;
      if (isFinite(b) && b > 0) save.best[st.id] = Math.min(CONFIG.QUESTIONS_PER_SET, b);
      const lv = lvMap[i] || 0;
      if (isFinite(lv) && lv > 0) save.lvs[st.id] = Math.min(CONFIG.LEVELS.length - 1, lv);
    });
    DRAGONS.forEach((d, g) => { if (dr & (1 << g)) save.dragons['d' + g] = 1; });
    
    if (bxStr) bxStr.split('.').forEach(seg => {
      if (seg.length < 2) return;
      const g = parseInt(seg[0], 36), e = parseInt(seg.slice(1), 36);
      if (isFinite(g) && isFinite(e) && g >= 0 && g < DRAGONS.length && e > 0) save.bx['d' + g] = Math.min(99999, e);
    });
  }
  
  if (f[0] === 1 && save.lvs.shape == null) save.lvs.shape = save.lv;
  putSave();
  S.lv = save.lv;
  return true;
}

const KID_A = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function kidUnits(){ return STAGES.filter(st => st.unlocked); }   
function makeKidCode(){
  const bits = [];
  const push = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  const us = kidUnits();
  push(Math.min(29, us.length), 5);
  us.forEach(st => {
    const b = (save.best && save.best[st.id]) || 0;
    const c = (save.cleared && save.cleared[st.id]) ? 1 : 0;
    push(b >= CONFIG.QUESTIONS_PER_SET ? 2 : (c ? 1 : 0), 2);
  });
  DRAGONS.forEach((d, g) => push(Math.max(0, Math.min(7, bossLv(g) - 1)), 3));
  while (bits.length % 5) bits.push(0);
  let out = '', sum = 0;
  for (let i = 0; i < bits.length; i += 5) {
    let v = 0;
    for (let k = 0; k < 5; k++) v = (v << 1) | bits[i + k];
    out += KID_A[v]; sum += v;
  }
  return out + KID_A[sum % 32];
}
function applyKidCode(raw){
  const t = String(raw || '').toUpperCase().split('').filter(c => KID_A.indexOf(c) >= 0).join('');
  if (t.length < 4) return false;
  const body = t.slice(0, -1), chk = t.slice(-1);
  let sum = 0;
  for (const c of body) sum += KID_A.indexOf(c);
  if (KID_A[sum % 32] !== chk) return false;
  const bits = [];
  for (const c of body) { const v = KID_A.indexOf(c); for (let k = 4; k >= 0; k--) bits.push((v >> k) & 1); }
  let i = 0;
  const take = (n) => { let v = 0; for (let k = 0; k < n; k++) v = (v << 1) | (bits[i++] || 0); return v; };
  const n = take(5);
  if (n < 1 || n > 29) return false;
  if (bits.length < 5 + n * 2 + DRAGONS.length * 3) return false;
  const us = kidUnits();
  const st2 = [];
  for (let k = 0; k < n; k++) st2.push(take(2));
  const lvs = [];
  for (let g = 0; g < DRAGONS.length; g++) lvs.push(take(3));
  
  save.cleared = {}; save.best = {}; save.dragons = {}; save.lvs = {}; save.seen = {}; save.pieces = {}; save.bx = {};
  us.forEach((st, k) => {
    const v = st2[k];
    if (v == null || v === 0) return;
    save.cleared[st.id] = true;
    save.best[st.id] = (v >= 2) ? CONFIG.QUESTIONS_PER_SET : CONFIG.CLEAR_MIN_OK;
  });
  DRAGONS.forEach((d, g) => {
    if (clearedSlots(g).length >= groupSize(g)) save.dragons['d' + g] = 1;
    
    let e = 0;
    for (let k = 1; k <= lvs[g]; k++) e += expNeed(k);
    if (e > 0) save.bx['d' + g] = e;
  });
  save.lv = 0;
  putSave();
  S.lv = 0;
  return true;
}

function basisIso(az, el){
  const th = az * Math.PI / 180, ph = el * Math.PI / 180;
  return {
    ex: [ Math.cos(th),  Math.sin(ph) * Math.sin(th) ],
    ey: [ 0,            -Math.cos(ph) ],
    ez: [ -Math.sin(th), Math.sin(ph) * Math.cos(th) ],
  };
}
function basisOblique(d, ang){
  const a = ang * Math.PI / 180;
  return {
    ex: [ 1, 0 ],
    ey: [ 0, -1 ],
    ez: [ -d * Math.cos(a), d * Math.sin(a) ],
  };
}

function playBasis(){
  return CONFIG.VIEW === 'oblique'
    ? basisOblique(CONFIG.OBLIQUE.depth, CONFIG.OBLIQUE.ang)
    : basisIso(CONFIG.ISO.az, CONFIG.ISO.el);
}

function proj(B, x, y, z){
  return [ B.ex[0]*x + B.ey[0]*y + B.ez[0]*z,
           B.ex[1]*x + B.ey[1]*y + B.ez[1]*z ];
}


function shapeTotal(g){
  let t = 0;
  for (let i = 0; i < g.length; i++) for (let j = 0; j < g.length; j++) t += g[i][j];
  return t;
}
function shapeSig(g){ return g.map(r => r.join('')).join('|'); }


function cubeList(g, B){
  const n = g.length, out = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    for (let y = 0; y < g[i][j]; y++) out.push({ i, j, y });
  }
  const kx = B.ex[1], kz = B.ez[1];   
  out.sort((a, b) => {
    const da = (kx*a.i + kz*a.j) * 1000 + a.y;
    const db = (kx*b.i + kz*b.j) * 1000 + b.y;
    return da - db;
  });
  return out;
}


function cubeFaces(B, i, y, j, S, ox, oy){
  const P = (x, yy, z) => {
    const p = proj(B, x, yy, z);
    return [ p[0]*S + ox, p[1]*S + oy ];
  };
  return {
    top:   [ P(i,y+1,j), P(i+1,y+1,j), P(i+1,y+1,j+1), P(i,y+1,j+1) ],
    left:  [ P(i,y,j+1), P(i,y+1,j+1), P(i+1,y+1,j+1), P(i+1,y,j+1) ],
    right: [ P(i+1,y,j), P(i+1,y+1,j), P(i+1,y+1,j+1), P(i+1,y,j+1) ],
  };
}

function pointInPoly(px, py, poly){
  let inside = false;
  for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
    const xa = poly[a][0], ya = poly[a][1], xb = poly[b][0], yb = poly[b][1];
    if ((ya > py) !== (yb > py) && px < (xb - xa) * (py - ya) / (yb - ya) + xa) inside = !inside;
  }
  return inside;
}




const TOP_PROBE = (() => {
  const d = CONFIG.TOP_INSET;
  return [[0.5,0.5],[d,d],[1-d,d],[d,1-d],[1-d,1-d]];
})();
function allTopsVisible(g, B){
  const n = g.length, S = 40, ox = 0, oy = 0;
  const cubes = cubeList(g, B);
  const faces = cubes.map(c => cubeFaces(B, c.i, c.y, c.j, S, ox, oy));
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const h = g[i][j];
    if (h === 0) continue;
    let idx = -1;
    for (let k = 0; k < cubes.length; k++) {
      if (cubes[k].i === i && cubes[k].j === j && cubes[k].y === h - 1) { idx = k; break; }
    }
    if (idx < 0) return false;
    for (const pr of TOP_PROBE) {
      const p = proj(B, i + pr[0], h, j + pr[1]);
      const cx = p[0]*S + ox, cy = p[1]*S + oy;
      for (let k = idx + 1; k < cubes.length; k++) {
        const f = faces[k];
        if (pointInPoly(cx, cy, f.top) || pointInPoly(cx, cy, f.left) || pointInPoly(cx, cy, f.right)) return false;
      }
    }
  }
  return true;
}



const ADD_PROBE = (() => {
  const d = CONFIG.ADD_INSET, o = [];
  for (const uv of [[0.5,0.5],[d,d],[1-d,d],[d,1-d],[1-d,1-d]]) o.push(uv);
  return o;
})();
function noInvisibleAddition(g, B){
  const n = g.length, S = 40;
  const base = cubeList(g, B);
  const baseFaces = base.map(c => cubeFaces(B, c.i, c.y, c.j, S, 0, 0));
  const kx = B.ex[1], kz = B.ez[1];
  const key = (i, j, y) => (kx*i + kz*j) * 1000 + y;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const y = g[i][j];
    const k0 = key(i, j, y);
    
    let from = base.length;
    for (let k = 0; k < base.length; k++) {
      if (key(base[k].i, base[k].j, base[k].y) > k0) { from = k; break; }
    }
    let seen = false;
    outer:
    for (const w of ['top', 'left', 'right']) {
      for (const uv of ADD_PROBE) {
        let p;
        if (w === 'top')   p = proj(B, i + uv[0], y + 1,      j + uv[1]);
        if (w === 'left')  p = proj(B, i + uv[0], y + uv[1],  j + 1);
        if (w === 'right') p = proj(B, i + 1,     y + uv[1],  j + uv[0]);
        const px = p[0]*S, py = p[1]*S;
        let covered = false;
        for (let k = from; k < base.length; k++) {
          const f = baseFaces[k];
          if (pointInPoly(px, py, f.top) || pointInPoly(px, py, f.left) || pointInPoly(px, py, f.right)) { covered = true; break; }
        }
        if (!covered) { seen = true; break outer; }
      }
    }
    if (!seen) return false;
  }
  return true;
}

function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

function growCells(n, k, backSeed){
  const cells = [];
  const seen = new Set();
  
  
  const lim = backSeed ? Math.max(0, Math.ceil(n/2) - 1) : n - 1;
  let cur = [ randInt(0, lim), randInt(0, lim) ];
  cells.push(cur); seen.add(cur[0] + ',' + cur[1]);
  const frontier = [];
  const push = (i, j) => {
    if (i < 0 || j < 0 || i >= n || j >= n) return;
    if (seen.has(i + ',' + j)) return;
    frontier.push([i, j]);
  };
  push(cur[0]+1, cur[1]); push(cur[0]-1, cur[1]); push(cur[0], cur[1]+1); push(cur[0], cur[1]-1);
  while (cells.length < k && frontier.length) {
    const idx = Math.floor(Math.random() * frontier.length);
    const c = frontier.splice(idx, 1)[0];
    if (seen.has(c[0] + ',' + c[1])) continue;
    seen.add(c[0] + ',' + c[1]); cells.push(c);
    push(c[0]+1, c[1]); push(c[0]-1, c[1]); push(c[0], c[1]+1); push(c[0], c[1]-1);
  }
  return cells;
}

const recent = [];
function genShape(lv){
  const s = CONFIG.LEVELS[lv];
  const B = playBasis();
  for (let t = 0; t < CONFIG.GEN_TRIES; t++) {
    const n = s.n;
    const g = [];
    for (let i = 0; i < n; i++) { g.push([]); for (let j = 0; j < n; j++) g[i].push(0); }
    const k = randInt(s.cellMin, Math.min(s.cellMax, n*n));
    const cells = growCells(n, k, CONFIG.STRICT_READABLE);
    if (cells.length < s.cellMin) continue;
    
    
    const kx = B.ex[1], kz = B.ez[1];
    cells.sort((a, b) => (kx*a[0] + kz*a[1]) - (kx*b[0] + kz*b[1]));
    for (const c of cells) {
      const i = c[0], j = c[1];
      let bound = s.hMax;
      if (i > 0 && g[i-1][j] > 0) bound = Math.min(bound, g[i-1][j] + 1);
      if (j > 0 && g[i][j-1] > 0) bound = Math.min(bound, g[i][j-1] + 1);
      g[i][j] = randInt(1, Math.max(1, bound));
    }
    const tot = shapeTotal(g);
    if (tot < s.totMin || tot > s.totMax) continue;
    if (s.hMax >= 2) {                       
      let hasTall = false;
      for (const c of cells) if (g[c[0]][c[1]] >= 2) hasTall = true;
      if (!hasTall) continue;
    }
    const sig = shapeSig(g);
    if (recent.indexOf(sig) >= 0) continue;
    if (!allTopsVisible(g, B)) continue;
    if (CONFIG.STRICT_READABLE && !noInvisibleAddition(g, B)) continue;
    recent.push(sig);
    if (recent.length > CONFIG.RECENT_MEMORY) recent.shift();
    return g;
  }
  
  const n = s.n, g = [];
  for (let i = 0; i < n; i++) { g.push([]); for (let j = 0; j < n; j++) g[i].push(0); }
  for (let i = 0; i < n; i++) g[i][0] = Math.min(s.hMax, n - i);
  return g;
}


function fitFor(g, B, area){
  const n = g.length;
  let iMin = n, iMax = 0, jMin = n, jMax = 0, hMax = 1, any = false;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (g[i][j] > 0) {
      any = true;
      if (i < iMin) iMin = i; if (i+1 > iMax) iMax = i+1;
      if (j < jMin) jMin = j; if (j+1 > jMax) jMax = j+1;
      if (g[i][j] > hMax) hMax = g[i][j];
    }
  }
  if (!any) { iMin = 0; iMax = 1; jMin = 0; jMax = 1; }
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const x of [iMin, iMax]) for (const y of [0, hMax]) for (const z of [jMin, jMax]) {
    const p = proj(B, x, y, z);
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
  }
  const spanX = Math.max(maxX - minX, 0.001), spanY = Math.max(maxY - minY, 0.001);
  let S = Math.min(area.w * CONFIG.FIT_MARGIN / spanX, area.h * CONFIG.FIT_MARGIN / spanY);
  S = Math.min(S, area.maxPx || CONFIG.CUBE_MAX_PX);
  const ox = area.x + area.w/2 - (minX + maxX)/2 * S;
  const oy = area.y + area.h/2 - (minY + maxY)/2 * S;
  return { S, ox, oy };
}


function poly(pts, fill, stroke, lw){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || CONFIG.EDGE_W; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const FONT = '-apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif';
function text(s, x, y, size, color, align, weight){
  ctx.fillStyle = color;
  ctx.font = (weight || '700') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}

function drawShape(g, B, fit, opt){
  opt = opt || {};
  const hi = opt.hi;
  
  const pal = opt.pal || null;
  const dead = opt.dead || null;
  const cubes = cubeList(g, B);
  const flat = Math.abs(B.ey[1]) < 0.06;   
  for (const c of cubes) {
    if (dead && dead[c.i + ',' + c.y + ',' + c.j]) continue;
    const f = cubeFaces(B, c.i, c.y, c.j, fit.S, fit.ox, fit.oy);
    const lit = hi && hi.i === c.i && hi.j === c.j;
    if (pal) {
      if (!flat) { poly(f.left, pal.left, pal.edge); poly(f.right, pal.right, pal.edge); }
      poly(f.top, pal.top, pal.edge);
      continue;
    }
    if (!flat) {
      poly(f.left,  lit ? CONFIG.C_HI_L : CONFIG.C_LEFT,  CONFIG.C_EDGE);
      poly(f.right, lit ? CONFIG.C_HI_R : CONFIG.C_RIGHT, CONFIG.C_EDGE);
    }
    const isTop = (c.y === g[c.i][c.j] - 1);
    poly(f.top, lit ? (isTop ? CONFIG.C_HI_T : CONFIG.C_HI_L) : CONFIG.C_TOP, CONFIG.C_EDGE);
  }
  if (opt.marks) {
    for (const m of opt.marks) {
      const p = proj(B, m.i + 0.5, g[m.i][m.j], m.j + 0.5);
      const x = p[0]*fit.S + fit.ox, y = p[1]*fit.S + fit.oy;
      const r = Math.max(11, fit.S * 0.30) * (m.pop == null ? 1 : m.pop);
      if (r < 1) continue;
      ctx.save();
      ctx.globalAlpha = m.alpha == null ? 1 : m.alpha;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fillStyle = m.color || CONFIG.C_INK; ctx.fill();
      text(String(g[m.i][m.j]), x, y + 0.5, Math.round(r * 1.25), '#ffffff');
      ctx.restore();
    }
  }
}




const VIS_UV = [0.06, 0.28, 0.5, 0.72, 0.94];
function faceSamples(q){
  
  const out = [];
  for (const u of VIS_UV) for (const v of VIS_UV) {
    const x = (1-u)*(1-v)*q[0][0] + u*(1-v)*q[1][0] + u*v*q[2][0] + (1-u)*v*q[3][0];
    const y = (1-u)*(1-v)*q[0][1] + u*(1-v)*q[1][1] + u*v*q[2][1] + (1-u)*v*q[3][1];
    out.push([x, y]);
  }
  return out;
}
function visibleFlags(g, B){
  const S0 = 40;
  const cubes = cubeList(g, B);        
  const faces = cubes.map(c => cubeFaces(B, c.i, c.y, c.j, S0, 0, 0));
  const flags = new Array(cubes.length).fill(false);
  for (let k = 0; k < cubes.length; k++) {
    const f = faces[k];
    let seen = false;
    for (const key of ['top', 'left', 'right']) {
      for (const p of faceSamples(f[key])) {
        let covered = false;
        for (let m = k + 1; m < cubes.length && !covered; m++) {
          const o = faces[m];
          if (pointInPoly(p[0], p[1], o.top) || pointInPoly(p[0], p[1], o.left) || pointInPoly(p[0], p[1], o.right)) covered = true;
        }
        if (!covered) { seen = true; break; }
      }
      if (seen) break;
    }
    flags[k] = seen;
  }
  return { cubes, flags };
}


function visibleCubeCount(g, B){
  const { flags } = visibleFlags(g, B);
  let n = 0;
  for (const f of flags) if (f) n++;
  return n;
}


function visiblePerColumn(g, B){
  const { cubes, flags } = visibleFlags(g, B);
  const out = {};
  for (let k = 0; k < cubes.length; k++) {
    const key = cubes[k].i + ',' + cubes[k].j;
    out[key] = (out[key] || 0) + (flags[k] ? 1 : 0);
  }
  return out;
}


function columnCount(g){
  let n = 0;
  for (let i = 0; i < g.length; i++) for (let j = 0; j < g.length; j++) if (g[i][j] > 0) n++;
  return n;
}

function shapeChoices(g, answer, kind){
  const B = playBasis();
  const cand = [];
  const push = (v) => {
    v = Math.round(v);
    if (v > 0 && v !== answer && cand.indexOf(v) < 0) cand.push(v);
  };
  const tot = shapeTotal(g), vis = visibleCubeCount(g, B), cols = columnCount(g);
  
  if (kind === 'hidden') {
    push(tot - cols);   
    push(cols);
    push(answer - 1); push(answer + 1); push(answer + 2); push(answer - 2);
  } else if (kind === 'cols') {
    push(tot);          
    push(vis);
    push(answer - 1); push(answer + 1); push(answer + 2); push(answer - 2);
  } else {
    push(vis);          
    push(cols);         
    push(answer - 1); push(answer + 1);
    push(answer - 2); push(answer + 2);
    push(answer - 3); push(answer + 3);
  }
  
  for (let d = 1; cand.length < CONFIG.CHOICES - 1 && d < 30; d++) { push(answer - d); push(answer + d); }

  const picked = cand.slice(0, CONFIG.CHOICES - 1);
  picked.push(answer);
  
  for (let i = picked.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = picked[i]; picked[i] = picked[j]; picked[j] = t;
  }
  return picked;
}





const MAGIC_BASE = [[2,9,4],[7,5,3],[6,1,8]];
function magicSym(m, k){
  
  let a = m.map(r => r.slice());
  if (k >= 4) a = [0,1,2].map(i => [0,1,2].map(j => m[j][i]));
  for (let t = 0; t < (k % 4); t++) a = [0,1,2].map(i => [0,1,2].map(j => a[2 - j][i]));
  return a;
}
function magicLines(){
  const L = [];
  for (let r = 0; r < 3; r++) L.push({ kind:'row', cells: [0,1,2].map(c => ({ r, c })) });
  for (let c = 0; c < 3; c++) L.push({ kind:'col', cells: [0,1,2].map(r => ({ r, c })) });
  L.push({ kind:'diag', cells: [0,1,2].map(i => ({ r:i, c:i })) });
  L.push({ kind:'diag', cells: [0,1,2].map(i => ({ r:i, c:2-i })) });
  return L;
}
function magicHas(list, r, c){ return list.some(h => h.r === r && h.c === c); }
function magicIntro(){
  return { m: MAGIC_BASE.map(r => r.slice()), hidden: [{ r:2, c:1 }], ask: { r:2, c:1 }, sum: 15, a: 1, b: 0 };
}
function magicGen(lv, kind){
  kind = kind || 'cell';
  if (kind === 'sum' && lv >= 3) kind = 'cell';           
  let m = magicSym(MAGIC_BASE, randInt(0, 7));
  let a = 1, b = 0;
  if (lv === 1)      { b = randInt(1, 6); }
  else if (lv === 2) { a = randInt(2, 3); b = randInt(0, 4); }
  else if (lv >= 3)  { a = randInt(2, 5); b = randInt(0, 9); }
  m = m.map(r => r.map(v => a * v + b));
  const sum = 3 * (5 * a + b);
  let hidden = [], ask = null;
  if (kind === 'cell') {
    const r0 = randInt(0, 2), c0 = randInt(0, 2);
    hidden.push({ r: r0, c: c0 });
    if (lv >= 3) {
      
      const rs = [0,1,2].filter(r => r !== r0), cs = [0,1,2].filter(c => c !== c0);
      hidden.push({ r: rs[randInt(0, 1)], c: cs[randInt(0, 1)] });
    }
    ask = hidden[0];
  }
  const g = { m, hidden, ask, sum, a, b };
  const answer = (kind === 'sum') ? sum : m[ask.r][ask.c];
  return { g, answer, kind, choices: magicChoices(g, answer, kind) };
}

function magicChoices(g, answer, kind){
  const out = [answer], push = v => { if (v > 0 && v < 400 && !out.includes(v) && out.length < CONFIG.CHOICES) out.push(v); };
  if (kind === 'sum') {
    push(g.sum - g.a); push(g.sum + g.a); push(g.sum - 1); push(g.sum + 1);
    push(g.sum - 3 * g.a); push(g.sum + 3 * g.a); push(g.sum - 2); push(g.sum + 2);
  } else {
    const { r, c } = g.ask, m = g.m;
    const rowKnown = [0,1,2].filter(cc => cc !== c && !magicHas(g.hidden, r, cc)).map(cc => m[r][cc]);
    const colKnown = [0,1,2].filter(rr => rr !== r && !magicHas(g.hidden, rr, c)).map(rr => m[rr][c]);
    
    for (const v of rowKnown) push(g.sum - v);
    for (const v of colKnown) push(g.sum - v);
    
    push(answer - g.a); push(answer + g.a); push(answer - 1); push(answer + 1);
    
    for (const v of rowKnown) push(v);
    push(answer + 2 * g.a); push(answer - 2 * g.a); push(answer + 2); push(answer - 2);
  }
  let k = 1;
  while (out.length < CONFIG.CHOICES) { push(answer + k); push(answer - k); k++; }
  
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = out[i]; out[i] = out[j]; out[j] = x; }
  return out;
}

function magicDrawGrid(area, g, opt){
  opt = opt || {};
  const n = 3;
  const cs = Math.min(area.w / 3.25, area.h / 3.25, opt.small ? 999 : (opt.big ? 96 : 84));
  const ox = area.x + area.w/2 - n * cs / 2, oy = area.y + area.h/2 - n * cs / 2;
  const fs = Math.round(cs * (opt.small ? 0.5 : 0.44));
  ctx.save();
  ctx.lineJoin = 'round';
  
  if (!opt.small) {
    ctx.save(); ctx.shadowColor = 'rgba(60,48,30,0.18)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    rrect(ox - 4, oy - 4, n * cs + 8, n * cs + 8, 10); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.restore();
  }
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const x = ox + c * cs, y = oy + r * cs;
    const hid = magicHas(g.hidden, r, c);
    const isAsk = g.ask && g.ask.r === r && g.ask.c === c;
    const lit = opt.lit && opt.lit[r + ',' + c];
    rrect(x + 2, y + 2, cs - 4, cs - 4, opt.small ? 2 : 6);
    ctx.fillStyle = lit ? lit : (hid ? '#fff1bd' : '#ffffff');
    ctx.fill();
    ctx.strokeStyle = isAsk ? CONFIG.C_GOLD : CONFIG.C_EDGE;
    ctx.lineWidth = isAsk ? 3 : (opt.small ? 1.2 : 1.8);
    ctx.stroke();
    let label;
    if (!hid) label = String(g.m[r][c]);
    else if (isAsk && opt.reveal != null) label = String(opt.reveal);
    else label = '？';
    const col = (hid && !(isAsk && opt.reveal != null)) ? CONFIG.C_INK_SOFT : CONFIG.C_INK;
    if (isAsk && opt.reveal != null && opt.pop != null) {
      ctx.save(); ctx.translate(x + cs/2, y + cs/2 + 1); const sc = 0.6 + 0.4 * opt.pop; ctx.scale(sc, sc);
      text(label, 0, 0, fs, CONFIG.C_OK); ctx.restore();
    } else {
      text(label, x + cs/2, y + cs/2 + 1, fs, col);
    }
  }
  ctx.restore();
  return { ox, oy, cs };
}

function magicTeachBegin(){
  const g = S.g, lines = magicLines();
  const full = lines.filter(L => L.cells.every(p => !magicHas(g.hidden, p.r, p.c)));
  const L1 = full.find(L => L.kind === 'row') || full.find(L => L.kind === 'col') || full[0];
  let L2 = null, steps = [];
  if (g.ask) {
    const thru = lines.filter(L => L.cells.some(p => p.r === g.ask.r && p.c === g.ask.c)
                                && L.cells.filter(p => magicHas(g.hidden, p.r, p.c)).length === 1);
    L2 = thru.find(L => L.kind === 'row') || thru.find(L => L.kind === 'col') || thru[0];
  }
  
  if (S.intro) {
    
    steps.push({ t: 'rule' });
    const fullLines = lines.filter(L => L.cells.every(p => !magicHas(g.hidden, p.r, p.c)));
    fullLines.forEach((L, i) => steps.push({ t: 'line', L, i, n: fullLines.length }));
    steps.push({ t: 'alldone', n: fullLines.length });
  }
  else { L1.cells.forEach(p => steps.push({ t: 'lit1', p })); steps.push({ t: 'sum1' }); }
  if (L2) {
    L2.cells.filter(p => !magicHas(g.hidden, p.r, p.c)).forEach(p => steps.push({ t: 'lit2', p }));
    steps.push({ t: 'reveal' });
  }
  const T = {
    total: steps.length, steps, lit: {}, label: '', reveal: null, revealT: 0, L1, L2,
    sum: 0, cols: [], val: () => 0, hiddenAt: null,
    labelFn(){ return this.label; },
    onReset(){ this.lit = {}; this.label = ''; this.reveal = null; this.revealT = 0; },
    msgFn(){
      const k = this.shown - 1, g2 = S.g, st = k >= 0 ? this.steps[k] : null;
      if (!st) return S.intro ? '？に入る数を\nもとめる考え方' : 'そろっている一列から\n？をもとめる';
      if (st.t === 'rule') return 'たて・よこ・ななめ、どの一列をたしても\nおなじ数になる。これが魔方陣';
      if (st.t === 'line') {
        const kindName = st.L.kind === 'row' ? 'よこ' : (st.L.kind === 'col' ? 'たて' : 'ななめ');
        return (st.i === 0 ? ('まず ' + kindName + 'の一列。たすと ' + g2.sum) : ('これも ' + g2.sum + '（' + kindName + '）')) + '\n' + (st.i + 1) + '本目 ／ ' + st.n + '本';
      }
      if (st.t === 'alldone') return '？のない列は ぜんぶ ' + g2.sum + '！\nこれが魔方陣のひみつ';
      if (st.t === 'lit1') { const n = L1.cells.slice(0, k).map(p => g2.m[p.r][p.c]); return 'まず ？のない一列を見つけて、たす\n' + (n.length ? n.join('＋') : '') ; }
      if (st.t === 'sum1') return '一列たすと ' + g2.sum + '。\nたて・よこ・ななめ、どの列も ' + g2.sum + ' になる';
      if (st.t === 'lit2') return '？のある列も ' + g2.sum + ' のはず。\nわかっている数を ' + g2.sum + ' から ひく';
      if (st.t === 'reveal') return 'のこりは ' + this.reveal + '。\n？は ' + this.reveal;
      return '';
    },
    onStep(k){
      const st = this.steps[k], g2 = S.g;
      if (st.t === 'rule') {
        this.label = ''; sfxTap();
      } else if (st.t === 'line') {
        for (const key in this.lit) this.lit[key] = 'rgba(255,214,120,0.30)';   
        for (const p of st.L.cells) this.lit[p.r + ',' + p.c] = CONFIG.C_HI_T;
        this.label = st.L.cells.map(p => g2.m[p.r][p.c]).join('+') + '=' + g2.sum;
        sfxCount(st.i);
      } else if (st.t === 'alldone') {
        for (const key in this.lit) this.lit[key] = 'rgba(255,214,120,0.30)';
        this.label = 'ぜんぶ ' + g2.sum;
        sfxSum();
      } else if (st.t === 'lit1') {
        this.lit[st.p.r + ',' + st.p.c] = CONFIG.C_HI_T;
        this.label = L1.cells.slice(0, k).map(p => g2.m[p.r][p.c]).join('+');
        sfxCount(k);
      } else if (st.t === 'sum1') {
        this.label = L1.cells.map(p => g2.m[p.r][p.c]).join('+') + '=' + g2.sum;
        sfxSum();
      } else if (st.t === 'lit2') {
        for (const key in this.lit) if (this.lit[key] === CONFIG.C_HI_T) this.lit[key] = 'rgba(255,214,120,0.45)'; else if (S.intro) delete this.lit[key];
        this.lit[st.p.r + ',' + st.p.c] = CONFIG.C_HI_L;
        const known = L2.cells.filter(p => !magicHas(g2.hidden, p.r, p.c));
        const n = known.findIndex(p => p.r === st.p.r && p.c === st.p.c) + 1;
        this.label = g2.sum + known.slice(0, n).map(p => '−' + g2.m[p.r][p.c]).join('');
        sfxCount(k);
      } else if (st.t === 'reveal') {
        const known = L2.cells.filter(p => !magicHas(g2.hidden, p.r, p.c));
        this.reveal = g2.m[g2.ask.r][g2.ask.c];
        this.label = g2.sum + known.map(p => '−' + g2.m[p.r][p.c]).join('') + '=' + this.reveal;
        this.lit[g2.ask.r + ',' + g2.ask.c] = '#dff3e3';
        sfxSum();
      }
    },
  };
  return T;
}

function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}


function numChoices(answer, wrongs, opt){
  opt = opt || {};
  const trapMax = (opt.traps != null) ? opt.traps : 1;
  const span = Math.max(3, Math.round(answer * 0.5) + 2);
  const near = (v) => Math.abs(v - answer) <= span;
  const out = [answer];
  const push = (v) => {
    if (v > 0 && v < 1000 && Number.isInteger(v) && !out.includes(v) && out.length < CONFIG.CHOICES) { out.push(v); return true; }
    return false;
  };
  const list = (wrongs || []).filter(v => v !== answer);
  list.filter(near).forEach(push);
  let traps = 0;
  for (const v of list) { if (near(v)) continue; if (traps >= trapMax) break; if (push(v)) traps++; }
  let k = 1;
  while (out.length < CONFIG.CHOICES && k < 60) { push(answer + k); push(answer - k); k++; }
  return shuffleArr(out);
}

    ctx.translate(W/2, area.y + area.h/2); ctx.scale(p, p); ctx.translate(-W/2, -(area.y + area.h/2));
  }
  fn();
  ctx.restore();
}

const LINE_STEPS = [[1, 2], [2, 5], [2, 3, 4, 5], [3, 4, 5, 10], [5, 10, 20]];
function lineGen(lv){
  const steps = LINE_STEPS[Math.min(lv, LINE_STEPS.length - 1)];
  let g = null;
  for (let t = 0; t < 40; t++) {
    const step = steps[randInt(0, steps.length - 1)];
    const n = randInt(3, 6);                 
    const total = n + randInt(1, 3);         
    const mark = randInt(1, total);
    if (mark === n) continue;                
    g = { step, n, total, mark, label: n * step };
    break;
  }
  if (!g) g = { step: 2, n: 5, total: 8, mark: 3, label: 10 };
  const answer = g.mark * g.step;
  return { g, answer, kind: 'line',
    choices: numChoices(answer, [g.mark, g.label, answer + g.step, answer - g.step, g.label + g.step, g.mark * (g.step + 1)]) };
}
function lineDraw(area, opt){
  opt = opt || {};
  const g = opt.g || S.g;

const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
function weekName(i){ return WEEK[((i % 7) + 7) % 7] + 'よう日'; }
function weekGen(lv, kind){
  
  
  const start = randInt(0, 6);
  const k = (kind === 'after' && lv >= 2) ? 'after' : 'date';
  const R = (k === 'after')
    ? [[9, 20], [9, 28], [9, 40], [8, 52], [8, 60]][Math.min(lv, 4)]
    : [[9, 20], [9, 25], [9, 30], [9, 30], [9, 30]][Math.min(lv, 4)];
  let day = randInt(R[0], R[1]);
  const diff = (k === 'after') ? day : day - 1;
  if (diff < 8) day += 8;                       
  if (k === 'date' && day > 30) day = 30;       
  const g = { start, day, k };
  const idx = (start + ((k === 'after') ? g.day : g.day - 1)) % 7;
  return { g, answer: weekName(idx), kind: k, choices: weekChoices(idx) };
}
function weekChoices(idx){
  const out = [weekName(idx), weekName(idx + 1), weekName(idx - 1)];
  const rest = shuffleArr([0, 1, 2, 3, 4, 5, 6].map(weekName).filter(w => out.indexOf(w) < 0));
  while (out.length < CONFIG.CHOICES) out.push(rest.pop());
  return shuffleArr(out);
}
function weekInfo(g){
  const diff = (g.k === 'after') ? g.day : g.day - 1;
  const q = Math.floor(diff / 7), r = diff % 7;
  return { diff, q, r, base: (g.k === 'after') ? q * 7 : q * 7 + 1, idx: (g.start + diff) % 7 };
}

function weekCellNum(g, r, c){ return r * 7 + c - g.start + (g.k === 'after' ? 0 : 1); }

function weekRows(g, expand){
  const info = weekInfo(g), first = (g.k === 'after') ? 0 : 1;
  const rowOf = (n) => Math.floor((n - first + g.start) / 7);
  const tRow = rowOf(info.diff + first), bRow = rowOf(info.base);
  if (!expand) return [0];
  const out = [];
  if (tRow <= 3) { for (let r = 0; r <= tRow; r++) out.push(r); return out; }
  out.push(0, 1);
  if (bRow > 2) out.push('gap');
  for (let r = Math.max(2, bRow); r <= tRow; r++) out.push(r);
  return out;
}
function weekCellLabel(g, n){
  if (g.k === 'after') return n === 0 ? 'きょう' : String(n);
  return String(n);
}
function weekDraw(area, opt){
  opt = opt || {};
  const g = opt.g || S.g;
  const info = weekInfo(g);
  const list = weekRows(g, !!opt.expand);
  const rows = list.length;
  const cs = Math.min((area.w - 16) / 7, (area.h - 104) / (rows + 0.5), 44);
  const blockH = 14 + cs * rows + 34 + 44;

  const ox = W / 2 - cs * 3.5, oy = top + 16;
  const target = info.diff + (g.k === 'after' ? 0 : 1);   
  const first0 = (g.k === 'after') ? 0 : 1;
  
  const showNum = (n, c) => {
    if (opt.nums === 'all') return true;
    if (c === g.start) return opt.colMax != null && n <= opt.colMax;
    return !!opt.walk && n >= info.base && n <= target;
  };
  ctx.save();
  for (let c = 0; c < 7; c++) {
    const col = c === 0 ? '#cf5b4e' : (c === 6 ? '#4a7fbf' : CONFIG.C_INK_SOFT);
    text(WEEK[c], ox + c * cs + cs / 2, oy - 13, 12, col, 'center', '700');
  }
  for (let k = 0; k < rows; k++) {
   const r = list[k], y = oy + k * cs;
   if (r === 'gap') { text('…', W / 2, y + cs / 2, 20, CONFIG.C_INK_SOFT, 'center', '700'); continue; }
   for (let c = 0; c < 7; c++) {
    const x = ox + c * cs;
    const n = weekCellNum(g, r, c);
    const has = (g.k === 'after') ? (n >= 0) : (n >= 1);
    
    const isBase = (opt.base && n === info.base && has);
    const isFirst = (n === (g.k === 'after' ? 0 : 1) && has);   
    const isTarget = opt.target && n === target && has;
    const inCol = opt.col && c === g.start && has;
    const step = (opt.walk && has && n > info.base && n <= target) ? (n - info.base) : 0;
    rrect(x + 2, y + 2, cs - 4, cs - 4, 6);
    const markFirst = !showNum(n, c) && isFirst;
    ctx.fillStyle = (opt.land && isTarget) ? '#dff3e3'
      : (isTarget ? '#fff1bd' : ((isBase || markFirst) ? CONFIG.C_HI_T : (step ? 'rgba(122,196,146,0.28)' : (inCol ? 'rgba(255,214,120,0.40)' : '#ffffff'))));
    ctx.fill();
    ctx.strokeStyle = (isTarget || isBase || markFirst) ? CONFIG.C_GOLD : CONFIG.C_GRID;
    ctx.lineWidth = (isTarget || isBase || markFirst) ? 2.6 : 1.2;
    ctx.stroke();
    if (!has) continue;
    if (showNum(n, c)) {
      const lab = weekCellLabel(g, n);
      text(lab, x + cs / 2, y + cs / 2 + 1, Math.round(cs * (lab.length > 2 ? 0.27 : 0.38)), CONFIG.C_INK);
    } else if (isFirst) {
      text(g.k === 'after' ? 'きょう' : '1日', x + cs / 2, y + cs / 2 + 1, 11, CONFIG.C_INK, 'center', '700');
    } else {
      
    }
    if (step) text(String(step), x + cs / 2, y + cs - 4, 9, '#3f7a52', 'center', '700');
   }
  }
  
  if (opt.colMax != null) {
    const side = (g.start <= 5) ? 1 : -1;
    const cx = ox + g.start * cs + cs / 2;
    ctx.save();
    for (let k = 1; k < rows; k++) {
      const r0 = list[k - 1], r1 = list[k];
      if (r0 === 'gap' || r1 === 'gap' || r1 !== r0 + 1) continue;
      const n1 = weekCellNum(g, r1, g.start);
      if (!showNum(n1, g.start) || n1 <= first0) continue;
      const my = oy + k * cs;
      const lx = cx + side * (cs * 0.52 + 13);
      ctx.strokeStyle = CONFIG.C_GOLD; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx + side * cs * 0.34, my - 7); ctx.lineTo(cx + side * cs * 0.34, my + 7); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + side * cs * 0.34, my + 8);
      ctx.lineTo(cx + side * cs * 0.34 - 3, my + 3);
      ctx.lineTo(cx + side * cs * 0.34 + 3, my + 3);
      ctx.closePath(); ctx.fillStyle = CONFIG.C_GOLD; ctx.fill();
      
      rrect(lx - 13, my - 7, 26, 14, 7); ctx.fillStyle = CONFIG.C_BG; ctx.fill();
      text('＋7', lx, my + 1, 11, CONFIG.C_GOLD, 'center', '800');
    }
    ctx.restore();
  }

  let by = oy + cs * rows;
  
  if (opt.list) {

function weekTeachBegin(){
  
  const g = S.g, i = weekInfo(g);
  const startName = weekName(g.start);
  const after = (g.k === 'after');
  
  const d = (n) => after ? (n === 0 ? 'きょう' : (n + '日後')) : (n + '日');
  const first0 = after ? 0 : 1;
  const dayTxt = after ? (g.day + '日後') : (g.day + '日');
  const nth = (k) => first0 + 7 * k;
  const HOP_MAX = 3;
  const hops = Math.min(i.q, HOP_MAX);
  const folded = i.q > hops;                     
  
  const wshort = (k) => WEEK[((g.start + k) % 7 + 7) % 7];
  const walkTxt = (i.r <= 4)
    ? Array.from({ length: i.r + 1 }, (_, k) => wshort(k)).join(' → ')
    : (wshort(0) + ' → ' + wshort(1) + ' → … → ' + wshort(i.r));

  const msgs = ['1しゅうかんは 7日。\n日・月・火・水・木・金・土 で 7つ'];
  const labels = ['1しゅうかん'];
  const colMax = [first0];                       
  for (let k = 1; k <= hops; k++) {
    const head = (k === 1) ? ('7日 たつと また ' + startName + '。') : 'もう 7日。';
    const lastHop = (k === hops) && !folded;
    if (!lastHop) {
      msgs.push(head + '\n' + d(nth(k - 1)) + ' → ' + d(nth(k)));
      labels.push('＋7');
    } else if (i.r === 0) {
      msgs.push(head + '\n' + dayTxt + ' に ぴったり とどいた');
      labels.push('ぴったり');
    } else {
      msgs.push(head.replace('。', 'で ') + d(nth(k)) + '。\nつぎの ' + d(nth(k + 1)) + ' は ' + dayTxt + ' を こえる');
      labels.push(d(nth(k)) + ' で とめる');
    }
    colMax.push(nth(k));
  }
  if (folded) {
    msgs.push((i.r === 0)
      ? ('同じように 7ずつ。\n' + dayTxt + ' に ぴったり とどいた')
      : ('同じように 7ずつ。\n' + d(i.base) + ' まで。つぎは ' + dayTxt + ' を こえる'));
    labels.push((i.r === 0) ? 'ぴったり' : (d(i.base) + ' で とめる'));
    colMax.push(i.base);
  }
  msgs.push((i.r === 0)
    ? ('すすまないので ' + startName + ' のまま')
    : (d(i.base) + ' から ' + i.r + 'つ 数える。\n' + walkTxt));
  labels.push((i.r === 0) ? 'そのまま' : (i.r + 'つ 数える'));
  colMax.push(i.base);
  msgs.push('こたえは ' + weekName(i.idx));
  labels.push(weekName(i.idx));
  colMax.push(i.base);
  return makeTeach(msgs.length - 1, msgs, labels, { info: i, colMax: colMax });
}
function weekTeachDraw(area, T){
  const i = T.info, n = T.shown, tot = T.total;
  
  
  weekDraw(teachFigArea(area), {
    expand: true,
    colMax: T.colMax[Math.min(n, T.colMax.length - 1)],
    col: n >= 1,
    base: n >= tot - 2,
    target: n >= tot - 1,
    walk: n >= tot - 1,
    land: n >= tot,
    reveal: n >= tot ? weekName(i.idx) : null,
  });
}

const RUBY_SIZE = 10, RUBY_GAP = 3;

const RUBY_ON = false;

function measureRuby(parts, size){
  ctx.font = '700 ' + size + 'px ' + FONT;
  let w = 0;
  for (const p of parts) {
    if (typeof p === 'string') { w += ctx.measureText(p).width; continue; }
    if (!RUBY_ON) { w += ctx.measureText(p[0]).width; continue; }
    const bw = ctx.measureText(p[0]).width;
    ctx.font = '700 ' + RUBY_SIZE + 'px ' + FONT;
    const rw = ctx.measureText(p[1]).width;
    ctx.font = '700 ' + size + 'px ' + FONT;
    w += Math.max(bw, rw);
  }
  return w;
}

function drawRuby(parts, x, y, size, color){
  let cx = x;
  for (const p of parts) {
    if (typeof p === 'string') {
      ctx.font = '700 ' + size + 'px ' + FONT;
      const w = ctx.measureText(p).width;
      text(p, cx + w/2, y, size, color);
      cx += w;
      continue;
    }
    ctx.font = '700 ' + size + 'px ' + FONT;
    const bw = ctx.measureText(p[0]).width;
    if (!RUBY_ON) { text(p[0], cx + bw/2, y, size, color); cx += bw; continue; }
    ctx.font = '700 ' + RUBY_SIZE + 'px ' + FONT;
    const rw = ctx.measureText(p[1]).width;
    const w = Math.max(bw, rw);
    text(p[0], cx + w/2, y, size, color);
    text(p[1], cx + w/2, y - size/2 - RUBY_GAP - RUBY_SIZE/2 + 1, RUBY_SIZE, color);
    cx += w;
  }
}

  if (e.horn === 1) {

  } else {

    poly([P( 16,-42), P( 40,-50), P( 30,-58), P( 18,-50)], e.c2, e.c1, 2);

function pieceShapes(n){ return PIECE_SHAPES[n] || PIECE_SHAPES[5]; }
function piecePath(box, poly, dx, dy){
  ctx.beginPath();
  poly.forEach((p, i) => {
    const x = box.x + p[0] * box.w + (dx || 0), y = box.y + p[1] * box.h + (dy || 0);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
}
function pieceCenter(box, poly){
  let x = 0, y = 0;
  poly.forEach(p => { x += p[0]; y += p[1]; });
  return { x: box.x + (x / poly.length) * box.w, y: box.y + (y / poly.length) * box.h };
}

let STONE_TEX = null;
function stoneTexture(){
  if (STONE_TEX) return STONE_TEX;
  const c = document.createElement('canvas'); c.width = 160; c.height = 160;
  const g = c.getContext('2d');
  const im = g.createImageData(160, 160), d = im.data;
  let seed = 7;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < d.length; i += 4) {
    const v = 128 + (rnd() - 0.5) * 70;
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  
  for (let k = 0; k < 26; k++) {
    const x = rnd() * 160, y = rnd() * 160, r = 8 + rnd() * 22;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(' + (rnd() < 0.5 ? '0,0,0' : '255,255,255') + ',0.16)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  STONE_TEX = c;
  return c;
}
function drawStoneFill(box, poly, dark){
  ctx.save();
  piecePath(box, poly); ctx.clip();
  
  const g = ctx.createLinearGradient(box.x, box.y, box.x + box.w, box.y + box.h);
  if (dark) { g.addColorStop(0, '#5a5270'); g.addColorStop(0.5, '#3f3852'); g.addColorStop(1, '#2a2438'); }
  else      { g.addColorStop(0, '#d8d0c2'); g.addColorStop(0.5, '#bcb3a4'); g.addColorStop(1, '#9f968a'); }
  ctx.fillStyle = g; ctx.fill();
  
  try {
    const pat = ctx.createPattern(stoneTexture(), 'repeat');
    ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = dark ? 0.55 : 0.4;
    ctx.fillStyle = pat; ctx.fillRect(box.x, box.y, box.w, box.h); ctx.restore();
  } catch(e) {}
  
  ctx.save();
  piecePath(box, poly);
  ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 10; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawSealMark(box, dark){
  const cx = box.x + box.w/2, cy = box.y + box.h/2, r = box.w * 0.34;
  ctx.save();
  
  ctx.globalAlpha = dark ? 0.075 : 0.11;
  ctx.strokeStyle = dark ? '#ffd889' : '#6b5a2a'; ctx.lineWidth = Math.max(1, box.w * 0.008);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.72, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  for (let k = 0; k < 6; k++) { const a = -Math.PI/2 + k * Math.PI/3; const x = cx + Math.cos(a) * r * 0.72, y = cy + Math.sin(a) * r * 0.72; if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
  ctx.closePath(); ctx.stroke();
  for (let k = 0; k < 12; k++) { const a = k * Math.PI/6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.lineTo(cx + Math.cos(a) * r * 1.08, cy + Math.sin(a) * r * 1.08); ctx.stroke(); }
  ctx.restore();
}

function strokeOuterEdges(box, poly){
  const EPS = 0.012;
  const onEdge = (p) => (p[0] <= EPS || p[0] >= 1 - EPS || p[1] <= EPS || p[1] >= 1 - EPS);
  const sameSide = (a, b) =>
    (a[0] <= EPS && b[0] <= EPS) || (a[0] >= 1 - EPS && b[0] >= 1 - EPS) ||
    (a[1] <= EPS && b[1] <= EPS) || (a[1] >= 1 - EPS && b[1] >= 1 - EPS);
  const X = (p) => box.x + p[0] * box.w, Y = (p) => box.y + p[1] * box.h;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      if (!onEdge(a) || !onEdge(b) || !sameSide(a, b)) continue;
      ctx.moveTo(X(a), Y(a)); ctx.lineTo(X(b), Y(b));
    }
    if (pass === 0) { ctx.shadowColor = 'rgba(255,190,70,0.8)'; ctx.shadowBlur = 9; ctx.strokeStyle = '#e9b45c'; ctx.lineWidth = 3.4; }
    else { ctx.shadowBlur = 0; ctx.strokeStyle = '#ffe6a8'; ctx.lineWidth = 1.3; }
    ctx.stroke();
  }
  ctx.restore();
}
function drawDragonPuzzle(box, d, slots, opt){
  opt = opt || {};
  const n = opt.n || CONFIG.PIECES_PER_DRAGON;
  const gold = opt.gold || [];
  const shapes = pieceShapes(n);
  const shown = {};
  (slots || []).forEach((sl, k) => { shown[sl] = k; });
  const got = (slots || []).length;

  
  const sealed = 1 - got / n;
  const fw = Math.max(5, box.w * 0.032);
  ctx.save();
  ctx.shadowColor = 'rgba(179,155,255,' + (0.15 + 0.5 * sealed) + ')'; ctx.shadowBlur = 14 + 10 * sealed;
  rrect(box.x - fw, box.y - fw, box.w + 2 * fw, box.h + 2 * fw, fw * 1.2);
  ctx.fillStyle = opt.dark ? '#1b1626' : '#6f6656'; ctx.fill();
  ctx.restore();
  const fg = ctx.createLinearGradient(box.x, box.y, box.x + box.w, box.y + box.h);
  fg.addColorStop(0, 'rgba(255,255,255,0.35)'); fg.addColorStop(0.5, 'rgba(255,255,255,0.06)'); fg.addColorStop(1, 'rgba(0,0,0,0.5)');
  rrect(box.x - fw, box.y - fw, box.w + 2 * fw, box.h + 2 * fw, fw * 1.2);
  ctx.strokeStyle = fg; ctx.lineWidth = 2; ctx.stroke();

  
  for (let idx = 0; idx < n; idx++) if (!(idx in shown)) drawStoneFill(box, shapes[idx], opt.dark);
  if (got < n) {
    ctx.save();
    ctx.beginPath();
    for (let idx = 0; idx < n; idx++) if (!(idx in shown)) { const poly = shapes[idx]; poly.forEach((p, i) => { const x = box.x + p[0] * box.w, y = box.y + p[1] * box.h; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }); ctx.closePath(); }
    ctx.clip();
    drawSealMark(box, opt.dark);
    ctx.restore();
  }
  for (let idx = 0; idx < n; idx++) {
    if (idx in shown) continue;
    ctx.save();
    piecePath(box, shapes[idx]);
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.clip();
    piecePath(box, shapes[idx], 1.2, 1.2);
    ctx.strokeStyle = opt.dark ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  for (let idx = 0; idx < n; idx++) {
    if (!(idx in shown)) continue;
    const poly = shapes[idx];
    
    let dy = 0, sc = 1, al = 1, rot = 0;
    if (opt.popIdx === idx && opt.pop != null) {
      const p = opt.pop;                     
      const e2 = 1 - Math.pow(1 - Math.min(1, p * 1.25), 3);
      dy = (1 - e2) * 120;
      sc = 1 + (1 - e2) * 0.5;
      rot = (1 - e2) * 0.35;
      al = Math.min(1, p * 3);
      if (p > 0.8) { const q = (p - 0.8) / 0.2; sc = 1 + 0.07 * Math.sin(q * Math.PI); }
    }
    const c = pieceCenter(box, poly);
    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(c.x, c.y + dy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-c.x, -c.y);
    
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    piecePath(box, poly); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
    ctx.save();
    piecePath(box, poly); ctx.clip();
    drawDragonArt(box, d);
    ctx.restore();
    
    const isGold = gold.indexOf(idx) >= 0;
    piecePath(box, poly);
    ctx.strokeStyle = 'rgba(20,12,30,0.75)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
    if (isGold) strokeOuterEdges(box, poly);
    ctx.restore();
  }
}

    if (S.introFrom === 'map') { S.intro = false; S.teach = null; S.mode = 'map'; S.t = 0; sfxTap(); return; }
    newBattle();
    return;
  }
  if (S.teachFrom === 'play') {          
    S.teach = null; S.teachFrom = null; S.mode = 'play'; S.t = 0;
    return;
  }
  S.teachFrom = null;
  nextQuestion();                        
}

function makeKindBag(){
  const st = stageById(S.stage);
  const kinds = st.kinds || CONFIG.KIND_BAG;
  const base = kinds.slice(0, CONFIG.QUESTIONS_PER_SET);
  while (base.length < CONFIG.QUESTIONS_PER_SET) base.push(kinds[0] || 'all');
  for (let t = 0; t < 40; t++) {
    for (let i = base.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const x = base[i]; base[i] = base[j]; base[j] = x;
    }
    let run = 1, bad = false;
    for (let i = 1; i < base.length; i++) {
      run = (base[i] === base[i-1]) ? run + 1 : 1;
      if (run >= 3) { bad = true; break; }
    }
    if (!bad) break;
  }
  return base;
}

function bossBag(gi){
  const ids = pageStages(gi).filter(st => st.unlocked).map(st => st.id);
  if (!ids.length) return [];
  const bag = [];
  while (bag.length < CONFIG.BOSS_QS) bag.push(ids[bag.length % ids.length]);
  for (let t = 0; t < 60; t++) {
    shuffleArr(bag);
    let run = 1, bad = false;
    for (let i = 1; i < bag.length; i++) { run = (bag[i] === bag[i-1]) ? run + 1 : 1; if (run >= 3) { bad = true; break; } }
    if (!bad) break;
  }
  return bag;
}

function bossArt(gi){
  const list = pageStages(gi);
  const a = enemyFor(list[list.length - 1].id);
  return Object.assign({}, a, { tint: null, tintA: 0 });

function spawnShards(x, y, n, strong){
  for (let i = 0; i < n; i++) {

      x: x + (Math.random() - 0.5) * (strong ? 120 : 78),
      y: y + (Math.random() - 0.5) * 56,
      vx: Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1),
      vy: Math.sin(a) * sp,
      r: (Math.random() < 0.5 ? 1 : -1) * (2 + Math.random() * 5),
      a: Math.random() * 6.28,
      s: (strong ? 7 : 4) + Math.random() * 6,
      t: 0, life: 0.5 + Math.random() * 0.5,
    });
  }
}
function enemyHit(){
  const e = S.enemy;

  e.hp = Math.max(0, e.hp - 1);
  S.hitFx = 1;
  e.knockT = 1;
  e.whiteT = 1;

  S.combo++;
  S.comboPop = 1;
  S.slashN = CONFIG.COMBO_SLASH[Math.min(S.combo - 1, CONFIG.COMBO_SLASH.length - 1)];
  S.slashT = 1;
  
  if (S.boss) {
    const stt = bossState(S.boss.gi);
    const crit = S.slashN >= 3;
    const mult = 1 + 0.15 * Math.max(0, S.combo - 1);
    const dmg = Math.max(1, Math.round(stt.atk * mult * (crit ? 2 : 1)));
    S.boss.dmg += dmg;
    if (crit) S.boss.crits++;
    
    const seq = S.results.filter(Boolean).length;
    S.dmgPops.push({ v: dmg, crit, t: 0,

    if (S.dmgPops.length > 4) S.dmgPops.shift();

  S.finish = S.boss
    ? (S.results.filter(Boolean).length >= CONFIG.BOSS_MIN_OK)

  const st = stageById(S.stage);

  let hiddenAt = null;
  if (S.kind === 'hidden') {
    hiddenAt = {};
    const B = playBasis();

    for (let k = 0; k < vf.cubes.length; k++) {
      if (vf.flags[k]) continue;

      (hiddenAt[key] || (hiddenAt[key] = [])).push(c.y);
    }

      if (k < this.cols.length) { const c = this.cols[k]; this.sum += this.val(c.i, c.j); sfxCount(k); }
      else sfxSum();
    },
    msgFn(){
      const k = this.shown - 1, n = this.cols.length;
      if (k < 0) {
        if (kind === 'hidden') return '真上から見て、柱ごとに\nかくれている数を 数える';
        if (kind === 'cols')   return '真上から見た形を出して\nマスを1つずつ 数える';
        return '真上から見て、柱ごとに\n何こ積んであるか 数える';
      }
      if (k < n) {
        const c = this.cols[k], v = this.val(c.i, c.j);
        if (kind === 'hidden') return 'この柱で かくれているのは ' + v + 'こ\n（' + (k + 1) + '本目 ／ ぜんぶで ' + n + '本）';
        if (kind === 'cols')   return 'ここに 柱が 1本 立っている\n（' + (k + 1) + 'マス目）';
        return 'この柱は ' + v + 'こ\n（' + (k + 1) + '本目 ／ ぜんぶで ' + n + '本）';
      }
      if (kind === 'hidden') return 'たすと ' + this.sum + '。\nかくれているのは ' + this.sum + 'こ';
      if (kind === 'cols')   return '上から見ると\n' + this.sum + 'マス';
      return 'たすと ' + this.sum + '。\nぜんぶで ' + this.sum + 'こ';
    },
  };
  S.teach = T;
  S.mode = 'teach'; S.t = 0;
}

function teachStep(){
  const T = S.teach;
  if (!T || T.phase !== 'step') return;
  if (T.shown >= T.total) { T.phase = 'wait'; S.t = 0; return; }
  T.onStep(T.shown);
  T.shown++;
  T.tStep = 0; S.t = 0;
  if (T.shown >= T.total) T.phase = 'wait';
}

function replayTeach(){
  const T = S.teach;
  T.phase = 'step'; T.shown = 0; T.sum = 0; T.tStep = 0; T.lay = 1;
  if (T.onReset) T.onReset();
  S.t = 0;
}

function nextQuestion(){

function finishBattle(){
  if (S.boss) return finishBoss();

  const wasPerfect = isPerfect(S.stage), wasGold = dragonGold(gi);
  if (!save.cleared) save.cleared = {};

  if (!save.best) save.best = {};
  if (ok > (save.best[S.stage] || 0)) save.best[S.stage] = ok;
  const got = passed && !save.cleared[S.stage];
  if (got) save.cleared[S.stage] = true;

  let completed = false;

  }

  S.win = {
    phase: 'defeat',

    goldGot: perfect && !wasPerfect,          
    goldNow: dragonGold(gi) && !wasGold,

    dragon: DRAGONS[gi],
    doneDragon: DRAGONS[gi],
  };
  S.mode = 'win'; S.t = 0;
  bgmStop();
  
  if (!passed) { S.win.phase = 'fail'; if (S.enemy) S.enemy.fallT = -999; sfxHurt(); return; }
  if (S.enemy) S.enemy.fallT = 0;
  sfxDefeat();
}


function update(dt){
  
  if (S.freeze > 0) { S.freeze = Math.max(0, S.freeze - dt); return; }
  S.t += dt;
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.2);
  if (S.kindPop > 0) S.kindPop = Math.max(0, S.kindPop - dt * 2.0);
  if (S.comboPop > 0) S.comboPop = Math.max(0, S.comboPop - dt * 1.8);
  if (S.slashT > 0) S.slashT = Math.max(0, S.slashT - dt * 3.4);
  if (S.hpFlash > 0) S.hpFlash = Math.max(0, S.hpFlash - dt * 3.0);
  if (motes) for (const m of motes) { m.y += m.sp * dt; if (m.y > 1.05) { m.y = -0.05; m.x = Math.random() * W; } }
  if (S.impact > 0) S.impact = Math.max(0, S.impact - dt / (S.finish ? 0.75 : 0.34));
  if (S.hintT > 0) S.hintT = Math.max(0, S.hintT - dt / 2.0);
  
  for (let i = S.shards.length - 1; i >= 0; i--) {
    const p = S.shards[i];
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 620 * dt;
    p.a += p.r * dt;
    if (p.t >= p.life) S.shards.splice(i, 1);
  }
  
  if (S.breathT > 0) S.breathT = Math.max(0, S.breathT - dt * 1.6);
  if (S.dmgPops) for (let i = S.dmgPops.length - 1; i >= 0; i--) {
    S.dmgPops[i].t += dt;
    if (S.dmgPops[i].t > 1.1) S.dmgPops.splice(i, 1);
  }
  if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
  if (S.hitFx > 0) S.hitFx = Math.max(0, S.hitFx - dt / CONFIG.T_HIT);
  if (S.enemy) {
    if (S.enemy.hurtT > 0) S.enemy.hurtT = Math.max(0, S.enemy.hurtT - dt);
    if (S.enemy.knockT > 0) S.enemy.knockT = Math.max(0, S.enemy.knockT - dt / CONFIG.T_KNOCK);
    if (S.enemy.whiteT > 0) S.enemy.whiteT = Math.max(0, S.enemy.whiteT - dt * 5.5);
    if (S.enemy.introT < 1) S.enemy.introT = Math.min(1, S.enemy.introT + dt / CONFIG.T_INTRO);
    
    const d = S.enemy.hp - S.enemy.hpShown;
    S.enemy.hpShown += d * Math.min(1, dt * 7);
    if (Math.abs(d) < 0.02) S.enemy.hpShown = S.enemy.hp;
    if (S.mode === 'win' && S.win && S.win.phase !== 'fail') S.enemy.fallT += dt;
  }

  if (S.mode === 'win') {
    const w = S.win;
    
    if (w.isBoss) { if (S.breathT > 0) S.breathT = Math.max(0, S.breathT - dt * 1.6); return; }
    updateWinFx(dt);
    if (w.phase === 'defeat' && S.t >= CONFIG.T_DEFEAT) {
      w.phase = 'piece'; S.t = 0; winStartPiece();
      if (w.completed || w.goldNow) setTimeout(() => { if (!muted) sfxDragon(); }, 700);
    } else if (w.phase === 'piece' && S.t >= CONFIG.T_PIECE) {
      w.phase = 'done'; S.t = 0;
    }
  }
  else if (S.mode === 'correct') {
    if (S.t >= CONFIG.T_CORRECT) nextQuestion();
  }
  else if (S.mode === 'teach') {
    const T = S.teach;
    if (T.phase !== 'in') T.lay = 1;
    else T.lay = Math.min(1, S.t / CONFIG.T_TEACH_ROT);
    
    if (T.phase === 'in') {
      if (S.t >= CONFIG.T_TEACH_ROT) { T.phase = 'step'; S.t = 0; T.tStep = 0; }
    } else if (T.phase === 'step' || T.phase === 'wait') {
      T.tStep += dt;
    }
  }
}

function teachLay(){ return S.teach ? ease(Math.min(1, S.teach.lay)) : 0; }
function ease(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }



const QUIT_BTN = { x: 18, y: 22, r: 11 };
function hitQuit(lx, ly){
  const dx = lx - QUIT_BTN.x, dy = ly - QUIT_BTN.y;
  return dx*dx + dy*dy < (QUIT_BTN.r + 8) * (QUIT_BTN.r + 8);
}
function drawQuitBtn(){

  ctx.save();
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = CONFIG.C_INK_SOFT; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 2.2; ctx.lineCap = 'round';

function drawTopHint(){

  const f = figArea();
  const cx = W/2, cy = f.y + f.h/2;
  const p = 1 - S.hintT;                 
  const k = Math.min(1, p / 0.55);       
  const fade = p < 0.75 ? 1 : Math.max(0, 1 - (p - 0.75) / 0.25);
  const rx = 128, ry = 104;
  const a0 = Math.PI * 0.42, a1 = -Math.PI * 0.5;   
  const a = a0 + (a1 - a0) * ease(k);

  ctx.save();
  ctx.globalAlpha = fade;
  
  ctx.strokeStyle = CONFIG.C_INK_SOFT; ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, a0, a, true);
  ctx.stroke();
  ctx.setLineDash([]);

  const ex = cx + Math.cos(a) * rx, ey = cy + Math.sin(a) * ry;
  
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(a + Math.PI/2);
  ctx.beginPath();
  ctx.moveTo(-15, 0); ctx.quadraticCurveTo(0, -10, 15, 0);
  ctx.quadraticCurveTo(0, 10, -15, 0);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, Math.PI*2);
  ctx.fillStyle = CONFIG.C_INK; ctx.fill();
  ctx.restore();

  
  if (k >= 1) {
    const q = Math.min(1, (p - 0.55) / 0.2);
    ctx.save();
    ctx.globalAlpha = fade * (0.25 + 0.75 * q);
    ctx.strokeStyle = CONFIG.C_INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const dx of [-30, 0, 30]) {

function drawFloorPlate(B, fit){
  const n = S.g.length;
  let iMin = n, iMax = 0, jMin = n, jMax = 0, any = false;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if (S.g[i][j] > 0) {
      any = true;
      if (i < iMin) iMin = i; if (i + 1 > iMax) iMax = i + 1;
      if (j < jMin) jMin = j; if (j + 1 > jMax) jMax = j + 1;
    }
  }
  if (!any) return;
  const m = 0.7;
  const P = (x, z) => {
    const q = proj(B, x, 0, z);
    return [ q[0]*fit.S + fit.ox, q[1]*fit.S + fit.oy ];
  };
  const quad = [ P(iMin-m, jMin-m), P(iMax+m, jMin-m), P(iMax+m, jMax+m), P(iMin-m, jMax+m) ];
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 2.4);
  ctx.save();
  poly(quad, 'rgba(120,96,196,0.13)', null);
  ctx.globalAlpha = 0.35 + 0.4 * pulse;
  poly(quad, null, '#8c7ad6', 2.4);
  ctx.restore();
}

function drawFigure(){
  const stQ = stageById(S.stage);
  if (stQ.drawQ) { stQ.drawQ(figArea()); return; }
  const B = playBasis();                 
  if (!S.fit) S.fit = fitFor(S.g, B, figAreaFor(S.kind));
  let fit = S.fit;
  if (S.mode === 'teach') {
    const t = teachLay();
    const f1 = fitFor(S.g, B, teachAreas().left);
    fit = { S:  S.fit.S  + (f1.S  - S.fit.S)  * t,
            ox: S.fit.ox + (f1.ox - S.fit.ox) * t,
            oy: S.fit.oy + (f1.oy - S.fit.oy) * t };
  }

  ctx.save();
  if (S.shakeT > 0) {
    const k = S.shakeT * 14;
    ctx.translate(Math.sin(S.shakeT * 60) * k, 0);
  }
  if (S.mode === 'correct') {
    const p = 1 + 0.06 * Math.sin(Math.min(1, S.t / CONFIG.T_CORRECT) * Math.PI);
    ctx.translate(W/2, figArea().y + figArea().h/2);
    ctx.scale(p, p);
    ctx.translate(-W/2, -(figArea().y + figArea().h/2));
  }

  const marks = [];
  let hi = null;
  if (S.mode === 'play') {
    for (const key in S.assistOn) {
      const [i, j] = key.split(',').map(Number);
      marks.push({ i, j, color: CONFIG.C_INK });
    }
  } else if (S.mode === 'teach') {
    const T = S.teach;
    
    if (T.phase === 'step' && T.shown > 0 && T.shown <= T.cols.length) hi = T.cols[T.shown - 1];
  }
  
  if (S.kind === 'cols' && (S.mode === 'play' || S.mode === 'wrong' || S.mode === 'correct')) {
    drawFloorPlate(B, fit);
  }
  drawShape(S.g, B, fit, { marks, hi });

  
  if (S.mode === 'teach' && hi && S.teach.hiddenAt) {
    const ys = S.teach.hiddenAt[hi.i + ',' + hi.j];
    if (ys && ys.length) {
      const blink = 0.45 + 0.4 * Math.abs(Math.sin(S.t * 6.5));
      ctx.save();
      for (const y of ys) {
        const f = cubeFaces(B, hi.i, y, hi.j, fit.S, fit.ox, fit.oy);
        ctx.globalAlpha = blink * 0.85;
        poly(f.left,  CONFIG.C_HI_L, null);
        poly(f.right, CONFIG.C_HI_R, null);
        poly(f.top,   CONFIG.C_HI_T, null);
        ctx.globalAlpha = blink;
        ctx.setLineDash([4, 3]);
        poly(f.left, null, '#c9632a', 2);
        poly(f.right, null, '#c9632a', 2);
        poly(f.top, null, '#c9632a', 2);
        ctx.setLineDash([]);
      }
      ctx.restore();
    }
  }
  ctx.restore();
}


function drawTopView(area, alpha){
  const g = S.g, n = g.length, T = S.teach;
  let iMin = n, iMax = 0, jMin = n, jMax = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (g[i][j] > 0) {
    if (i < iMin) iMin = i; if (i > iMax) iMax = i;
    if (j < jMin) jMin = j; if (j > jMax) jMax = j;
  }
  const cols = iMax - iMin + 1, rows = jMax - jMin + 1;
  const cs = Math.min(area.w * 0.92 / cols, area.h * 0.92 / rows, 50);
  const ox = area.x + area.w/2 - cols * cs / 2;
  const oy = area.y + area.h/2 - rows * cs / 2;

  const hi = (T.phase === 'step' && T.shown > 0 && T.shown <= T.cols.length) ? T.cols[T.shown - 1] : null;
  const shownSet = {};
  for (let k = 0; k < Math.min(T.shown, T.cols.length); k++) shownSet[T.cols[k].i + ',' + T.cols[k].j] = k;

  ctx.save();
  ctx.globalAlpha = alpha;
  for (let j = jMin; j <= jMax; j++) for (let i = iMin; i <= iMax; i++) {
    const x = ox + (i - iMin) * cs, y = oy + (j - jMin) * cs;
    const filled = g[i][j] > 0;
    const lit = hi && hi.i === i && hi.j === j;
    ctx.beginPath(); ctx.rect(x, y, cs, cs);
    ctx.fillStyle = filled ? (lit ? CONFIG.C_HI_T : '#ffffff') : 'rgba(0,0,0,0.035)';
    ctx.fill();
    ctx.strokeStyle = filled ? CONFIG.C_EDGE : CONFIG.C_GRID;
    ctx.lineWidth = filled ? 1.7 : 1;
    ctx.stroke();
    if (filled) {
      const key = i + ',' + j;
      if (key in shownSet) {
        const k = shownSet[key];
        const age = (T.shown - k - 1) * CONFIG.T_TEACH_STEP + Math.min(T.tStep, CONFIG.T_TEACH_STEP);
        const pop = Math.min(1, Math.max(0, age) / 0.16);
        const v = T.val(i, j);
        ctx.save();
        ctx.translate(x + cs/2, y + cs/2 + 1);
        ctx.scale(0.5 + 0.5 * pop, 0.5 + 0.5 * pop);
        
        text(String(v), 0, 0, Math.round(cs * 0.56), v === 0 ? CONFIG.C_INK_SOFT : CONFIG.C_INK);
        ctx.restore();
      }
    }
  }
  ctx.restore();
}
